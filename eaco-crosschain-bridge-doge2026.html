<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EACO Cross-Chain Bridge Explorer 2026</title>
<meta name="description" content="EACO 跨链桥探索 2026：结合 SOL、wBNB、wETH、wBTC、USDT、USDC，探索 EACO 与 Earthcoin(EAC) 跨链可行性分析 · 六语言网站">
<style>
:root{
  --bg:#070d1a; --bg2:#0b1426; --card:#101d33; --card2:#0e1930;
  --line:#1e3354; --line2:#2b4a78;
  --txt:#e8f1ff; --dim:#9db4d6; --faint:#6f87ab;
  --acc:#2ee6a8; --acc2:#4d9fff; --warn:#ffb454; --bad:#ff6b6b; --gold:#ffd166;
  --r:14px; --r-s:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:"Consolas","SFMono-Regular","Cascadia Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans","Tahoma",Arial,sans-serif;
  line-height:1.65;min-height:100vh;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
[dir="rtl"] body{font-family:"Segoe UI","Tahoma","Noto Kufi Arabic",Arial,sans-serif}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--mono);font-size:.8em;word-break:break-all}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(7,13,26,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:var(--txt);font-weight:700;font-size:1.05rem;white-space:nowrap}
.logo svg{flex:none}
.brand-sub{font-size:.68rem;color:var(--faint);font-weight:400;letter-spacing:.06em}
nav.main{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
nav.main a{padding:7px 11px;border-radius:8px;color:var(--dim);font-size:.88rem;transition:background .2s}
nav.main a:hover{background:var(--card2);color:var(--txt);text-decoration:none}
.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang button{padding:5px 9px;border-radius:7px;font-size:.78rem;color:var(--dim);border:1px solid transparent}
.lang button:hover{color:var(--txt)}
.lang button.on{background:rgba(46,230,168,.14);color:var(--acc);border-color:rgba(46,230,168,.4)}
#menuBtn{display:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--txt)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:84px 0 60px;text-align:center;background:
  radial-gradient(1200px 500px at 15% -10%,rgba(46,230,168,.14),transparent 60%),
  radial-gradient(1000px 480px at 85% -20%,rgba(77,159,255,.16),transparent 60%),
  radial-gradient(900px 420px at 50% 120%,rgba(255,209,102,.07),transparent 60%),var(--bg)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 70%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 85% 60%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 10% 80%,#fff4 50%,transparent 51%),radial-gradient(1.2px 1.2px at 55% 45%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 90% 10%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 30% 55%,#fff3 50%,transparent 51%);
  animation:tw 9s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.hero .wrap{position:relative;z-index:1}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line2);border-radius:99px;color:var(--acc);font-size:.8rem;letter-spacing:.08em;background:rgba(46,230,168,.06)}
h1.hero-title{font-size:clamp(1.9rem,5vw,3.3rem);line-height:1.18;margin:20px 0 6px;font-weight:800}
h1 .g{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{max-width:780px;margin:14px auto 0;color:var(--dim);font-size:1.03rem}
.hero-meta{margin-top:18px;color:var(--faint);font-size:.82rem}
.hero-anno{margin:16px auto 0;max-width:780px;padding:10px 14px;border:1px dashed rgba(46,230,168,.45);border-radius:10px;color:var(--dim);font-size:.88rem;background:rgba(46,230,168,.05)}
.cta{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:11px;font-weight:600;font-size:.95rem;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--acc),#1fc98f);color:#04231a;box-shadow:0 8px 24px rgba(46,230,168,.3)}
.btn-ghost{border:1px solid var(--line2);color:var(--txt);background:rgba(13,24,44,.5)}
.btn-ghost:hover{box-shadow:0 8px 24px rgba(77,159,255,.15)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-28px;position:relative;z-index:2}
.stat{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.7rem;color:var(--acc);line-height:1.2}
.stat span{color:var(--dim);font-size:.82rem}

/* ---------- sections ---------- */
section{padding:60px 0 10px}
.sec-tag{color:var(--acc);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
h2.sec-title{font-size:clamp(1.4rem,3vw,2rem);margin:8px 0 6px;font-weight:800}
.sec-sub{color:var(--dim);max-width:820px;margin-bottom:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.doge-flow{overflow-x:auto;padding:6px 0}
.df-inner{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.df-node{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.82rem;background:linear-gradient(165deg,var(--card),var(--bg2));max-width:230px}
.df-arrow{align-self:center;color:var(--acc);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:linear-gradient(165deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .2s}
.card:hover{border-color:var(--line2)}
.card h3{font-size:1.02rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card p{color:var(--dim);font-size:.9rem}
.card .ico{width:26px;height:26px;flex:none;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:rgba(46,230,168,.12)}

/* ---------- assets ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.filters button{padding:7px 14px;border-radius:9px;border:1px solid var(--line);color:var(--dim);font-size:.85rem}
.filters button.on{background:rgba(77,159,255,.15);color:var(--acc2);border-color:rgba(77,159,255,.5)}
.faq-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.faq-filters button{padding:7px 14px;border-radius:9px;border:1px solid var(--line);color:var(--dim);font-size:.85rem;background:transparent;cursor:pointer}
.faq-filters button.on{background:rgba(77,159,255,.15);color:var(--acc2);border-color:rgba(77,159,255,.5)}
.f-search{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.f-search input{background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:8px 12px;width:200px;font-size:.85rem}
.chain-panel{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:linear-gradient(170deg,var(--card),var(--bg2))}
.chain-head{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(13,24,44,.6)}
.chain-head .dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot-s{background:#9945ff;box-shadow:0 0 12px #9945ff}
.dot-b{background:#f0b90b;box-shadow:0 0 12px #f0b90b}
.dot-e{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.dot-d{background:#c2a633;box-shadow:0 0 12px #c2a633}
.chain-head h3{font-size:1.05rem}
.chain-head small{color:var(--faint)}
.tlist{padding:12px}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px 8px;border-bottom:1px dashed rgba(46,94,150,.3)}
.trow:last-child{border-bottom:none}
.trow .tmain{flex:1;min-width:0}
.trow .tname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.68rem;letter-spacing:.04em;white-space:nowrap}
.b-native{background:rgba(46,230,168,.12);color:var(--acc)}
.b-wrap{background:rgba(77,159,255,.13);color:var(--acc2)}
.b-peg{background:rgba(240,185,11,.12);color:var(--gold)}
.b-plan{background:rgba(255,180,84,.12);color:var(--warn)}
.b-cust{background:rgba(255,209,102,.1);color:var(--gold)}
.s-ok{color:var(--acc)} .s-warn{color:var(--warn)} .s-plan{color:var(--acc2)}
.trow .addr{color:var(--faint);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copy{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.7rem;color:var(--dim)}
.copy:hover{color:var(--acc);border-color:var(--acc)}
.tlinks{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.tlinks a{font-size:.76rem;color:var(--acc2)}
.tdesc{color:var(--faint);font-size:.78rem;margin-top:2px}

/* ---------- bridge ---------- */
.arch{padding:16px;height:100%}
.arch .ico{width:30px;height:30px}
.carrier-tbl{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
.carrier-tbl th{color:var(--faint);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.75rem;letter-spacing:.06em}
.carrier-tbl td{padding:9px 10px;border-bottom:1px solid rgba(46,94,150,.22)}
.carrier-tbl tr:last-child td{border-bottom:none}
.carrier-tbl td a{font-size:.78rem}
.arrow{color:var(--faint);font-size:.85rem}
.route-demo{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
.route-demo select{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;color:var(--txt);padding:11px 14px;font-size:.92rem;width:100%;max-width:520px}
.route-out{margin-top:4px;padding:16px 18px;border-radius:var(--r-s);border:1px solid rgba(46,230,168,.35);background:rgba(46,230,168,.06);color:var(--txt);font-size:.92rem;min-height:64px}

/* ---------- verdicts ---------- */
.verdict{border-inline-start:4px solid var(--acc);padding-inline-start:14px}
.verdict.w{border-inline-start-color:var(--warn)}
.verdict h3{font-size:1rem;color:var(--txt)}
.verdict p{color:var(--dim);font-size:.9rem}
.feas-title{margin:34px 0 4px;font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px}
.feas-title .n{color:var(--acc);font-size:.85rem}
details.acc{border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:10px;background:var(--bg2)}
details.acc summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--acc);font-size:1.2rem;transition:transform .2s}
details.acc[open] summary::after{transform:rotate(45deg)}
details.acc .bk{padding:0 16px 16px;color:var(--dim);font-size:.92rem}
.earth-panel{border:1px solid rgba(46,230,168,.4);background:radial-gradient(600px 300px at 80% 0%,rgba(46,230,168,.1),transparent),var(--bg2);border-radius:var(--r);padding:8px 22px 18px;margin-bottom:20px}
.prec-item{display:flex;gap:12px;padding:12px;border-bottom:1px dashed rgba(46,94,150,.3);font-size:.9rem}
.prec-item:last-child{border-bottom:none}
.prec-item b{color:var(--txt)}
.prec-item p{color:var(--dim);font-size:.85rem}
.prec-item a{font-size:.78rem}

/* ---------- roadmap ---------- */
.tl{position:relative;margin:14px 0 0;padding-inline-start:26px}
.tl::before{content:"";position:absolute;inset:8px auto 8px 8px;width:2px;background:linear-gradient(180deg,var(--acc),var(--line2));border-radius:2px}
.tl-item{position:relative;padding-bottom:22px}
.tl-item::before{content:"";position:absolute;inset:6px auto auto -26px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(46,230,168,.15)}
.tl-item h4{font-size:1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tl-item .ph{background:rgba(46,230,168,.12);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:.72rem}
.tl-item p{color:var(--dim);font-size:.9rem;margin-top:4px}

/* ---------- risks ---------- */
.risk-card{border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg2);padding:16px}
.risk-card .lvl{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;padding:3px 9px;border-radius:6px;margin-bottom:8px}
.lvl-1{background:rgba(46,230,168,.1);color:var(--acc)}
.lvl-2{background:rgba(255,180,84,.12);color:var(--warn)}
.lvl-3{background:rgba(255,107,107,.12);color:var(--bad)}
.risk-card h4{font-size:.95rem;margin-bottom:6px}
.risk-card p{color:var(--dim);font-size:.84rem}
.risk-card .mit{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--acc2)}

/* ---------- faq ---------- */
.faq-count{color:var(--faint);font-size:.82rem;margin-bottom:12px}
.faq-count b{color:var(--acc)}
.faq-list{display:flex;flex-direction:column;gap:10px}
.faq-item{border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg2);overflow:hidden;transition:border-color .2s}
.faq-item:hover{border-color:var(--line2)}
.faq-item.open{border-color:rgba(46,230,168,.5)}
.faq-q{width:100%;display:flex;align-items:flex-start;gap:10px;padding:14px 16px;text-align:start;color:var(--txt);font-size:.95rem;font-weight:600;line-height:1.5}
.faq-q .fn{flex:none;color:var(--acc);font-size:.76rem;padding-top:3px;font-family:var(--mono)}
.faq-q .pm{margin-inline-start:auto;flex:none;color:var(--faint);font-size:1.05rem;transition:transform .2s;padding-top:1px}
.faq-item.open .pm{transform:rotate(45deg);color:var(--acc)}
.faq-a{display:none;padding:0 16px 14px;color:var(--dim);font-size:.9rem;line-height:1.75}
.faq-item.open .faq-a{display:block}
.faq-a .ans{display:inline}
.faq-empty{padding:30px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:var(--r-s);font-size:.9rem}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:60px;background:var(--bg2)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px;padding:36px 0 20px}
footer h5{font-size:.85rem;margin-bottom:10px;color:var(--txt)}
footer p,footer li{color:var(--dim);font-size:.82rem;list-style:none}
footer ul li{margin-bottom:6px}
.foot-bar{border-top:1px solid var(--line);padding:16px 0 22px;color:var(--faint);font-size:.75rem}
.foot-bar .mono{color:var(--dim)}

/* ---------- responsive ---------- */
@media (max-width:940px){
  .grid3{grid-template-columns:1fr 1fr}
  nav.main{order:5;width:100%;display:none;flex-direction:column;padding-bottom:10px}
  nav.main.open{display:flex}
  #menuBtn{display:inline-flex}
  .stats{grid-template-columns:repeat(2,1fr)}
  .foot-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:768px){
  .grid2{grid-template-columns:1fr}
  .f-search{margin-inline-start:0;width:100%}
  .f-search input{flex:1;width:auto}
}
@media (max-width:480px){
  .grid3{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .hero{padding:64px 0 44px}
  .cta{flex-direction:column}
  .btn{justify-content:center}
  .foot-grid{grid-template-columns:1fr}
}
[dir="rtl"] .arrow{display:inline-block;transform:scaleX(-1)}
[dir="rtl"] .hero::before,[dir="rtl"] .tl::before{right:8px;left:auto}
[dir="rtl"] .tl{padding-inline-start:0;padding-inline-end:26px}
[dir="rtl"] .tl-item::before{inset:6px auto auto auto;right:-26px;left:auto}
@media print{ .hdr,.lang,#menuBtn,.copy{display:none} }
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="logo" href="#hero" aria-label="EACO">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="url(#lg1)" stroke-width="2"/>
        <ellipse cx="16" cy="16" rx="7" ry="14" stroke="#4d9fff" stroke-width="1.4" transform="rotate(32 16 16)"/>
        <ellipse cx="16" cy="16" rx="14" ry="6" stroke="#2ee6a8" stroke-width="1.4" transform="rotate(-58 16 16)"/>
        <circle cx="16" cy="16" r="3" fill="#2ee6a8"/>
        <defs><linearGradient id="lg1" x1="2" y1="2" x2="30" y2="30"><stop stop-color="#2ee6a8"/><stop offset="1" stop-color="#4d9fff"/></linearGradient></defs>
      </svg>
      <span><span data-i18n="brand">EACO 跨链桥探索 2026</span><br><span class="brand-sub" data-i18n="brandSub">地球村跨链可行性研究</span></span>
    </a>
    <button id="menuBtn" aria-label="menu">☰</button>
    <nav class="main" id="nav">
      <a href="#assets" data-i18n="navAssets">资产地图</a>
      <a href="#bridge" data-i18n="navBridge">跨链机制</a>
      <a href="#doge" data-i18n="navDoge">DOGE 跨链 EACO</a>
      <a href="#feas" data-i18n="navFeas">可行性分析</a>
      <a href="#roadmap" data-i18n="navRoad">路线图</a>
      <a href="#risk" data-i18n="navRisk">风险清单</a>
      <a href="#crowd" data-i18n="navCrowd">众筹探索</a>
      <a href="#faq" data-i18n="navFaq">100 问</a>
    </nav>
    <div class="lang" id="langBox"><span style="color:var(--faint);font-size:.75rem" data-i18n="langLabel">语言</span></div>
  </div>
</header>

<main>
  <!-- hero -->
  <section class="hero" id="hero">
    <div class="wrap">
      <span class="tag" data-i18n="heroTag">探索报告 · 2026</span>
      <h1 class="hero-title" data-i18n="heroTitle">EACO 跨链桥探索<br><span class="g">让 Earthcoin 走进地球村</span></h1>
      <p class="hero-sub" data-i18n="heroSub"></p>
      <p class="hero-anno" data-i18n="nameNote"></p>
      <div class="cta"><a class="btn btn-primary" href="#assets" data-i18n="ctA">查看资产地图</a><a class="btn btn-ghost" href="#feas" data-i18n="ctB">阅读可行性分析</a></div>
      <p class="hero-meta" data-i18n="heroMeta"></p>
    </div>
  </section>

  <!-- stats -->
  <div class="wrap"><div class="stats" id="statsBox"></div></div>

  <!-- assets -->
  <section id="assets">
    <div class="wrap">
      <span class="sec-tag" data-i18n="assetsTag">资产地图</span>
      <h2 class="sec-title" data-i18n="assetsTitle"></h2>
      <p class="sec-sub" data-i18n="assetsSub"></p>
      <div class="filters">
        <button class="on" data-f="all" data-i18n="fAll">全部</button>
        <button data-f="sol" data-i18n="fSol">Solana</button>
        <button data-f="bsc" data-i18n="fBsc">BNB Chain</button>
        <button data-f="doge" data-i18n="fDoge">Dogecoin</button>
        <button data-f="eac" data-i18n="fEarth">Earthcoin</button>
        <div class="f-search"><input id="searchBox" type="search" placeholder="" data-i18n-ph="searchPh"><button class="btn btn-ghost" id="clearSearch" data-i18n="clearB">重置</button></div>
      </div>
      <div class="grid2" id="chainGrid"></div>
    </div>
  </section>

  <!-- bridge -->
  <section id="bridge">
    <div class="wrap">
      <span class="sec-tag" data-i18n="bridgeTag">跨链机制</span>
      <h2 class="sec-title" data-i18n="bridgeTitle"></h2>

heroSub:{en:"In 2026 we explore how EACO — a Solana-native token — can move across chains: from Solana to BNB Chain, then to Earthcoin (EAC), a UTXO chain born in 2013. We combine SOL, wBNB, wETH, wBTC, USDT and USDC as carriers, and evaluate custody, liquidity, security and compliance before proposing a staged roadmap. All addresses were verified on 2026-09-12 via OrbMarkets, OKLink, Coinbase and CoinGecko sources.",zh:"2026 年，我们探索 Solana 原生代币 EACO 的多链之旅：从 Solana 走向 BNB Chain，再连接到 2013 年诞生的 UTXO 链 Earthcoin（EAC）。以 SOL、wBNB、wETH、wBTC、USDT、USDC 为载体资产，评估托管、流动性、安全与合规后给出分阶段路线图。全部地址已于 2026-09-12 经 OrbMarkets、OKLink、Coinbase、CoinGecko 等来源核实。",es:"En 2026 exploramos cómo EACO, un token nativo de Solana, puede moverse entre cadenas: de Solana a BNB Chain y luego a Earthcoin (EAC), una cadena UTXO nacida en 2013. Combinamos SOL, wBNB, wETH, wBTC, USDT y USDC como activos portadores, y evaluamos custodia, liquidez, seguridad y cumplimiento antes de proponer una hoja de ruta por fases. Todas las direcciones fueron verificadas el 2026-09-12 con fuentes de OrbMarkets, OKLink, Coinbase y CoinGecko.",ar:"نستكشف في ٢٠٢٦ كيف يمكن لـ EACO، وهو رمز أصلي على سولانا، التحرك بين السلاسل: من سولانا إلى سلسلة بي إن بي، ثم إلى إيرثكوين (EAC) وهي سلسلة UTXO وُلدت عام ٢٠١٣. نجمع SOL و wBNB و wETH و wBTC و USDT و USDC كأصول حاملة، ونقيّم الوصاية والسيولة والأمان والامتثال قبل اقتراح خارطة طريق مرحلية. جميع العناوين تحقّق منها في ٢٠٢٦-٠٩-١٢ عبر OrbMarkets و OKLink و Coinbase و CoinGecko.",fr:"En 2026, nous explorons comment EACO, un token natif de Solana, peut circuler entre chaînes : de Solana vers BNB Chain, puis vers Earthcoin (EAC), une chaîne UTXO née en 2013. Nous combinons SOL, wBNB, wETH, wBTC, USDT et USDC comme actifs porteurs, et évaluons garde, liquidité, sécurité et conformité avant de proposer une feuille de route par étapes. Toutes les adresses ont été vérifiées le 2026-09-12 via OrbMarkets, OKLink, Coinbase et CoinGecko.",ru:"В 2026 году мы исследуем, как EACO — нативный токен Solana — может перемещаться между сетями: из Solana в BNB Chain, а затем в Earthcoin (EAC), UTXO-цепь, созданную в 2013 году. Мы используем SOL, wBNB, wETH, wBTC, USDT и USDC как активы-носители и оцениваем хранение, ликвидность, безопасность и соответствие нормам, предлагая поэтапную дорожную карту. Все адреса проверены 12.09.2026 по источникам OrbMarkets, OKLink, Coinbase, CoinGecko."},

bridgeTitle:{en:"Combining the three bridge archetypes",zh:"三种桥接范式的组合",es:"Combinando los tres arquetipos de puente",ar:"الجمع بين الأنماط الثلاثة للجسور",fr:"Combiner les trois archétypes de pont",ru:"Комбинация трёх типов мостов"},
bridgeSub:{en:"Cross-chain assets = native asset + liquidity + a trust model. The three archetypes below are combined as needed in this proposal.",zh:"跨链资产 = 原生资产 + 流动性 + 信任模型。下面三种范式在本方案中按需组合。",es:"Activos entre cadenas = activo nativo + liquidez + un modelo de confianza. Los tres arquetipos siguientes se combinan según se necesite.",ar:"الأصول عبر السلاسل = أصل أصلي + سيولة + نموذج ثقة. تُجمَع الأنماط الثلاثة التالية حسب الحاجة.",fr:"Actif cross-chain = actif natif + liquidité + modèle de confiance. Les trois archétypes ci-dessous sont combinés selon les besoins.",ru:"Кроссчейн-актив = нативный актив + ликвидность + модель доверия. Три типа мостов ниже комбинируются по мере необходимости."},
ar1T:{en:"Lock & Mint",zh:"锁定-铸造",es:"Bloquear y acuñar",ar:"قفل وسكّ",fr:"Verrouiller et frapper",ru:"Блокировка и чеканка"},
ar1D:{en:"Source-chain assets are locked in a smart contract, and the target chain mints a 1:1 equivalent. No custodian: security relies on audited contracts and multisig. Works inside smart-contract chains such as Solana and BNB Chain.",zh:"源链资产锁定在智能合约中，目标链按 1:1 铸造对应代币。无托管方，安全性由合约审计与多签保障；适用于 Solana / BNB Chain 这类有智能合约的链。",es:"Los activos de la cadena de origen se bloquean en un contrato inteligente y la cadena de destino acuña el equivalente 1:1. Sin custodio: la seguridad depende de contratos auditados y multisig. Aplica en cadenas con contratos inteligentes como Solana y BNB Chain.",ar:"تُقفل أصول السلسلة المصدرية في عقد ذكي، وتقوم السلسلة الهدف بسكّ ما يعادلها بنسبة ١:١. لا وصي: الأمان يعتمد على عقود مُدقّقة وتوقيع متعدد. ينطبق على سلاسل العقود الذكية مثل سولانا وسلسلة بي إن بي.",fr:"Les actifs de la chaîne source sont verrouillés dans un contrat intelligent, et la chaîne cible frappe un équivalent 1:1. Sans dépositaire : la sécurité repose sur des contrats audités et le multisig. Valable sur les chaînes à contrats intelligents comme Solana et BNB Chain.",ru:"Активы исходной сети блокируются в смарт-контракте, а целевая сеть чеканит эквивалент 1:1. Без хранителя: безопасность обеспечивается аудитом и мультисигом. Применимо для сетей со смарт-контрактами, таких как Solana и BNB Chain."},
ar2T:{en:"Custody & Wrap",zh:"托管-包装",es:"Custodia y envoltura",ar:"وصاية وتغليف",fr:"Garde et enveloppe",ru:"Хранение и обёртка"},
ar2D:{en:"When the native chain has no smart contracts (e.g. Earthcoin, a UTXO chain), a federation of guardians holds the native coins in multisig addresses and issues a 1:1 wrapped token on the target chain. The WBTC and Zeus zBTC model.",zh:"原生链没有智能合约（如 Earthcoin 这类 UTXO 链）时，由联邦托管方把原生币保存在多签地址，并在目标链发行 1:1 包装代币。即 WBTC 与 Zeus zBTC 模式。",es:"Cuando la cadena nativa no tiene contratos inteligentes (p. ej. Earthcoin, una cadena UTXO), una federación de guardianes custodia las monedas nativas en direcciones multisig y emite un token envuelto 1:1 en la cadena de destino. Es el modelo WBTC y Zeus zBTC.",ar:"عندما لا تمتلك السلسلة الأصلية عقودًا ذكية (مثل إيرثكوين، وهي سلسلة UTXO)، تحتفظ مجموعة من الأوصياء بالعملات الأصلية في عناوين توقيع متعدد وتُصدر رمزًا مغلّفًا بنسبة ١:١ على السلسلة الهدف. هذا نموذج WBTC و Zeus zBTC.",fr:"Quand la chaîne native n'a pas de contrats intelligents (ex. Earthcoin, chaîne UTXO), une fédération de gardiens conserve les pièces natives dans des adresses multisig et émet un token enveloppé 1:1 sur la chaîne cible. C'est le modèle WBTC et Zeus zBTC.",ru:"Когда у исходной сети нет смарт-контрактов (например, Earthcoin — UTXO-цепь), федерация хранителей держит монеты в мультисиг-адресах и выпускает обёрнутый токен 1:1 в целевой сети. Это модель WBTC и Zeus zBTC."},
ar3T:{en:"LP Routing",zh:"流动性路由",es:"Ruta de liquidez (LP)",ar:"توجيه السيولة",fr:"Routage LP",ru:"LP-маршрутизация"},
ar3D:{en:"Use stablecoins (USDT / USDC) as the “transfer currency” and swap through decentralized exchanges to move value across chains without any bridge contract. Most flexible, fastest to list.",zh:"以 USDT / USDC 等稳定币作为「中转货币」、经由去中心化交易所路由兑换，实现等价跨链而无需任何桥合约；最灵活、上币最快。",es:"Usar stablecoins (USDT / USDC) como «moneda de tránsito» e intercambiar en exchanges descentralizados para mover valor entre cadenas sin contrato de puente. Lo más flexible y rápido de listar.",ar:"استخدام العملات المستقرة (USDT / USDC) كـ«عملة عبور» والمبادلة عبر بورصات لامركزية لنقل القيمة بين السلاسل دون أي عقد جسر. الأكثر مرونة وسرعة في الإدراج.",fr:"Utiliser les stablecoins (USDT / USDC) comme « monnaie de transit » et passer par des échanges décentralisés pour déplacer de la valeur entre chaînes sans contrat de pont. Le plus flexible et le plus rapide à lister.",ru:"Использовать стейблкоины (USDT / USDC) как «транзитную валюту» и обменивать через децентрализованные биржи для перемещения стоимости между сетями без контракта моста. Максимально гибко и быстро листится."},
carrierTitle:{en:"Carrier asset matrix",zh:"载体资产矩阵",es:"Matriz de activos portadores",ar:"مصفوفة الأصول الحاملة",fr:"Matrice des actifs porteurs",ru:"Матрица активов-носителей"},
carrierNote:{en:"Core of settlement and liquidity: stablecoins provide the pricing anchor, Ethereum-family assets carry value across chains.",zh:"桥接结算与流动性核心：稳定币提供计价锚，以太坊系资产承担价值传递。",es:"Núcleo de liquidación y liquidez: las stablecoins anclan el precio, los activos de la familia Ethereum transfieren valor.",ar:"جوهر التسوية والسيولة: العملات المستقرة تقدّم مرساة التسعير، وأصول عائلة إيثيريوم تنقل القيمة.",fr:"Cœur du règlement et de la liquidité : les stablecoins ancrent le prix, les actifs de la famille Ethereum transportent la valeur.",ru:"Ядро расчётов и ликвидности: стейблкоины дают ценовой якорь, активы семейства Ethereum переносят стоимость."},

routeSub:{en:"Pick an exploration route to see the recommended path and its carrier assets.",zh:"选择一条探索路线，查看推荐的跨链路径与载体资产。",es:"Elija una ruta para ver la ruta recomendada y sus activos portadores.",ar:"اختر مسار استكشاف لترى المسار الموصى به وأصوله الحاملة.",fr:"Choisissez une route pour voir le chemin recommandé et ses actifs porteurs.",ru:"Выберите маршрут, чтобы увидеть рекомендуемый путь и активы-носители."},

feasTitle:{en:"EACO & Earthcoin cross-chain feasibility",zh:"EACO 与 Earthcoin 跨链可行性结论",es:"Viabilidad: puente EACO y Earthcoin",ar:"الجدوى: جسر EACO و Earthcoin العابر",fr:"Faisabilité : pont EACO & Earthcoin",ru:"Осуществимость: мост EACO и Earthcoin"},
feasSub:{en:"Three layered conclusions based on verified on-chain facts and public precedents, plus staged recommendations.",zh:"基于已核实的链上事实与公开先例，给出三层结论与分阶段建议。",es:"Tres conclusiones por capas basadas en hechos verificados y precedentes públicos, con recomendaciones por fases.",ar:"ثلاث استنتاجات متدرجة مبنية على حقائق موثّقة على السلسلة وسوابق عامة، مع توصيات مرحلية.",fr:"Trois conclusions en couches fondées sur des faits on-chain vérifiés et des précédents publics, avec des recommandations par étapes.",ru:"Три слоя выводов на основе проверенных on-chain фактов и публичных прецедентов, плюс поэтапные рекомендации."},
feasMTitle:{en:"Options A / B / C: three paths to bring EACO to BNB Chain",zh:"方案 A / B / C：EACO 在 BNB Chain 的三种落地路径",es:"Opciones A / B / C: tres caminos para llevar EACO a BNB Chain",ar:"الخيارات أ / ب / ج: ثلاثة مسارات لنقل EACO إلى سلسلة بي إن بي",fr:"Options A / B / C : trois chemins pour amener EACO sur BNB Chain",ru:"Варианты A / B / C: три пути вывода EACO в BNB Chain"},
mA:{en:"Option A — Official anchored bridge (recommended)",zh:"方案 A —— 官方锚定桥（推荐）",es:"Opción A — Puente anclado oficial (recomendada)",ar:"الخيار أ — جسر مربوط رسمي (موصى به)",fr:"Option A — Pont ancré officiel (recommandée)",ru:"Вариант A — официальный закреплённый мост (рекомендуется)"},
mAD:{en:"EACO Foundation deploys a 1:1 EACO (BEP20) contract on BNB Chain, locks the equivalent Solana supply in a multisig vault, and lets users redeem back anytime. Precedent: Binance-Peg DOGE, SOLANA (SOL) BEP20, Binance-Peg ETH — a mature, battle-tested issuance style. Cost: contract audit + operational multisig; no third-party risk.",zh:"由 EACO 官方在 BNB Chain 部署 1:1 的 EACO（BEP20）合约，把等量 Solana 供应锁定进多签金库，用户可随时赎回。先例：Binance-Peg DOGE、SOLANA(SOL) BEP20、Binance-Peg ETH——成熟且久经考验的发行形态。成本：合约审计 + 运营多签；无第三方依赖风险。",es:"La Fundación EACO despliega un contrato EACO (BEP20) 1:1 en BNB Chain, bloquea la oferta equivalente de Solana en un vault multisig y permite canjear en cualquier momento. Precedente: Binance-Peg DOGE, SOLANA (SOL) BEP20, Binance-Peg ETH — una emisión madura y probada. Coste: auditoría + multisig operativo; sin riesgo de terceros.",ar:"تنشر مؤسسة EACO عقدًا بنسبة ١:١ لـ EACO (BEP20) على سلسلة بي إن بي، وتقفل العرض المكافئ من سولانا في خزينة توقيع متعدد، ويستطيع المستخدمون الاسترداد في أي وقت. سابقة: Binance-Peg DOGE و SOLANA (SOL) BEP20 و Binance-Peg ETH — نمط إصدار ناضج ومُختبَر. التكلفة: تدقيق العقد + توقيع متعدد تشغيلي؛ بلا مخاطر طرف ثالث.",fr:"La Fondation EACO déploie un contrat 1:1 EACO (BEP20) sur BNB Chain, verrouille l'offre Solana équivalente dans un coffre multisig et permet le rachat à tout moment. Précédent : Binance-Peg DOGE, SOLANA (SOL) BEP20, Binance-Peg ETH — un mode d'émission éprouvé. Coût : audit + multisig opérationnel ; aucun risque de tiers.",ru:"Фонд EACO разворачивает контракт 1:1 EACO (BEP20) в BNB Chain, блокирует эквивалентное предложение Solana в мультисиг-хранилище и позволяет выкупить в любой момент. Прецедент: Binance-Peg DOGE, SOLANA (SOL) BEP20, Binance-Peg ETH — зрелая модель выпуска. Затраты: аудит + операционный мультисиг; без риска третьей стороны."},
mB:{en:"Option B — Generic messaging bridge (Wormhole NTT / deBridge)",zh:"方案 B —— 通用消息桥（Wormhole NTT / deBridge 等）",es:"Opción B — Puente de mensajes genérico (Wormhole NTT / deBridge)",ar:"الخيار ب — جسر رسائل عام (وورم هول NTT / دي بريدج)",fr:"Option B — Pont de messages générique (Wormhole NTT / deBridge)",ru:"Вариант B — универсальный мост сообщений (Wormhole NTT / deBridge)"},
mBD:{en:"Adopt an audited messaging protocol so EACO transfers natively between Solana and BNB Chain without a dedicated peg contract. Faster time-to-market, inherits the protocol's validator security — but pays bridge fees and relies on the protocol's lifetime. Suitable once volumes justify it.",zh:"接入已审计的消息协议，让 EACO 在 Solana 与 BNB Chain 之间原生流动，无需自建锚定合约。上线快、继承协议验证者安全——但需支付跨链手续费，并依赖协议存续。适合放量后的第二阶段。",es:"Adoptar un protocolo de mensajería auditado para que EACO circule nativamente entre Solana y BNB Chain sin contrato propio. Salida rápida, hereda la seguridad de los validadores — pero paga comisiones y depende del protocolo. Ideal en una segunda fase cuando el volumen lo justifique.",ar:"اعتماد بروتوكول رسائل مُدقّق ليتنقل EACO أصليًا بين سولانا وسلسلة بي إن بي دون عقد تثبيت خاص. إطلاق أسرع، يرث أمان مدققي البروتوكول — لكن يدفع رسوم الجسر ويعتمد على بقاء البروتوكول. مناسب كمرحلة ثانية بعد نمو الحجوم.",fr:"Adopter un protocole de messagerie audité pour que EACO circule nativement entre Solana et BNB Chain sans contrat dédié. Montée rapide, hérite de la sécurité des validateurs — mais paie des frais de pont et dépend de la pérennité du protocole. Idéal en seconde phase quand les volumes le justifient.",ru:"Подключить аудированный протокол сообщений, чтобы EACO перемещался нативно между Solana и BNB Chain без собственного peg-контракта. Быстрый запуск, наследует безопасность валидаторов — но платит комиссию моста и зависит от жизнеспособности протокола. Подходит на втором этапе при росте объёмов."},
mC:{en:"Option C — Stablecoin routing path",zh:"方案 C —— 稳定币路由过渡",es:"Opción C — Ruta de stablecoins",ar:"الخيار ج — مسار العملات المستقرة",fr:"Option C — Route par stablecoins",ru:"Вариант C — маршрут через стейблкоины"},
mCD:{en:"Instead of bridging EACO directly, list EACO/USDT and EACO/USDC pools on both chains, and let arbitrage keep prices aligned. Users move value as USDT/USDC and swap locally. Zero bridge risk, instant liquidity — a perfect “phase zero” while Options A/B are being audited.",zh:"不直接桥接 EACO，而是在两条链同时上线 EACO/USDT、EACO/USDC 交易对，由套利维持价格一致。用户以 USDT/USDC 转移价值、在本地兑换。桥风险为零、流动性即时——是 A/B 方案审计期间的完美「第零阶段」。",es:"En lugar de puentear EACO directamente, listar pares EACO/USDT y EACO/USDC en ambas cadenas y dejar que el arbitraje alinee los precios. Los usuarios mueven valor como USDT/USDC y cambian localmente. Riesgo de puente cero, liquidez inmediata — el perfecto «estadio cero» mientras se auditan A/B.",ar:"بدلًا من جسر EACO مباشرة، نُدرج أزواج EACO/USDT و EACO/USDC على السلاسلتين، ويدفع المراجحة الأسعار إلى التوازن. ينقل المستخدمون القيمة عبر USDT/USDC ويبادلون محليًا. خطر الجسر صفر وسيولة فورية — «المرحلة صفر» المثالية أثناء تدقيق الخيارين أ وب.",fr:"Au lieu de pontifier EACO directement, lister les paires EACO/USDT et EACO/USDC sur les deux chaînes, l'arbitrage alignant les prix. Les utilisateurs déplacent de la valeur en USDT/USDC et échangent localement. Risque de pont nul, liquidité immédiate — parfait « stade zéro » pendant l'audit de A/B.",ru:"Вместо прямого моста для EACO листим пары EACO/USDT и EACO/USDC в обеих сетях; арбитраж выравнивает цены. Пользователи переносят стоимость в USDT/USDC и обменивают локально. Ноль риска моста, мгновенная ликвидность — идеальная «нулевая фаза» пока аудируются варианты A/B."},
earthT:{en:"Chapter: Earthcoin (EAC) — from UTXO chain to multi-chain",zh:"Earthcoin(EAC)：从 UTXO 链走向多链",es:"Capítulo: Earthcoin (EAC) — de cadena UTXO a multicadena",ar:"فصل: إيرثكوين (EAC) — من سلسلة UTXO إلى التعدد السلاسلي",fr:"Chapitre : Earthcoin (EAC) — de la chaîne UTXO au multi-chaînes",ru:"Раздел: Earthcoin (EAC) — из UTXO-сети в мультичейн"},
earthP1:{en:"Earthcoin was launched in Toronto on 2013-12-20 as a Scrypt proof-of-work coin (code EAC, 60-second blocks, ~13.5 billion supply). It is an independent UTXO chain without smart contracts — so EAC cannot mint wrapped tokens by itself; any multi-chain version must be a custody-and-wrap design.",zh:"Earthcoin 于 2013-12-20 在多伦多上线，是 Scrypt 工作量证明币（代码 EAC，60 秒出块，总量约 135 亿枚）。它是没有智能合约的独立 UTXO 链——因此 EAC 自身无法铸造包装代币，任何多链版本都必须采用「托管-包装」设计。",es:"Earthcoin se lanzó en Toronto el 2013-12-20 como moneda Scrypt proof-of-work (código EAC, bloques de 60 s, oferta de ~13 500 millones). Es una cadena UTXO independiente sin contratos inteligentes — por eso EAC no puede acuñar envueltos por sí sola; toda versión multicadena debe ser de custodia y envoltura.",ar:"أُطلقت إيرثكوين في تورونتو بتاريخ ٢٠١٣-١٢-٢٠ كعملة إثبات عمل Scrypt (الرمز EAC، كتل كل ٦٠ ثانية، عرض نحو ١٣٫٥ مليار). وهي سلسلة UTXO مستقلة بلا عقود ذكية — لذلك لا تستطيع EAC نفسها سكّ رموز مغلّفة؛ أي نسخة متعددة السلاسل يجب أن تكون بتصميم «وصاية وتغليف».",fr:"Earthcoin a été lancée à Toronto le 2013-12-20 comme pièce Scrypt proof-of-work (code EAC, blocs de 60 s, offre ~13,5 milliards). C'est une chaîne UTXO indépendante sans contrats intelligents — EAC ne peut donc pas frapper ses enveloppes elle-même ; toute version multi-chaînes doit être de type garde-et-enveloppe.",ru:"Earthcoin запущена в Торонто 20.12.2013 как монета Scrypt proof-of-work (код EAC, блоки по 60 секунд, эмиссия ~13,5 млрд). Это независимая UTXO-сеть без смарт-контрактов — поэтому EAC сама не может чеканить обёрнутые токены; любая мультичейн-версия должна строиться по схеме «хранение и обёртка»."},
earthP2:{en:"Sandokaaan/Earthcoin v2.1.4 (the current wallet client) adds multisignature addresses and multisig transactions. That is exactly the infrastructure a federated custody bridge needs: a guardian set with N-of-M signatures can hold the EAC reserve and release it on proof of burn from the wrapped side.",zh:"Sandokaaan/Earthcoin v2.1.4（当前钱包客户端）新增多签地址与多签交易支持——这正是联邦托管桥所需的基础设施：由 N-of-M 签名守护者组保管 EAC 储备金，依据包装侧的销毁证明释放原生币。",es:"Sandokaaan/Earthcoin v2.1.4 (el cliente de monedero actual) añade direcciones y transacciones multisig. Justo la infraestructura que necesita un puente de custodia federada: un grupo de guardianes con firmas N-de-M mantiene la reserva de EAC y la libera con prueba de quema del lado envuelto.",ar:"يضيف Sandokaaan/Earthcoin v2.1.4 (عميل المحفظة الحالي) عناوين التوقيع المتعدد ومعاملاته — وهي البنية التحتية التي يحتاجها جسر الوصاية الاتحادية بالضبط: مجموعة أوصياء بتوقيعات N من M تحتفظ باحتياطي EAC وتحرّره عند إثبات الحرق من الجانب المغلف.",fr:"Sandokaaan/Earthcoin v2.1.4 (le client wallet actuel) ajoute les adresses et transactions multisig. Exactement l'infrastructure qu'un pont à garde fédérée exige : un groupe de gardiens à signatures N-parmi-M détient la réserve EAC et la libère sur preuve de brûlure côté enveloppé.",ru:"Sandokaaan/Earthcoin v2.1.4 (текущий кошелек) добавляет мультисиг-адреса и мультисиг-транзакции. Именно та инфраструктура, что нужна мосту с федеральным хранением: группа хранителей с подписями N-из-M держит резерв EAC и отпускает монеты по доказательству сожжения на стороне обёртки."},
earthP3:{en:"The proven pattern is Zeus Network's zBTC (1:1 BTC on Solana via the APOLLO bridge, with planned DOGE/LTC expansion) and the classic WBTC. Our proposal: issue EACO — an EAC-backed wrap at a 1:1 or market-based rate — first on Solana, then on BNB Chain, governed by public multisig, monthly reserve attestations and a redemption oracle.",zh:"可复制的先例是 Zeus Network 的 zBTC（经 APOLLO 桥把 BTC 1:1 带入 Solana，并规划扩展 DOGE/LTC）与经典 WBTC。我们的提议：发行 EACO —— 由 EAC 按 1:1 或随市场变化背书的包装代币，先在 Solana 上线、再上 BNB Chain，配公开多签、月度储量证明与赎回预言机。",es:"El patrón probado es zBTC de Zeus Network (BTC 1:1 en Solana vía el puente APOLLO, con expansión planificada a DOGE/LTC) y el clásico WBTC. Propuesta: emitir EACO — un envuelto a razón 1:1 o según el mercado respaldado por EAC — primero en Solana, luego en BNB Chain, con multisig público, certificaciones mensuales de reservas y un oráculo de redención.",ar:"النمط المجرَّب هو zBTC من شبكة Zeus (BTC بنسبة ١:١ على سولانا عبر جسر APOLLO، مع توسعة مخططة إلى DOGE/LTC) و WBTC الكلاسيكي. اقتراحنا: إصدار EACO — غلاف بنسبة ١:١ أو حسب السوق مدعوم بـ EAC — أولًا على سولانا ثم على سلسلة بي إن بي، بحوكمة توقيع متعدد علني وإثباتات احتياطي شهرية وأوراكل استرداد.",fr:"Le modèle éprouvé est le zBTC de Zeus Network (BTC 1:1 sur Solana via le pont APOLLO, extension DOGE/LTC prévue) et le WBTC classique. Proposition : émettre EACO — une enveloppe au taux de 1:1 ou selon le marché adossée à EAC — d'abord sur Solana, puis sur BNB Chain, avec multisig public, attestations de réserves mensuelles et un oracle de rachat.",ru:"Проверенная модель — zBTC от Zeus Network (BTC 1:1 в Solana через мост APOLLO, планируется расширение DOGE/LTC) и классический WBTC. Предложение: выпустить EACO — обёртку в соотношении 1:1 или по рыночному курсу с обеспечением EAC — сначала в Solana, затем в BNB Chain, с публичным мультисигом, ежемесячными аттестациями резервов и оракулом выкупа."},

roadSub:{en:"From simple to complex: stablecoin routing first, then the official anchored bridge, and finally the Earthcoin federated bridge.",zh:"先易后难：优先稳定币路由，其次官方锚定桥，最后攻坚 Earthcoin 联邦桥。",es:"De lo simple a lo complejo: primero la ruta de stablecoins, luego el puente anclado oficial, y por último el puente federado de Earthcoin.",ar:"من البسيط إلى المعقد: مسار العملات المستقرة أولًا، ثم الجسر المربوط الرسمي، وأخيرًا الجسر الاتحادي لإيرثكوين.",fr:"Du simple au complexe : routage par stablecoins d'abord, pont officiel ancré ensuite, enfin le pont fédéré Earthcoin.",ru:"От простого к сложному: сначала маршрутизация через стейблкоины, затем официальный закреплённый мост, наконец федеральный мост Earthcoin."},

crowdSub:{en:"An open, community-driven experiment: how global netizens could crowdfund the bridge with DOGE and EACO — methods, mechanics and open questions. Nothing is launched; this is exploration and discussion, not investment advice.",zh:"面向全网开放的社区实验：探索全球网友如何用 DOGE 与 EACO 为跨链桥众筹——聚方式、方法与开放议题。尚未落地，一切皆为探索与探讨，不构成投资建议。",es:"Un experimento abierto de la comunidad: cómo los internautas del mundo podrían financiar el puente con DOGE y EACO — métodos, mecánicas y preguntas abiertas. Nada está lanzado; es exploración y debate, no asesoramiento de inversión.",ar:"تجربة مجتمعية مفتوحة: كيف يمكن لمستخدمي الإنترنت حول العالم تمويل الجسر بـ DOGE و EACO — أساليب وآليات وأسئلة مفتوحة. لم يُطلق شيء؛ هذا استكشاف ونقاش وليس نصيحة استثمارية.",fr:"Une expérience ouverte menée par la communauté : comment les internautes du monde pourraient financer le pont avec DOGE et EACO — méthodes, mécanismes et questions ouvertes. Rien n'est lancé ; exploration et discussion, pas un conseil en investissement.",ru:"Открытый эксперимент сообщества: как интернет-пользователи планеты могли бы профинансировать мост через DOGE и EACO — методы, механики и открытые вопросы. Ничего не запущено; исследование и обсуждение, а не инвестиционная рекомендация."},
crowdNote:{en:"Status: exploration & discussion only — nothing launched, no fundraising is open today; never send funds to undisclosed addresses; always verify official announcements. This section is not investment advice.",zh:"状态：仅为探索与讨论——尚未落地，当前未开放任何募资；切勿向未披露的地址转账，一切以官方公告为准。本板块不构成投资建议。",es:"Estado: solo exploración y discusión — nada lanzado, sin recaudación abierta hoy; nunca envíes fondos a direcciones no publicadas; verifica siempre los anuncios oficiales. Esta sección no es asesoramiento de inversión.",ar:"الحالة: استكشاف ونقاش فقط — لم يُطلق شيء، ولا يوجد أي جمع تمويل مفتوح اليوم؛ لا ترسل أموالًا أبدًا إلى عناوين غير معلنة؛ تحقق دائمًا من الإعلانات الرسمية. هذا القسم ليس نصيحة استثمارية.",fr:"Statut : exploration et discussion uniquement — rien n'est lancé, aucune collecte ouverte aujourd'hui ; n'envoyez jamais de fonds vers des adresses non divulguées ; vérifiez toujours les annonces officielles. Cette section n'est pas un conseil en investissement.",ru:"Статус: только исследование и обсуждение — ничего не запущено, сборов нет; никогда не отправляйте средства на нераскрытые адреса; всегда сверяйтесь с официальными анонсами. Это не инвестиционная рекомендация."},

dogeTitle:{en:"How DOGE Cross-Chains to EACO",zh:"DOGE 跨链地球 EACO 的方法",es:"Cómo DOGE cruza cadenas hacia EACO",ar:"كيف يعبر DOGE السلاسل إلى EACO",fr:"Comment DOGE traverse les chaînes vers EACO",ru:"Как DOGE пересекает сети к EACO"},
dogeSub:{en:"Dogecoin already set an industry standard for native cross-chain: Dogecoin PoW (no smart contracts) → Solana SPL → BNB Chain (EVM). EACO follows exactly the same standard — Wormhole NTT + RISC Zero ZK to enter Solana, then a DOGE-EACO pool, then Wormhole onward to BNB Chain and 40+ EVM chains. Nothing below is live; every step is an exploration plan for the community.",zh:"DOGE 已经形成原生跨链的行业标准：Dogecoin PoW（无智能合约）→ Solana SPL → BNB Chain（EVM）。EACO 完全对齐这一标准——经 Wormhole NTT + RISC Zero ZK 进入 Solana，再建立 DOGE-EACO 互换池，再经 Wormhole 通往 BNB Chain 与 40+ EVM 链。以下内容均未落地，每一步都是面向社区的探索方案。",es:"Dogecoin ya estableció un estándar de la industria para el cross-chain nativo: Dogecoin PoW (sin contratos inteligentes) → Solana SPL → BNB Chain (EVM). EACO sigue exactamente el mismo estándar: Wormhole NTT + RISC Zero ZK para entrar en Solana, luego un pool DOGE-EACO y luego Wormhole hacia BNB Chain y más de 40 cadenas EVM. Nada de lo siguiente está activo; cada paso es un plan de exploración para la comunidad.",ar:"أسّس دوجكوين معيارًا صناعيًا للعبور الأصلي بين السلاسل: دوجكوين PoW (بلا عقود ذكية) ← سولانا SPL ← سلسلة BNB (EVM). يتبع EACO نفس المعيار تمامًا — Wormhole NTT + RISC Zero ZK للدخول إلى سولانا، ثم مجمع مبادلة DOGE-EACO، ثم Wormhole إلى سلسلة BNB وأكثر من ٤٠ سلسلة EVM. لا شيء مما يلي فعلي؛ كل خطوة خطة استكشاف للمجتمع.",fr:"Dogecoin a déjà établi une norme du secteur pour le bridge natif : Dogecoin PoW (sans contrats intelligents) → Solana SPL → BNB Chain (EVM). EACO suit exactement la même norme — Wormhole NTT + RISC Zero ZK pour entrer dans Solana, puis un pool DOGE-EACO, puis Wormhole vers BNB Chain et plus de 40 chaînes EVM. Rien ci-dessous n'est en service ; chaque étape est un plan d'exploration pour la communauté.",ru:"Dogecoin уже задал отраслевой стандарт нативного кроссчейна: Dogecoin PoW (без смарт-контрактов) → Solana SPL → BNB Chain (EVM). EACO следует ровно этому стандарту — Wormhole NTT + RISC Zero ZK для входа в Solana, затем пул DOGE-EACO, затем Wormhole в BNB Chain и 40+ EVM-сетей. Ничего из этого не запущено; каждый шаг — план исследования для сообщества."},

routes:[
 {label:{en:"EACO: Solana → BNB Chain (Option A)",zh:"EACO：Solana → BNB Chain（方案 A）",es:"EACO: Solana → BNB Chain (Opción A)",ar:"EACO: سولانا → سلسلة بي إن بي (الخيار أ)",fr:"EACO : Solana → BNB Chain (Option A)",ru:"EACO: Solana → BNB Chain (Вариант A)"},
  text:{en:"1:1 EACO (BEP20) is minted on BNB Chain while the same amount of Solana EACO is locked in a multisig vault. Redemption burns the BEP20 and unlocks the SPL. Settlement runs on USDT/USDC rails.",zh:"BNB Chain 按 1:1 铸造 EACO（BEP20），等量 Solana EACO 锁入多签金库；赎回时销毁 BEP20、解锁 SPL。结算走 USDT/USDC 通道。",es:"Se acuña EACO (BEP20) 1:1 en BNB Chain mientras la misma cantidad de EACO de Solana se bloquea en un vault multisig. El canje quema el BEP20 y desbloquea el SPL. Liquidación por USDT/USDC.",ar:"يُسكّ EACO (BEP20) بنسبة ١:١ على سلسلة بي إن بي بينما يُقفل نفس المقدار من EACO على سولانا في خزينة توقيع متعدد. الاسترداد يحرق BEP20 ويفتح SPL. التسوية عبر USDT/USDC.",fr:"EACO (BEP20) 1:1 est frappé sur BNB Chain pendant que la même quantité de EACO Solana est verrouillée dans un coffre multisig. Le rachat brûle le BEP20 et débloque le SPL. Règlement via USDT/USDC.",ru:"EACO (BEP20) 1:1 чеканится в BNB Chain, пока то же количество EACO Solana заблокировано в мультисиг-хранилище. Выкуп сжигает BEP20 и разблокирует SPL. Расчёты по каналам USDT/USDC."}},
 {label:{en:"USDT / USDC: two-way liquidity rail",zh:"USDT / USDC：双向流动性通道",es:"USDT / USDC: vía de liquidez bidireccional",ar:"USDT / USDC: مسار سيولة ثنائي الاتجاه",fr:"USDT / USDC : rail de liquidité bidirectionnel",ru:"USDT / USDC: двунаправленный канал ликвидности"},
  text:{en:"Native SPL USDT/USDC on Solana and BSC-USD / Binance-Peg USDC on BNB Chain form the core swap pair for every bridge route; arbitrage keeps the two sides price-aligned.",zh:"Solana 原生 USDT/USDC 与 BNB Chain 的 BSC-USD / 币安锚定 USDC 构成所有桥接路线的核心交易对；套利维持两端价格一致。",es:"USDT/USDC SPL nativos en Solana y BSC-USD / USDC Binance-Peg en BNB Chain forman el par central de cada ruta; el arbitraje alinea los precios.",ar:"تشكّل USDT/USDC الأصلية على سولانا و BSC-USD / USDC المربوطة على بي إن بي الزوج الأساسي لكل مسار؛ والمراجحة تحاذي الأسعار.",fr:"Les USDT/USDC SPL natifs sur Solana et BSC-USD / USDC Binance-Peg sur BNB Chain forment la paire centrale de chaque route ; l'arbitrage aligne les prix.",ru:"Нативные SPL USDT/USDC в Solana и BSC-USD / Binance-Peg USDC в BNB Chain образуют ядро каждой пары; арбитраж выравнивает цены."}},
 {label:{en:"DOGE: SPL ↔ Binance-Peg (parallel listing)",zh:"DOGE：SPL ↔ 币安锚定（并行上架）",es:"DOGE: SPL ↔ Binance-Peg (listado paralelo)",ar:"DOGE: SPL ↔ المربوط ببينانس (إدراج متوازٍ)",fr:"DOGE : SPL ↔ Binance-Peg (double cotation)",ru:"DOGE: SPL ↔ Binance-Peg (параллельный листинг)"},
  text:{en:"Proof that the same asset can circulate on Solana and BNB Chain at once. EACO can mirror this model instead of inventing a new one.",zh:"证明同一资产可同时在 Solana 与 BNB Chain 流通。EACO 可照搬这一模型，无需另起炉灶。",es:"Prueba de que un mismo activo puede circular en Solana y BNB Chain a la vez. EACO puede replicar este modelo.",ar:"دليل على أن الأصل نفسه يمكن أن يتداول على سولانا وسلسلة بي إن بي معًا. يمكن لـ EACO تقليد هذا النموذج.",fr:"Preuve qu'un même actif peut circuler à la fois sur Solana et BNB Chain. EACO peut copier ce modèle.",ru:"Доказательство, что один актив может обращаться в Solana и BNB Chain одновременно. EACO может повторить эту модель."}},
 {label:{en:"BNB: Solana wrap ↔ BNB Chain native",zh:"BNB：Solana 封装 ↔ BNB Chain 原生",es:"BNB: envuelto en Solana ↔ nativo en BNB Chain",ar:"BNB: مغلف على سولانا ↔ أصلي على بي إن بي",fr:"BNB : enveloppé Solana ↔ natif BNB Chain",ru:"BNB: обёртка Solana ↔ нативный BNB Chain"},
  text:{en:"wBNB (Wormhole) on Solana is redeemable 1:1 for native WBNB on BNB Chain; used as gas and pair-liquidity carrier for EACO markets.",zh:"Solana 上的 wBNB（Wormhole）可按 1:1 兑换 BNB Chain 原生 WBNB；作为 EACO 交易对的燃料与流动性载体。",es:"wBNB (Wormhole) en Solana es canjeable 1:1 por WBNB nativo en BNB Chain; usado como gas y liquidez para los mercados de EACO.",ar:"يمكن استرداد wBNB (وورم هول) على سولانا بنسبة ١:١ مقابل WBNB الأصلي على بي إن بي؛ ويُستخدم وقودًا وسيولة لأزواج EACO.",fr:"wBNB (Wormhole) sur Solana est rachetable 1:1 contre du WBNB natif sur BNB Chain ; utilisé comme gas et liquidité pour les marchés EACO.",ru:"wBNB (Wormhole) в Solana выкупается 1:1 на нативный WBNB в BNB Chain; используется как газ и ликвидность для рынков EACO."}},
 {label:{en:"ETH / BTC: value transport across both chains",zh:"ETH / BTC：双链价值传输",es:"ETH / BTC: transporte de valor entre cadenas",ar:"ETH / BTC: نقل القيمة بين السلسلتين",fr:"ETH / BTC : transport de valeur entre chaînes",ru:"ETH / BTC: перенос стоимости между сетями"},
  text:{en:"wETH (Wormhole) ↔ Binance-Peg ETH, WBTC (Wormhole 3NZ9J…) ↔ BTCB (with zBTC by Zeus for native-UTXO-style BTC). These high-value carriers let users enter EACO pools from any chain without trusting a new bridge.",zh:"wETH（Wormhole）↔ 币安锚定 ETH，WBTC（Wormhole 3NZ9J…）↔ BTCB（另有 Zeus zBTC 承担原生 UTXO 式 BTC）。这些高价值载体让用户无需信任新桥即可从任意链进入 EACO 池。",es:"wETH (Wormhole) ↔ Binance-Peg ETH, WBTC (Wormhole 3NZ9J…) ↔ BTCB (con zBTC de Zeus para BTC estilo UTXO nativo). Estos portadores de alto valor permiten entrar a los pools de EACO desde cualquier cadena.",ar:"wETH (وورم هول) ↔ ETH المربوط ببينانس، و WBTC (وورم هول 3NZ9J…) ↔ BTCB (مع zBTC من Zeus لنمط BTC الأصلي UTXO). تتيح هذه الحوامل عالية القيمة الدخول إلى مجمعات EACO من أي سلسلة دون الثقة بجسر جديد.",fr:"wETH (Wormhole) ↔ Binance-Peg ETH, WBTC (Wormhole 3NZ9J…) ↔ BTCB (avec zBTC de Zeus pour le BTC style UTXO natif). Ces porteurs de valeur permettent d'entrer dans les pools EACO depuis toute chaîne sans nouveau pont.",ru:"wETH (Wormhole) ↔ Binance-Peg ETH, WBTC (Wormhole 3NZ9J…) ↔ BTCB (плюс zBTC от Zeus для BTC в нативном UTXO-стиле). Эти носители позволяют входить в пулы EACO из любой сети, не доверяя новому мосту."}},
 {label:{en:"EAC: Earthcoin → wrapped EACO (custody & wrap)",zh:"EAC：Earthcoin → 封装 EACO（托管-包装）",es:"EAC: Earthcoin → EACO envuelto (custodia y envoltura)",ar:"EAC: إيرثكوين → EACO مغلف (وصاية وتغليف)",fr:"EAC : Earthcoin → EACO enveloppé (garde & enveloppe)",ru:"EAC: Earthcoin → обёрнутый EACO (хранение и обёртка)"},
  text:{en:"A federation of EAC guardians (multisig, supported by wallet v2.1.4) holds the EAC reserve; Solana/BSC mint EACO at a 1:1 or market-based rate; redemption requires a burn proof from the wrap side. Follows the zBTC pattern.",zh:"由 EAC 守护者联邦（多签，v2.1.4 钱包已支持）保管 EAC 储备；Solana/BSC 按 1:1 或随市场变化铸造 EACO；赎回以包装侧销毁证明为凭。遵循 zBTC 模式。",es:"Una federación de guardianes de EAC (multisig, soportado por wallet v2.1.4) custodia la reserva; Solana/BSC acuñan EACO a razón 1:1 o según el mercado; el canje exige prueba de quema. Sigue el modelo zBTC.",ar:"اتحاد من أوصياء EAC (توقيع متعدد، تدعمه المحفظة v2.1.4) يحفظ الاحتياطي؛ تسكّ سولانا/بي إن بي EACO بنسبة ١:١ أو حسب السوق؛ الاسترداد يتطلب إثبات حرق. يتبع نموذج zBTC.",fr:"Une fédération de gardiens EAC (multisig, supporté par le wallet v2.1.4) détient la réserve ; Solana/BSC frappent EACO au taux de 1:1 ou selon le marché ; le rachat exige une preuve de brûlure. Suit le modèle zBTC.",ru:"Федерация хранителей EAC (мультисиг, поддержан кошельком v2.1.4) держит резерв; Solana/BSC чеканят EACO в соотношении 1:1 или по рыночному курсу; выкуп требует доказательства сожжения. По модели zBTC."}}
],
verdicts:[
 {title:{en:"EACO → BNB Chain: high feasibility",zh:"EACO → BNB Chain：高可行性",es:"EACO → BNB Chain: alta viabilidad",ar:"EACO → سلسلة بي إن بي: جدوى عالية",fr:"EACO → BNB Chain : faisabilité élevée",ru:"EACO → BNB Chain: высокая осуществимость"},
  text:{en:"Solana has smart contracts and a mature Wormhole / pegging ecosystem; DOGE, SOL and ETH already exist as BEP20 on BNB Chain. EACO can ship Options A→B→C on a realistic 3–6 month timeline.",zh:"Solana 拥有智能合约与成熟的 Wormhole / 锚定生态；DOGE、SOL、ETH 在 BNB Chain 上均有 BEP20 先例。EACO 可在 3–6 个月内按 A→B→C 方案推进。",es:"Solana tiene contratos inteligentes y un ecosistema Wormhole/peg maduro; DOGE, SOL y ETH ya existen como BEP20 en BNB Chain. EACO puede avanzar A→B→C en 3–6 meses.",ar:"تمتلك سولانا عقودًا ذكية ونظام وورم هول/ربط ناضجًا؛ DOGE و SOL و ETH موجودة بالفعل كـ BEP20 على بي إن بي. يمكن لـ EACO التقدم أ→ب→ج خلال ٣–٦ أشهر.",fr:"Solana a des contrats intelligents et un écosystème Wormhole/peg mature ; DOGE, SOL et ETH existent déjà en BEP20 sur BNB Chain. EACO peut livrer A→B→C en 3–6 mois.",ru:"У Solana есть смарт-контракты и зрелая экосистема Wormhole/peg; DOGE, SOL и ETH уже существуют как BEP20 в BNB Chain. EACO может пройти варианты A→B→C за 3–6 месяцев."}},
 {title:{en:"EAC (Earthcoin) → multi-chain: medium feasibility, high security bar",zh:"EAC（Earthcoin）→ 多链：中等可行性、高安全门槛",es:"EAC (Earthcoin) → multicadena: viabilidad media, alto estándar de seguridad",ar:"EAC (إيرثكوين) → تعدد سلاسل: جدوى متوسطة ومعيار أمان عالٍ",fr:"EAC (Earthcoin) → multi-chaînes : faisabilité moyenne, exigence de sécurité élevée",ru:"EAC (Earthcoin) → мультичейн: средняя осуществимость, высокие требования к безопасности"},
  text:{en:"EAC is a UTXO chain without smart contracts, so only custody-and-wrap works. The multisig support in Sandokaaan v2.1.4 provides the missing infrastructure; success depends on a credible federation, audits and reserve attestations.",zh:"EAC 是无智能合约的 UTXO 链，只能走托管-包装。Sandokaaan v2.1.4 的多签支持恰好补上基础设施缺口；成败取决于可信联邦、审计与储量证明。",es:"EAC es una cadena UTXO sin contratos inteligentes, solo funciona custodia-y-envoltura. El multisig de v2.1.4 aporta la infraestructura faltante; el éxito depende de una federación creíble, auditorías y certificaciones de reserva.",ar:"EAC سلسلة UTXO بلا عقود ذكية، فلا تصلح إلا الوصاية والتغليف. توفر ميزة التوقيع المتعدد في v2.1.4 البنية الناقصة؛ يعتمد النجاح على اتحاد موثوق وتدقيقات وإثباتات احتياطي.",fr:"EAC est une chaîne UTXO sans contrats intelligents : seule la garde-et-enveloppe fonctionne. Le multisig de v2.1.4 fournit l'infrastructure manquante ; le succès dépend d'une fédération crédible, d'audits et d'attestations de réserves.",ru:"EAC — UTXO-сеть без смарт-контрактов, работает только схема «хранение и обёртка». Мультисиг в v2.1.4 даёт недостающую инфраструктуру; успех зависит от доверенной федерации, аудитов и аттестаций резервов."}},
 {title:{en:"Carrier matrix: recommend starting with stablecoins",zh:"载体矩阵：建议从稳定币起步",es:"Matriz portadora: empezar por stablecoins",ar:"مصفوفة الحوامل: يُنصح بالبدء بالعملات المستقرة",fr:"Matrice porteuse : démarrer par les stablecoins",ru:"Матрица носителей: начинать со стейблкоинов"},
  text:{en:"USDT/USDC are the only assets with verified native forms on both chains. A stablecoin-first route gives EACO immediate liquidity and a zero-trust bridge for users, while wBNB/wETH/zBTC/BTCB expand later.",zh:"USDT/USDC 是唯二在双链都有已验证原生形态的资产。稳定币优先路线可让 EACO 立即获得流动性，用户无需信任任何桥；wBNB/wETH/zBTC/BTCB 随后扩容。",es:"USDT/USDC son los únicos activos con forma nativa verificada en ambas cadenas. La ruta stablecoin-first da a EACO liquidez inmediata sin puentes; wBNB/wETH/zBTC/BTCB se suman después.",ar:"USDT/USDC هما الأصول الوحيدة ذات الشكل الأصلي الموثق في السلسلتين. مسار العملات المستقرة أولًا يمنح EACO سيولة فورية دون جسور؛ وتُضاف wBNB/wETH/zBTC/BTCB لاحقًا.",fr:"USDT/USDC sont les seuls actifs natifs vérifiés sur les deux chaînes. La voie stablecoin-first donne à EACO une liquidité immédiate sans pont ; wBNB/wETH/zBTC/BTCB suivront.",ru:"USDT/USDC — единственные активы с проверенной нативной формой в обеих сетях. Путь «сначала стейблкоины» даёт EACO мгновенную ликвидность без мостов; wBNB/wETH/zBTC/BTCB подключаются позже."}}
],
precedents:[
 {title:{en:"DOGE circulates on three chains at once",zh:"DOGE 同时在三条链流通",es:"DOGE circula en tres cadenas a la vez",ar:"DOGE يتداول على ثلاث سلاسل في آنٍ واحد",fr:"DOGE circule sur trois chaînes à la fois",ru:"DOGE обращается сразу в трёх сетях"},
  text:{en:"Native Dogecoin, Binance-Peg DOGE (BSC) and doge-spl (Solana) coexist. Multi-chain pegging of one asset is well accepted by the market.",zh:"狗狗币原生链、币安锚定 DOGE（BSC）与 doge-spl（Solana）并行流通——同一资产多链锚定已被市场广泛接受。",es:"Dogecoin nativo, Binance-Peg DOGE (BSC) y doge-spl (Solana) coexisten. El anclaje multicadena de un activo es aceptado por el mercado.",ar:"يتعايش دوجكوين الأصلي و DOGE المربوط ببينانس (BSC) و doge-spl (سولانا). ربط الأصل نفسه عبر سلاسل متعددة مقبول على نطاق واسع.",fr:"Dogecoin natif, Binance-Peg DOGE (BSC) et doge-spl (Solana) coexistent. Le peg multi-chaînes est largement accepté.",ru:"Нативный Dogecoin, Binance-Peg DOGE (BSC) и doge-spl (Solana) сосуществуют. Мультичейн-закрепление актива широко принято рынком."},
  url:"https://www.oklink.com/zh-hans/bsc/token/0xba2ae424d960c26247dd6c32edc70b295c744c43"},
 {title:{en:"SOL already exists as BEP20",zh:"SOL 已有 BEP20 形态",es:"SOL ya existe como BEP20",ar:"SOL موجودة بالفعل كـ BEP20",fr:"SOL existe déjà en BEP20",ru:"SOL уже существует как BEP20"},
  text:{en:"SOLANA (SOL) BEP20 is listed on OKLink, proving that chain-native assets can be mirrored onto BNB Chain even with limited backing depth.",zh:"SOLANA (SOL) BEP20 已被 OKLink 收录，证明链原生资产可镜像到 BNB Chain——即使背书深度有限。",es:"SOLANA (SOL) BEP20 está listada en OKLink, prueba de que los activos nativos pueden reflejarse en BNB Chain.",ar:"SOLANA (SOL) BEP20 مُدرج في OKLink، دليل على إمكانية انعكاس الأصول الأصلية على بي إن بي.",fr:"SOLANA (SOL) BEP20 est listé sur OKLink, preuve que les actifs natifs peuvent se refléter sur BNB Chain.",ru:"SOLANA (SOL) BEP20 указан в OKLink — доказательство, что нативные активы могут отражаться в BNB Chain."},
  url:"https://www.oklink.com/zh-hans/bsc/token/0x570a5d26f7765ecb712c0924e4de545b89fd43df"},
 {title:{en:"UTXO assets enter Solana via zBTC (Zeus)",zh:"UTXO 资产经 zBTC（Zeus）进入 Solana",es:"Activos UTXO entran a Solana vía zBTC (Zeus)",ar:"أصول UTXO تدخل سولانا عبر zBTC (Zeus)",fr:"Les actifs UTXO entrent sur Solana via zBTC (Zeus)",ru:"UTXO-активы входят в Solana через zBTC (Zeus)"},
  text:{en:"The APOLLO bridge moves BTC 1:1 into Solana and plans DOGE/LTC expansion — proof that custody-and-wrap works for UTXO assets, exactly the EAC playbook Earthcoin needs.",zh:"APOLLO 桥把 BTC 以 1:1 带入 Solana并规划扩展 DOGE/LTC——证明托管-包装适用于 UTXO 资产，这正是 Earthcoin 需要的路线。",es:"El puente APOLLO mueve BTC 1:1 a Solana y planea DOGE/LTC — prueba de que custodia-y-envoltura funciona para UTXO, justo lo que Earthcoin necesita.",ar:"جسر APOLLO ينقل BTC بنسبة ١:١ إلى سولانا ويخطط لتوسعة DOGE/LTC — دليل أن الوصاية والتغليف تعمل لأصول UTXO، تمامًا كما يحتاج إيرثكوين.",fr:"Le pont APOLLO déplace BTC 1:1 vers Solana et prévoit DOGE/LTC — preuve que garde-et-enveloppe fonctionne pour l'UTXO, exactement ce dont Earthcoin a besoin.",ru:"Мост APOLLO переносит BTC 1:1 в Solana и планирует DOGE/LTC — доказательство, что «хранение и обёртка» работает для UTXO, что и нужно Earthcoin."}},
 {title:{en:"Wormhole & Binance-Peg packaging is standardized",zh:"Wormhole 与币安锚定封装已成标准",es:"El empaquetado Wormhole y Binance-Peg es estándar",ar:"تغليف وورم هول وبينانس أصبح معيارًا",fr:"L'empaquetage Wormhole et Binance-Peg est standardisé",ru:"Обёртки Wormhole и Binance-Peg стандартизированы"},
  text:{en:"wBNB/wETH across Solana and BSC have run for years with audited contracts and multisig — the same security wrapper EACO can reuse instead of building new infrastructure.",zh:"wBNB/wETH 跨 Solana 与 BSC 已运行多年，合约经审计、多签管理——EACO 直接复用这套安全包装器即可，不必自建新设施。",es:"wBNB/wETH llevan años en Solana y BSC con contratos auditados y multisig — el mismo envoltorio que EACO puede reutilizar.",ar:"تعمل wBNB/wETH عبر سولانا و BSC منذ سنوات بعقود مدقّقة وتوقيع متعدد — نفس الغلاف الذي يمكن لـ EACO إعادة استخدامه.",fr:"wBNB/wETH sur Solana et BSC tournent depuis des années avec contrats audités et multisig — la même enveloppe que EACO peut réutiliser.",ru:"wBNB/wETH в Solana и BSC работают годами с аудированными контрактами и мультисигом — тот же предохранитель, который EACO может переиспользовать."},
  url:"https://www.oklink.com/zh-hans/bsc/token/0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c"}

  desc:{en:"Form a multi-sig guardian federation on v2.1.4 wallets; mint EACO on Solana/BSC at a 1:1 or market-based rate; run monthly reserve attestations and a public redemption oracle.",zh:"在 v2.1.4 钱包上组建多签守护者联邦；在 Solana/BSC 按 1:1 或随市场变化铸造 EACO；每月储量证明 + 公开赎回预言机。",es:"Formar una federación multisig en wallets v2.1.4; acuñar EACO en Solana/BSC a razón 1:1 o según el mercado; certificaciones mensuales y oráculo público de canje.",ar:"تشكيل اتحاد أوصياء بتوقيع متعدد على محافظ v2.1.4؛ سكّ EACO على سولانا/بي إن بي بنسبة ١:١ أو حسب السوق؛ إثباتات احتياطي شهرية وأوراكل استرداد علني.",fr:"Former une fédération de gardiens multisig sur wallets v2.1.4 ; frapper EACO sur Solana/BSC au taux de 1:1 ou selon le marché ; attestations mensuelles et oracle public de rachat.",ru:"Сформировать мультисиг-федерацию на кошельках v2.1.4; чеканить EACO в Solana/BSC в соотношении 1:1 или по рыночному курсу; ежемесячные аттестации резервов и публичный оракул выкупа."}}

risks:[
 {lvl:3,title:{en:"Smart-contract security of lock-and-mint / wrap",zh:"锁定-铸造 / 包装合约安全",es:"Seguridad de contratos bloquear-acuñar/envueltos",ar:"أمان عقود القفل-والسكّ / التغليف",fr:"Sécurité des contrats verrou-frappe / enveloppe",ru:"Безопасность контрактов блокировки-чеканки / обёртки"},
  desc:{en:"Bridge contracts are prime attack targets; a flaw could drain the backing reserves.",zh:"桥合约是攻击首选目标；一个漏洞可能抽干背书储备。",es:"Los contratos de puentes son objetivo principal; un fallo podría drenar las reservas de respaldo.",ar:"عقود الجسور هدف أساسي للهجمات؛ أي ثغرة قد تستنزف احتياطي الضمان.",fr:"Les contrats de pont sont des cibles majeures ; une faille pourrait épuiser les réserves de couverture.",ru:"Контракты мостов — главная цель атак; уязвимость может опустошить резервы обеспечения."},
  mit:{en:"Two independent audits, time locks, pause switches, gradual supply caps, bug bounty.",zh:"两轮独立审计、时间锁、暂停开关、供给上限逐步放开、漏洞赏金。",es:"Dos auditorías, time locks, pausas, topes graduales, bug bounty.",ar:"تدقيقان مستقلان وأقفال زمنية ومفاتيح إيقاف وسقوف تدريجية ومكافأة ثغرات.",fr:"Deux audits, time locks, interrupteurs, plafonds graduels, bug bounty.",ru:"Два аудита, тайм-локи, стоп-переключатели, постепенные лимиты, баунти."}},
 {lvl:3,title:{en:"Custodian / counterparty risk (EAC federation)",zh:"托管与对手方风险（EAC 联邦）",es:"Riesgo de custodio/contraparte (federación EAC)",ar:"مخاطر الوصي والطرف المقابل (اتحاد EAC)",fr:"Risque dépositaire / contrepartie (fédération EAC)",ru:"Риск хранителя / контрагента (федерация EAC)"},
  desc:{en:"The federation could mismanage the EAC reserve or collude on redemptions.",zh:"联邦可能管理不善 EAC 储备或在赎回上合谋。",es:"La federación podría gestionar mal la reserva o coludirse en los canjes.",ar:"قد تُساء إدارة احتياطي EAC أو تتواطأ في عمليات الاسترداد.",fr:"La fédération pourrait mal gérer la réserve ou se concerter sur les rachats.",ru:"Федерация может управлять резервом недобросовестно или сговариваться при выкупе."},
  mit:{en:"Public multisig addresses, monthly reserve attestations, on-chain treasury dashboard, slashable penalties.",zh:"公开多签地址、月度储量证明、链上金库看板、可罚没机制。",es:"Multisig público, certificaciones mensuales, dashboard de tesorería, sanciones.",ar:"عناوين توقيع متعدد علنية وإثباتات شهرية ولوحة خزينة على السلسلة وعقوبات.",fr:"Multisig public, attestations mensuelles, tableau de bord de trésorerie, pénalités.",ru:"Публичный мультисиг, ежемесячные аттестации, ончейн-дашборд казны, штрафы."}},
 {lvl:2,title:{en:"Liquidity fragmentation across chains",zh:"跨链流动性碎片化",es:"Fragmentación de liquidez entre cadenas",ar:"تفتت السيولة بين السلاسل",fr:"Fragmentation de la liquidité entre chaînes",ru:"Фрагментация ликвидности между сетями"},
  desc:{en:"Multi-chain issuance can split depth and widen spreads.",zh:"多链发行可能摊薄深度、拉宽价差。",es:"La emisión multicadena puede dividir profundidad y ampliar spreads.",ar:"قد يفتت الإصدار متعدد السلاسل العمق ويوسع فروق الأسعار.",fr:"L'émission multi-chaînes peut diviser la profondeur et élargir les spreads.",ru:"Мультичейн-выпуск может разделить глубину и расширить спреды."},
  mit:{en:"Stablecoin-routing aggregation, one deep primary pool, cross-DEX smart order routing.",zh:"稳定币路由聚合、单一大主池、跨 DEX 智能订单路由。",es:"Agregación por stablecoins, un pool principal profundo, routing inteligente entre DEX.",ar:"تجميع مسار العملات المستقرة ومجمع رئيسي عميق وتوجيه ذكي بين البورصات اللامركزية.",fr:"Agrégation par stablecoins, un pool principal profond, routing intelligent inter-DEX.",ru:"Агрегация через стейблкоины, один глубокий пул, смарт-маршрутизация между DEX."}},
 {lvl:2,title:{en:"Naming confusion: EAC vs EACO (地球币 vs 地球)",zh:"命名混淆：EAC 与 EACO（中文名「地球币」与「地球」）",es:"Confusión de nombres: EAC vs EACO",ar:"التباس الأسماء: EAC مقابل EACO",fr:"Confusion de noms : EAC vs EACO",ru:"Путаница имён: EAC и EACO"},
  desc:{en:"Similar tickers — and the similar Chinese names 地球币 (Earth Coin) vs 地球 (Earth) — invite buy-side mistakes and phishing lookalikes.",zh:"相近简称、以及中文名「地球币」与「地球」高度相似，极易引发购买失误与仿冒钓鱼。",es:"Tickers similares invitan a errores de compra y phishing.",ar:"الرموز المتشابهة تسبب أخطاء شراء وتقليدًا للتصيد.",fr:"Des tickers proches invitent aux erreurs d'achat et au phishing.",ru:"Похожие тикеры провоцируют ошибки покупки и фишинг."},
  mit:{en:"Annotate the Chinese names 地球币 / 地球 side by side; distinct wrapped symbol EACO, branded contract pages, wallet-address warnings in UI.",zh:"中文名分别标注「地球币」「地球」并对比展示；区别化包装符号 EACO、品牌合约页、界面地址警示。",es:"Símbolo EACO distinto, páginas de contrato con marca, avisos de dirección en UI.",ar:"رمز مغلف مميز EACO وصفحات عقود ذات علامة تجارية وتحذيرات عناوين في الواجهة.",fr:"Symbole distinct EACO, pages de contrat de marque, alertes d'adresse dans l'UI.",ru:"Отличимый символ EACO, брендированные страницы контрактов, предупреждения адресов в UI."}},

  mit:{en:"Legal review per jurisdiction, geo-blocking where needed, transparent disclosures, no securities marketing language.",zh:"逐辖区法律审核、必要时地域封锁、透明披露、避免证券化宣传措辞。",es:"Revisión legal por jurisdicción, bloqueo geográfico, divulgación transparente, sin lenguaje de valores.",ar:"مراجعة قانونية لكل ولاية قضائية وحجب جغرافي عند الحاجة وإفصاح شفاف وبلا صياغة ترويج للأوراق المالية.",fr:"Revue juridique par juridiction, blocage géographique, divulgation transparente, pas de langage de valeurs mobilières.",ru:"Юрзаключение по юрисдикциям, геоблокировка, прозрачные раскрытия, без рекламной риторики ценных бумаг."}},

dogeSteps:[
 {ph:{en:"Step 1",zh:"步骤 1",es:"Paso 1",ar:"الخطوة ١",fr:"Étape 1",ru:"Шаг 1"},
  title:{en:"Native DOGE enters Solana (Wormhole NTT + RISC Zero ZK)",zh:"DOGE 原链进入 Solana（Wormhole NTT + RISC Zero ZK）",es:"DOGE nativo entra en Solana (Wormhole NTT + RISC Zero ZK)",ar:"دخول DOGE الأصلي إلى سولانا (Wormhole NTT + RISC Zero ZK)",fr:"Le DOGE natif entre dans Solana (Wormhole NTT + RISC Zero ZK)",ru:"Нативный DOGE входит в Solana (Wormhole NTT + RISC Zero ZK)"},
  desc:{en:"Dogecoin is a PoW UTXO chain without smart contracts, so bridging relies on external protocols. Wormhole NTT + RISC Zero ZKVM verify Dogecoin block headers on-chain and mint native (not wrapped) DOGE on Solana at the unified mint DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R — no custody, no multisig.",zh:"狗狗币是无智能合约的 PoW UTXO 链，跨链必须依赖外部桥协议。Wormhole NTT + RISC Zero ZKVM 在 Solana 链上验证 Dogecoin 区块头，并在统一 Mint 地址 DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R 铸造原生（非包装）DOGE——无托管、无多签。",es:"Dogecoin es una cadena UTXO PoW sin contratos inteligentes, por lo que el puente depende de protocolos externos. Wormhole NTT + RISC Zero ZKVM verifican los encabezados de Dogecoin en cadena y acuñan DOGE nativo (no envuelto) en Solana en el mint unificado DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R: sin custodia ni multisig.",ar:"دوجكوين سلسلة UTXO بإثبات العمل دون عقود ذكية، لذا يعتمد الجسر على بروتوكولات خارجية. يتحقق Wormhole NTT + RISC Zero ZKVM من ترويسات دوجكوين على السلسلة ويسكّ DOGE الأصلي (غير المغلف) على سولانا عند المينت الموحّد DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R — بلا وصاية وبلا توقيع متعدد.",fr:"Dogecoin est une chaîne UTXO PoW sans contrats intelligents ; le pont repose donc sur des protocoles externes. Wormhole NTT + RISC Zero ZKVM vérifient les en-têtes Dogecoin sur chaîne et frappent un DOGE natif (non enveloppé) sur Solana au mint unifié DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R — sans garde ni multisig.",ru:"Dogecoin — UTXO-цепь PoW без смарт-контрактов, поэтому мост опирается на внешние протоколы. Wormhole NTT + RISC Zero ZKVM проверяют заголовки блоков Dogecoin ончейн и чеканят нативный (необёрнутый) DOGE в Solana на едином минте DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R — без кастодианов и мультисига."}},
 {ph:{en:"Step 2",zh:"步骤 2",es:"Paso 2",ar:"الخطوة ٢",fr:"Étape 2",ru:"Шаг 2"},
  title:{en:"Build the DOGE-EACO pool on Solana",zh:"在 Solana 建立 DOGE-EACO 价值互换池",es:"Crear el pool DOGE-EACO en Solana",ar:"إنشاء مجمع DOGE-EACO على سولانا",fr:"Créer le pool DOGE-EACO sur Solana",ru:"Создать пул DOGE-EACO в Solana"},
  desc:{en:"EACO already lives on Solana as a native SPL token (DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH). To exchange value with native DOGE, explore a DOGE-EACO pool on Raydium / Orca / Meteora DLMM (reference pool page below). Quant bots could keep the price aligned — a research scenario, not a live commitment.",zh:"EACO 已是 Solana 原生 SPL 代币（DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH）。要与原生 DOGE 实现价值互换，可在 Raydium / Orca / Meteora DLMM 探索建立 DOGE-EACO 池（参考池页面见下方）。量化机器人可在池内维持价格对齐——这属于研究设想，并非落地承诺。",es:"EACO ya vive en Solana como token SPL nativo (DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH). Para intercambiar valor con DOGE nativo, explorar un pool DOGE-EACO en Raydium / Orca / Meteora DLMM (página de pool de referencia abajo). Los bots cuantitativos podrían alinear el precio: un escenario de investigación, no un compromiso en vivo.",ar:"EACO يعيش بالفعل على سولانا كرمز SPL أصلي (DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH). لتبادل القيمة مع DOGE الأصلي، استكشف مجمع DOGE-EACO على Raydium / Orca / Meteora DLMM (صفحة المجمع المرجعية أدناه). يمكن لروبوتات الكم إبقاء السعر متوازنًا — سيناريو بحث وليس التزامًا فعليًا.",fr:"EACO vit déjà sur Solana en tant que jeton SPL natif (DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH). Pour échanger de la valeur avec le DOGE natif, explorer un pool DOGE-EACO sur Raydium / Orca / Meteora DLMM (page de pool de référence ci-dessous). Des bots quantitatifs pourraient aligner le prix — un scénario de recherche, pas un engagement opérationnel.",ru:"EACO уже живёт в Solana как нативный SPL-токен (DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH). Для обмена стоимостью с нативным DOGE исследуется пул DOGE-EACO на Raydium / Orca / Meteora DLMM (справочная страница пула ниже). Квант-боты могли бы удерживать цену — исследовательский сценарий, а не действующее обязательство."}},
 {ph:{en:"Step 3",zh:"步骤 3",es:"Paso 3",ar:"الخطوة ٣",fr:"Étape 3",ru:"Шаг 3"},
  title:{en:"EACO bridges onward via Wormhole to BNB Chain / EVM",zh:"EACO 经 Wormhole 跨链至 BNB Chain / EVM",es:"EACO cruza vía Wormhole a BNB Chain / EVM",ar:"عبور EACO عبر Wormhole إلى سلسلة BNB / EVM",fr:"EACO traverse via Wormhole vers BNB Chain / EVM",ru:"EACO переходит через Wormhole в BNB Chain / EVM"},
  desc:{en:"From Solana, EACO continues through the Wormhole multi-chain bridge to BNB Chain, Ethereum, Polygon, Arbitrum and 40+ chains — mirroring how DOGE roams across ecosystems and unlocking multi-chain liquidity for Earthcoin.（探索性表述）",zh:"从 Solana 出发，EACO 经 Wormhole 多链桥继续跨至 BNB Chain、Ethereum、Polygon、Arbitrum 等 40+ 条链——与 DOGE 的生态漫游方式保持一致，为地球生态解锁多链流动性。（探索性表述）",es:"Desde Solana, EACO continúa por el puente multicadena Wormhole hacia BNB Chain, Ethereum, Polygon, Arbitrum y más de 40 cadenas, replicando cómo DOGE recorre ecosistemas y desbloqueando liquidez multicadena para Earthcoin.（表述探索性）",ar:"من سولانا، يواصل EACO عبر جسر Wormhole متعدد السلاسل إلى سلسلة BNB وإيثيريوم وبوليجون وأربيتروم وأكثر من ٤٠ سلسلة — بمحاكاة تنقّل DOGE بين الأنظمة البيئية وفتح سيولة متعددة السلاسل للـ Earthcoin.（تعبير استكشافي）",fr:"Depuis Solana, EACO poursuit via le pont multichaînes Wormhole vers BNB Chain, Ethereum, Polygon, Arbitrum et 40+ chaînes — comme DOGE se déplace entre écosystèmes, pour débloquer une liquidité multichaînes pour Earthcoin.（formulation exploratoire）",ru:"Из Solana EACO продолжает путь через мультичейн-мост Wormhole в BNB Chain, Ethereum, Polygon, Arbitrum и 40+ сетей — повторяя путь DOGE между экосистемами и открывая мультичейн-ликвидность для Earthcoin.（исследовательская формулировка）"}},
 {ph:{en:"Step 4",zh:"步骤 4",es:"Paso 4",ar:"الخطوة ٤",fr:"Étape 4",ru:"Шаг 4"},
  title:{en:"Close the loop: redeem & release",zh:"闭环：赎回与释放",es:"Cerrar el ciclo: canje y liberación",ar:"إغلاق الحلقة: الاسترداد والإفراج",fr:"Boucler la boucle : rachat et libération",ru:"Замкнуть цикл: выкуп и выпуск"},
  desc:{en:"Redemption burns SPL DOGE on Solana and releases DOGE on the native chain; the same aligned mechanism would let EACO travel back from BNB Chain to Solana. Result: DOGE ↔ Solana ↔ EACO ↔ BNB Chain, a verifiable round trip at the same level as the DOGE standard.",zh:"赎回时销毁 Solana 上的 SPL DOGE、在原链释放 DOGE；对齐同一机制后，EACO 也可从 BNB Chain 回流 Solana。最终形成 DOGE ↔ Solana ↔ EACO ↔ BNB Chain 的可核验闭环，与 DOGE 标准同级。",es:"El canje quema el SPL DOGE en Solana y libera DOGE en la cadena nativa; el mismo mecanismo alineado permitiría a EACO regresar de BNB Chain a Solana. Resultado: DOGE ↔ Solana ↔ EACO ↔ BNB Chain, un ciclo verificable al mismo nivel que el estándar DOGE.",ar:"يحرق الاسترداد دوجكوين SPL على سولانا ويُفرج عن DOGE على السلسلة الأصلية؛ وبنفس الآلية المتوافقة يمكن لـ EACO العودة من سلسلة BNB إلى سولانا. النتيجة: DOGE ↔ سولانا ↔ EACO ↔ سلسلة BNB، حلقة كاملة قابلة للتحقق بنفس مستوى معيار DOGE.",fr:"Le rachat brûle le SPL DOGE sur Solana et libère le DOGE sur la chaîne native ; le même mécanisme aligné permettrait à EACO de revenir de BNB Chain vers Solana. Résultat : DOGE ↔ Solana ↔ EACO ↔ BNB Chain, une boucle vérifiable au même niveau que la norme DOGE.",ru:"Выкуп сжигает SPL DOGE в Solana и высвобождает DOGE в нативной сети; тот же выровненный механизм позволил бы EACO вернуться из BNB Chain в Solana. Итог: DOGE ↔ Solana ↔ EACO ↔ BNB Chain — проверяемый замкнутый цикл на уровне стандарта DOGE."}}
],

  title:{en:"DOGE donation pool (transparent ledger)",zh:"DOGE 捐赠池（链上透明台账）",es:"Pool de donaciones en DOGE (registro transparente)",ar:"صندوق تبرعات DOGE (سجل شفاف)",fr:"Cagnotte en DOGE (registre transparent)",ru:"Пул пожертвований в DOGE (прозрачный реестр)"},
  desc:{en:"(Explore) Publish a dedicated DOGE address, validate it through the multi-sig guardian federation, record every inflow and outflow on-chain, and freeze the pool between milestones to prevent misuse.",zh:"（探讨）公示专属 DOGE 收款地址，并经多签守护者联邦核验；每一笔记入与支出都在链上留痕；里程碑之间冻结资金池，防止挪用。",es:"(Explorar) Publicar una dirección DOGE dedicada validada por la federación multisig; registrar cada entrada y salida en cadena; congelar el pool entre hitos para evitar mal uso.",ar:"(استكشاف) نشر عنوان DOGE مخصص والتحقق منه عبر اتحاد التوقيع المتعدد؛ توثيق كل إيداع وسحب على السلسلة؛ تجميد الصندوق بين المعالم لمنع سوء الاستخدام.",fr:"(Explorer) Publier une adresse DOGE dédiée, validée par la fédération multisig ; chaque dépôt et retrait tracé sur chaîne ; geler la cagnotte entre jalons contre tout abus.",ru:"(Исследование) Публикация выделенного адреса DOGE с проверкой мультисиг-федерацией; каждая операция входа и выхода фиксируется ончейн; заморозка пула между этапами против злоупотреблений."}},
 {ph:{en:"Method 2",zh:"方式二",es:"Método 2",ar:"الطريقة ٢",fr:"Méthode 2",ru:"Способ 2"},
  title:{en:"EACO exploratory pre-mint (milestone-locked)",zh:"EACO 探索型预铸（里程碑解锁）",es:"Pre-minteo exploratorio de EACO (bloqueado por hitos)",ar:"سكّ استكشافي مسبق لـ EACO (مقفل بالمعالم)",fr:"Pré-frappe exploratoire d'EACO (verrouillée par jalons)",ru:"Экспериментальный предварительный минт EACO (по этапам)"},
  desc:{en:"(Explore) Discuss a pre-mint of wrapped EACO at a 1:1 or market-based rate against pledged backing, released only when development milestones pass; undistributed portion refunded or burned if goals are not met.",zh:"（探讨）讨论按 1:1 或随市场变化比例，就质押背书预铸包装 EACO；仅在开发里程碑达成时释放；目标未达成则退回或销毁未分配部分。",es:"(Explorar) Debater un pre-minteo de EACO envuelto a razón 1:1 o según el mercado, liberado solo al superar hitos; devolver o quemar lo no asignado si no se cumplen las metas.",ar:"(استكشاف) مناقشة سكّ مسبق لـ EACO المغلف بنسبة ١:١ أو حسب السوق؛ لا يُطلق إلا عند تجاوز المعالم؛ إعادة أو حرق غير الموزع إذا لم تتحقق الأهداف.",fr:"(Explorer) Discuter d'une pré-frappe d'EACO enveloppé au taux de 1:1 ou selon le marché, libérée uniquement au passage des jalons ; remboursement ou brûlage si les objectifs ne sont pas atteints.",ru:"(Исследование) Обсуждение предварительного минта обёрнутого EACO по курсу 1:1 или рыночному против залога, выпуск только после этапов; возврат или сжигание нераспределённого при срыве целей."}},
 {ph:{en:"Method 3",zh:"方式三",es:"Método 3",ar:"الطريقة ٣",fr:"Méthode 3",ru:"Способ 3"},
  title:{en:"Milestone-based release & refund policy",zh:"里程碑分阶段释放与退回机制",es:"Liberación por hitos y política de reembolso",ar:"إطلاق على مراحل وسياسة استرداد",fr:"Libération par jalons et politique de remboursement",ru:"Поэтапный выпуск и политика возврата"},
