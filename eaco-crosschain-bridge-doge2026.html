 encore lancé.","ru":"Этап A дорожной карты планирует EACO(BEP20) в сети BNB Chain через блокировку и чеканку: EACO блокируется в Solana и чеканится 1:1 в BSC. Проект находится на этапе исследований и пока не запущен."}},{"id":57,"cat":"mechanism","q":{"en":"Which model brings DOGE to Solana?","zh":"DOGE 跨链到 Solana 应采用哪种方案？","es":"¿Qué modelo lleva DOGE a Solana?","ar":"ما النموذج الذي ينقل DOGE إلى Solana؟","fr":"Quel modèle amène DOGE vers Solana ?","ru":"Какая модель переносит DOGE в Solana?"},"a":{"en":"DOGE is a UTXO chain without smart contracts, so moving it to Solana relies on custody & wrap: custodians hold DOGE while doge-spl is issued 1:1 on Solana.","zh":"DOGE 是 UTXO 链且无智能合约，跨链到 Solana 只能采用托管-包装：托管方持有 DOGE，Solana 端发行 1:1 的 doge-spl。","es":"DOGE es una cadena UTXO sin contratos inteligentes, así que su traslado a Solana usa custodia y envoltura: los custodios guardan DOGE y se emite doge-spl 1:1 en Solana.","ar":"بما أن DOGE سلسلة UTXO بلا عقود ذكية، فإن نقلها إلى Solana يتم عبر نموذج الحراسة والتغليف: يحتفظ الأمناء بعملات DOGE الأصلية ويُصدرون doge-spl بنسبة ١:١ على Solana.","fr":"DOGE est une chaîne UTXO sans contrats intelligents, donc son transfert vers Solana passe par la garde et l'empaquetage : des dépositaires conservent DOGE et doge-spl est émis à 1:1 sur Solana.","ru":"DOGE — это UTXO-цепь без смарт-контрактов, поэтому перевод в Solana использует кастодиальное хранение и обёртывание: хранители держат нативные монеты DOGE, а doge-spl выпускается в соотношении 1:1 на целевом протоколе Solana."}},{"id":58,"cat":"mechanism","q":{"en":"What does 1:1 pegging mean?","zh":"1:1 锚定的含义是什么？","es":"¿Qué significa la vinculación 1:1?","ar":"ماذا يعني الارتباط بنسبة ١:١؟","fr":"Que signifie l'ancrage 1:1 ?","ru":"Что означает привязка 1:1?"},"a":{"en":"1:1 pegging means each wrapped token on the target chain corresponds to the native asset's value: every wrapped token issued must be backed by the native asset, keeping redemption ratios stable.","zh":"1:1 锚定指目标链包装代币与源链原生资产等值对应：每发行一个包装代币，就必须有对应数量的原生资产背书，保证赎回比例稳定。","es":"La vinculación 1:1 significa que cada token envuelto en la cadena de destino corresponde al valor del activo nativo: cada token emitido cuenta con respaldo del activo nativo, manteniendo estable el canje.","ar":"يعني الارتباط بنسبة ١:١ أن كل رمز مغلَّف على السلسلة الهدف يقابل قيمة الأصل الأصلي؛ كل رمز يُصدر يجب أن يكون مدعومًا بالأصل الأصلي، مما يحافظ على استقرار نسبة الاسترداد.","fr":"L'ancrage 1:1 signifie que chaque jeton enveloppé correspond à la valeur de l'actif natif : chaque jeton émis doit être adossé à l'actif natif, ce qui maintient un taux de rachat stable.","ru":"Привязка 1:1 означает, что каждый обёрнутый токен на целевой цепи соответствует стоимости нативного актива: каждый выпущенный токен должен быть обеспечен нативным активом, сохраняя стабильность погашения."}},{"id":59,"cat":"mechanism","q":{"en":"What is multi-signature custody?","zh":"多签托管指的是什么？","es":"¿Qué es la custodia multifirma?","ar":"ما هي الحراسة متعددة التوقيعات؟","fr":"Qu'est-ce que la garde multi-signatures ?","ru":"Что такое мультиподписное хранение?"},"a":{"en":"Multi-signature custody means several independent signers jointly manage the custody address; transfers require an agreed majority of signatures, reducing single-point risk. It is a common safeguard for custody & wrap.","zh":"多签托管指多个独立签名方共同管理托管地址，任何转出需达到约定的多数签名才能执行，可降低单点风险，是托管-包装方案的常见安全机制。","es":"La custodia multifirma implica que varios firmantes independientes administran la dirección de custodia; cualquier transferencia requiere la mayoría acordada de firmas, reduciendo el riesgo de punto único. Es común en custodia y envoltura.","ar":"تعني الحراسة متعددة التوقيعات أن عدة موقّعين مستقلين يديرون عنوان الحراسة معًا؛ أي تحويل يتطلب أغلبية متفقًا عليها من التوقيعات، مما يقلل مخاطر النقطة الواحدة، وهو آلية شائعة في نموذج الحراسة والتغليف.","fr":"La garde multi-signatures signifie que plusieurs signataires indépendants gèrent l'adresse de garde ; tout transfert exige une majorité convenue de signatures, réduisant le risque de point unique. C'est une protection courante pour la garde et l'empaquetage.","ru":"Мультиподписное хранение — это управление адресом хранения несколькими независимыми подписантами; любой перевод требует согласованного большинства подписей, снижая риск единой точки отказа. Это распространённая защита при кастодиальном хранении и обёртывании."}},{"id":60,"cat":"mechanism","q":{"en":"What is proof of reserves?","zh":"储备证明的含义是什么？","es":"¿Qué son las pruebas de reservas?","ar":"ما هو إثبات الاحتياطيات؟","fr":"Qu'est-ce que la preuve de réserves ?","ru":"Что такое доказательство резервов?"},"a":{"en":"Proof of reserves is public on-chain data or audit evidence showing that custodians hold native assets matching every wrapped token issued, verifying that the 1:1 peg is real.","zh":"储备证明是公开的链上数据或审计凭证，用于证明托管方持有的原生资产数量与已发行的包装代币数量相符，从而验证 1:1 锚定的真实性，便于用户核验发行透明度。","es":"Las pruebas de reservas son datos públicos en cadena o evidencia de auditoría que muestran que los custodios poseen activos nativos equivalentes a los tokens envueltos emitidos, verificando la vinculación 1:1.","ar":"إثبات الاحتياطيات هو بيانات عامة على السلسلة أو أدلة تدقيق تُظهر أن الأمناء يحتفظون بأصول أصلية تعادل الرموز المغلَّفة المصدرة، للتحقق من حقيقة الارتباط بنسبة ١:١.","fr":"La preuve de réserves est une donnée publique on-chain ou une preuve d'audit montrant que les dépositaires détiennent des actifs natifs équivalents aux jetons enveloppés émis, vérifiant l'ancrage 1:1.","ru":"Доказательство резервов — это публичные ончейн-данные или аудиторские свидетельства, показывающие, что хранители владеют нативными активами, равными выпущенным обёрнутым токенам, что подтверждает реальность привязки 1:1 и позволяет пользователям проверять прозрачность эмиссии."}},{"id":61,"cat":"mechanism","q":{"en":"Do cross-chain bridges need audits?","zh":"跨链桥需要进行审计吗？","es":"¿Los puentes entre cadenas necesitan auditorías?","ar":"هل تحتاج الجسور بين السلاسل إلى تدقيق؟","fr":"Les ponts inter-chaînes nécessitent-ils des audits ?","ru":"Нужны ли аудиты межцепным мостам?"},"a":{"en":"Yes. Bridge contracts and custody processes involve users' funds, so independent audits should precede launch. This project is in exploration; audit plans will be announced as the roadmap advances.","zh":"需要。桥接合约与托管流程涉及用户资金安全，上线前应由独立机构审计；本项目处于探索阶段，具体审计安排将随路线推进另行公布。","es":"Sí. Los contratos del puente y la custodia involucran fondos de usuarios; las auditorías independientes deben preceder al lanzamiento. El proyecto está en exploración; los planes de auditoría se anunciarán con el avance de la hoja de ruta.","ar":"نعم، لأن عقود الجسر وعمليات الحراسة تشمل أموال المستخدمين، يجب أن يسبق الإطلاق تدقيق مستقل. المشروع في مرحلة الاستكشاف، وسيُعلن عن خطط التدقيق مع تقدم خارطة الطريق.","fr":"Oui. Les contrats de pont et la garde impliquent les fonds des utilisateurs ; des audits indépendants doivent précéder le lancement. Le projet est en exploration ; les plans d'audit seront annoncés avec l'avancée de la feuille de route.","ru":"Да. Контракты моста и процессы хранения касаются средств пользователей, поэтому независимый аудит должен предшествовать запуску. Проект на этапе исследований; планы аудита будут объявлены по мере продвижения дорожной карты."}},{"id":62,"cat":"mechanism","q":{"en":"Can bridge transactions fail or get stuck?","zh":"跨链桥接会失败或卡单吗？","es":"¿Las transferencias del puente pueden fallar o atascarse?","ar":"هل يمكن أن تفشل معاملات الجسر أو تعلق؟","fr":"Les transactions de pont peuvent-elles échouer ou rester bloquées ?","ru":"Могут ли транзакции моста сбоить или зависать?"},"a":{"en":"Yes. Congestion, delayed confirmations, or contract issues may stall a transaction until resolution through support or governance. All bridges carry this risk, so verify addresses and status carefully.","zh":"可能。网络拥堵、区块确认延迟或合约异常都可能导致交易卡住，需要等待确认或通过客服与治理流程处理；所有桥都有此类风险，请核对地址与状态。","es":"Sí. La congestión, los retrasos de confirmación o problemas del contrato pueden detener una transferencia hasta resolverse vía soporte o gobernanza. Todos los puentes tienen este riesgo; verifique direcciones y estados.","ar":"نعم، قد يتعطل التحويل بسبب الازدحام أو تأخر تأكيد الكتل أو خلل في العقود، حتى تُحل عبر الدعم أو الحوكمة. تحمل جميع الجسور هذا الخطر، لذا تحقق من العناوين والحالة بعناية.","fr":"Oui. La congestion, les retards de confirmation ou des problèmes de contrat peuvent bloquer une transaction jusqu'à résolution via le support ou la gouvernance. Tous les ponts comportent ce risque ; vérifiez adresses et statuts.","ru":"Да. Перегрузка сети, задержки подтверждения блоков или неполадки контракта могут застопорить транзакцию до разрешения через поддержку или управление. Все мосты несут такой риск — проверяйте адреса и статусы."}},{"id":63,"cat":"mechanism","q":{"en":"What is a wrapped token?","zh":"包装代币的定义是什么？","es":"¿Qué es un token envuelto?","ar":"ما هو الرمز المغلَّف؟","fr":"Qu'est-ce qu'un jeton enveloppé ?","ru":"Что такое обёрнутый токен?"},"a":{"en":"A wrapped token is a 1:1 claim on a native asset issued on another chain, such as doge-spl on Solana or Binance-Peg DOGE on BSC. It represents, not alters, the original asset.","zh":"包装代币是源链资产在目标链上的 1:1 对应凭证，如 doge-spl 或 Binance-Peg DOGE；它代表而非改变原始资产。","es":"Un token envuelto es un derecho 1:1 sobre un activo nativo emitido en otra cadena, como doge-spl en Solana o Binance-Peg DOGE en BSC. Representa, no modifica, el activo original.","ar":"الرمز المغلَّف هو حق بنسبة ١:١ على أصل أصلي يُصدر على سلسلة أخرى، مثل doge-spl على Solana وBinance-Peg DOGE على BSC؛ يمثل الأصل الأصلي ولا يغيّره.","fr":"Un jeton enveloppé est une créance 1:1 sur un actif natif émise sur une autre chaîne, comme doge-spl sur Solana ou Binance-Peg DOGE sur BSC. Il représente, sans le modifier, l'actif d'origine.","ru":"Обёрнутый токен — это право 1:1 на нативный актив, выпущенное на другой цепи, например doge-spl в Solana или Binance-Peg DOGE в BSC. Он представляет исходный актив, не изменяя его."}},{"id":64,"cat":"mechanism","q":{"en":"What is the relation between EACO and EAC?","zh":"EACO 与 EAC 是什么关系？","es":"¿Qué relación hay entre EACO y EAC?","ar":"ما العلاقة بين EACO وEAC؟","fr":"Quelle est la relation entre EACO et EAC ?","ru":"Как соотносятся EACO и EAC?"},"a":{"en":"EACO is a planned wrapped token backed by native Earthcoin (EAC) at a 1:1 or market-based rate via custody & wrap: custodians hold EAC and EACO is issued on the target chain. It is a roadmap proposal only, not yet issued.","zh":"EACO 是拟发行的包装代币，与地球币 EAC 原生币按 1:1 或随市场变化的比例对应，采用托管-包装：托管方持有 EAC，目标链发行 EACO。目前仅为路线方案，尚未发行。","es":"EACO es un token envuelto planeado a razón 1:1 o según el mercado, respaldado por Earthcoin (EAC) mediante custodia y envoltura: los custodios guardan EAC y EACO se emite en la cadena de destino. Es solo propuesta de la hoja de ruta, aún no emitido.","ar":"EACO رمز مغلَّف مخطط بنسبة ١:١ أو حسب السوق مدعوم بعملة Earthcoin (EAC) الأصلية عبر نموذج الحراسة والتغليف: يحتفظ الأمناء بـEAC ويُصدر EACO على السلسلة الهدف. إنه مجرد مقترح في خارطة الطريق ولم يُصدر بعد.","fr":"EACO est un jeton enveloppé prévu au taux de 1:1 ou selon le marché, adossé à Earthcoin (EAC) via la garde et l'empaquetage : des dépositaires détiennent EAC et EACO est émis sur la chaîne cible. Simple proposition de feuille de route, pas encore émis.","ru":"EACO — планируемый обёрнутый токен в соотношении 1:1 или по рыночному курсу, обеспеченный нативной Earthcoin (EAC), через кастодиальное хранение и обёртывание: хранители держат EAC, а EACO выпускается на целевой цепи. Это лишь предложение дорожной карты, пока не выпущено."}},{"id":65,"cat":"mechanism","q":{"en":"Can cross-chain tokens be redeemed anytime?","zh":"跨链代币能随时赎回吗？","es":"¿Los tokens entre cadenas se canjean en cualquier momento?","ar":"هل يمكن استرداد الرموز عبر السلاسل في أي وقت؟","fr":"Les jetons inter-chaînes peuvent-ils être rachetés à tout moment ?","ru":"Можно ли погасить межцепные токены в любое время?"},"a":{"en":"Redemption is designed to work by burning wrapped tokens and returning native assets, but actual timing depends on bridge operations, network confirmations, and custody flows. Final rules follow launch announcements.","zh":"设计上支持赎回：销毁包装代币并返还对应原生资产；但实际赎回受桥接运营状态、网络确认与托管流程影响，具体规则以上线后公告为准。","es":"El canje está diseñado para quemar tokens envueltos y devolver activos nativos, pero el tiempo real depende de la operación del puente, las confirmaciones y la custodia. Las reglas finales se anunciarán al lanzar.","ar":"صُمم الاسترداد بحرق الرموز المغلَّفة وإعادة الأصول الأصلية، لكن التوقيت الفعلي يعتمد على تشغيل الجسر وتأكيدات الشبكة وعمليات الحراسة؛ وتُعلن القواعد النهائية عند الإطلاق وفقًا للإعلانات الرسمية.","fr":"Le rachat est conçu pour brûler les jetons enveloppés et restituer les actifs natifs, mais le délai réel dépend du fonctionnement du pont, des confirmations et de la garde. Les règles finales suivront le lancement.","ru":"Погашение устроено так: обёрнутые токены сжигаются, а нативные активы возвращаются; но фактическое время зависит от работы моста, подтверждений сети и процессов хранения. Финальные правила появятся после запуска."}},{"id":66,"cat":"howto","q":{"en":"What should I do first?","zh":"我的第一步应该做什么？","es":"¿Qué debo hacer primero?","ar":"ما الخطوة الأولى التي يجب أن أفعلها؟","fr":"Que dois-je faire en premier ?","ru":"Что мне сделать в первую очередь?"},"a":{"en":"Read this site's roadmap and disclaimer first, understand the three cross-chain models and the current exploration stage, then protect your private keys. Do not rush to commit assets during exploration.","zh":"建议先阅读本站路线图与免责声明，理解三种跨链范式与当前探索阶段，再妥善保管私钥；探索阶段请勿急于投入资产。","es":"Lea primero la hoja de ruta y el aviso del sitio, comprenda los tres modelos y la etapa de exploración, y luego proteja sus claves privadas. No comprometa activos durante la exploración.","ar":"اقرأ أولًا خارطة الطريق وإخلاء المسؤولية في الموقع، وافهم النماذج الثلاثة للجسر عبر السلاسل ومرحلة الاستكشاف الحالية، ثم احمِ مفاتيحك الخاصة؛ لا تستعجل في إيداع الأصول خلال مرحلة الاستكشاف.","fr":"Lisez d'abord la feuille de route et l'avertissement du site, comprenez les trois modèles et l'étape d'exploration, puis protégez vos clés privées. Ne vous précipitez pas à engager des actifs en phase d'exploration.","ru":"Сначала прочитайте дорожную карту и предупреждение сайта, поймите три модели межцепных мостов и текущий этап исследований, затем защитите свои закрытые ключи. Не спешите вкладывать активы на этапе исследований."}},{"id":67,"cat":"howto","q":{"en":"How do I get EACO tokens?","zh":"如何获取 EACO 代币？","es":"¿Cómo obtengo tokens de EACO?","ar":"كيف أحصل على رموز EACO؟","fr":"Comment obtenir des jetons EACO ?","ru":"Как получить токены EACO?"},"a":{"en":"EACO (Earth) is a native Solana SPL token, contract DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH, viewable in SPL-compatible wallets. Verify acquisition channels yourself against official sources; this site does not list exchanges.","zh":"EACO（地球）是 Solana 原生 SPL 代币，合约地址 DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH；获取渠道请自行核实，本站不列出交易所。","es":"EACO es un token SPL nativo de Solana, contrato DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH, visible en carteras compatibles SPL. Verifique los canales de adquisición usted mismo; este sitio no lista exchanges.","ar":"EACO رمز SPL أصلي على Solana، عنوان العقد DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH، ويمكن عرضه في محافظ متوافقة مع SPL؛ تحقق من قنوات الحصول عليه بنفسك، ولا يوفر هذا الموقع قائمة بالمنصات.","fr":"EACO est un jeton SPL natif de Solana, contrat DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH, consultable dans les portefeuilles compatibles SPL. Vérifiez vous-même les canaux d'acquisition ; ce site ne liste pas d'exchanges.","ru":"EACO — нативный SPL-токен Solana, контракт DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH, просматриваемый в кошельках, совместимых с SPL. Каналы получения проверяйте самостоятельно по официальным источникам; этот сайт не публикует список бирж."}},{"id":68,"cat":"howto","q":{"en":"How do I get DOGE tokens?","zh":"如何获取 DOGE 代币？","es":"¿Cómo obtengo tokens de DOGE?","ar":"كيف أحصل على رموز DOGE؟","fr":"Comment obtenir des jetons DOGE ?","ru":"Как получить токены DOGE?"},"a":{"en":"DOGE is a Scrypt PoW coin launched in 2013, receivable and transferable in DOGE-compatible wallets. Verify purchase channels yourself; this site does not list exchanges.","zh":"DOGE 是 2013 年诞生的 Scrypt PoW 币，可在支持 DOGE 的钱包中接收与转账；具体购买渠道请自行核实，本站不提供交易所名单。","es":"DOGE es una moneda Scrypt PoW nacida en 2013, recibible y transferible en carteras compatibles. Verifique los canales de compra usted mismo; este sitio no lista exchanges.","ar":"DOGE عملة Scrypt PoW أُنشئت عام ٢٠١٣، ويمكن استقبالها وتحويلها في محافظ متوافقة؛ تحقق من قنوات الشراء بنفسك قبل أي عملية، ولا يوفر الموقع قائمة بالمنصات.","fr":"DOGE est une pièce Scrypt PoW née en 2013, recevable et transférable dans des portefeuilles compatibles. Vérifiez vous-même les canaux d'achat ; ce site ne liste pas d'exchanges.","ru":"DOGE — монета Scrypt PoW, выпущенная в 2013 году, её можно получать и переводить в совместимых кошельках. Каналы покупки проверяйте самостоятельно; сайт не публикует список бирж."}},{"id":69,"cat":"howto","q":{"en":"How do I get doge-spl tokens?","zh":"如何获取 doge-spl 代币？","es":"¿Cómo obtengo tokens de doge-spl?","ar":"كيف أحصل على رموز doge-spl؟","fr":"Comment obtenir des jetons doge-spl ?","ru":"Как получить токены doge-spl?"},"a":{"en":"doge-spl is the wrapped DOGE on Solana, contract DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R. Its acquisition follows the issuer; this site is in exploration and does not sell it. Verify details via official issuer sources.","zh":"doge-spl 是 Solana 上的 DOGE 包装代币，合约地址 DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R；获取方式以发行为准，本站不代售。","es":"doge-spl es el DOGE envuelto en Solana, contrato DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R. Su adquisición sigue al emisor; este sitio está en exploración y no lo vende. Verifique los detalles en fuentes oficiales del emisor.","ar":"doge-spl هو رمز DOGE المغلَّف على Solana، عنوان العقد DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R؛ طريقة الحصول عليه وفقًا للمُصدر، وهذا الموقع في مرحلة الاستكشاف ولا يبيع الرموز؛ تحقق من التفاصيل عبر المصادر الرسمية للمُصدر.","fr":"doge-spl est le DOGE enveloppé sur Solana, contrat DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R. Son acquisition suit l'émetteur ; ce site est en exploration et ne le vend pas. Vérifiez les détails auprès des sources officielles de l'émetteur.","ru":"doge-spl — обёрнутый DOGE в Solana, контракт DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R. Способ получения определяет эмитент; сайт находится на этапе исследований и не продаёт токены. Проверяйте детали в официальных источниках эмитента."}},{"id":70,"cat":"howto","q":{"en":"How do I get Binance-Peg DOGE?","zh":"如何获取 Binance-Peg DOGE？","es":"¿Cómo obtengo Binance-Peg DOGE?","ar":"كيف أحصل على Binance-Peg DOGE؟","fr":"Comment obtenir le Binance-Peg DOGE ?","ru":"Как получить Binance-Peg DOGE?"},"a":{"en":"Binance-Peg DOGE is wrapped DOGE on BSC, contract 0xbA2aE424D960c26247Dd6c32edC70B295c744C43. Acquisition follows its issuer; verify the contract address yourself and always double-check it before any transaction.","zh":"Binance-Peg DOGE 是 BSC 上的 DOGE 包装代币，合约地址 0xbA2aE424D960c26247Dd6c32edC70B295c744C43；获取以发行方为准，请先核实合约地址。","es":"Binance-Peg DOGE es DOGE envuelto en BSC, contrato 0xbA2aE424D960c26247Dd6c32edC70B295c744C43. Su adquisición sigue al emisor; verifique usted mismo la dirección del contrato y compruébela siempre antes de operar.","ar":"Binance-Peg DOGE هو رمز DOGE المغلَّف على BSC، عنوان العقد 0xbA2aE424D960c26247Dd6c32edC70B295c744C43؛ طريقة الحصول عليه وفقًا للمُصدر، وتحقق من عنوان العقد بنفسك وأعد التحقق دائمًا قبل أي عملية.","fr":"Binance-Peg DOGE est le DOGE enveloppé sur BSC, contrat 0xbA2aE424D960c26247Dd6c32edC70B295c744C43. Son acquisition suit l'émetteur ; vérifiez vous-même l'adresse du contrat et re-vérifiez-la avant toute opération.","ru":"Binance-Peg DOGE — обёрнутый DOGE в BSC, контракт 0xbA2aE424D960c26247Dd6c32edC70B295c744C43. Способ получения определяет эмитент; проверяйте адрес контракта самостоятельно и перепроверяйте его перед каждой операцией, сверяясь с официальными источниками эмитента."}},{"id":71,"cat":"howto","q":{"en":"How to move value between Solana and BSC?","zh":"如何在 Solana 与 BSC 间转移价值？","es":"¿Cómo mover valor entre Solana y BSC?","ar":"كيف أنقل القيمة بين Solana وBSC؟","fr":"Comment transférer de la valeur entre Solana et BSC ?","ru":"Как переносить ценность между Solana и BSC?"},"a":{"en":"Liquidity routing with stablecoins like USDT or USDC can transfer value between the two chains. The corresponding two-way liquidity track is Phase B of the roadmap and is not yet live.","zh":"可通过流动性路由，用 USDT 或 USDC 稳定币在两条链间转移价值；本项目对应的双向流动性轨道属于路线图 B 阶段，目前尚未上线。","es":"El enrutamiento de liquidez con stablecoins como USDT o USDC puede mover valor entre cadenas. La vía de liquidez bidireccional corresponde a la fase B de la hoja de ruta y aún no está activa.","ar":"يمكن نقل القيمة بين السلسلتين عبر توجيه السيولة بعملات مستقرة مثل USDT أو USDC؛ أما مسار السيولة ثنائي الاتجاه فهو من المرحلة B في خارطة الطريق ولم يُطلق بعد.","fr":"Le routage de liquidité avec des stablecoins comme USDT ou USDC peut transférer de la valeur entre les deux chaînes. La piste de liquidité bidirectionnelle relève de la phase B de la feuille de route et n'est pas encore active.","ru":"Маршрутизация ликвидности со стейблкоинами USDT или USDC позволяет переносить ценность между цепями. Двусторонний трек ликвидности относится к этапу B дорожной карты и пока не запущен."}},{"id":72,"cat":"howto","q":{"en":"How do I join the community or vote?","zh":"我如何参与社区或投票？","es":"¿Cómo participar en la comunidad o votar?","ar":"كيف أشارك في المجتمع أو التصويت؟","fr":"Comment rejoindre la communauté ou voter ?","ru":"Как участвовать в сообществе или голосовании?"},"a":{"en":"Governance belongs to Phase D of the roadmap, covering multi-chain expansion and governance. Participation details are undecided; follow official announcements and community updates for now.","zh":"治理属于路线图 D 阶段（多链扩展与治理）的安排，参与方式尚未确定；现阶段请关注官网公告与社区动态，以正式发布的信息为准。","es":"La gobernanza pertenece a la fase D (expansión multicadena y gobernanza). Los detalles de participación no están definidos; siga por ahora los anuncios oficiales y las novedades de la comunidad.","ar":"تنتمي الحوكمة إلى المرحلة D من خارطة الطريق (التوسع متعدد السلاسل والحوكمة)، ولم تُحدد طريقة المشاركة بعد؛ تابع الإعلانات الرسمية وأخبار المجتمع حاليًا، واعتمد على ما يُنشر رسميًا.","fr":"La gouvernance relève de la phase D de la feuille de route (expansion multi-chaînes et gouvernance). Les modalités de participation ne sont pas définies ; suivez les annonces officielles et les actualités communautaires.","ru":"Управление относится к этапу D дорожной карты (многоцепное расширение и управление). Способы участия ещё не определены; пока следите за официальными объявлениями и новостями сообщества до появления официальных инструкций."}},{"id":73,"cat":"howto","q":{"en":"How to track the roadmap progress?","zh":"如何查看跨链路线进展？","es":"¿Cómo seguir el avance de la hoja de ruta?","ar":"كيف أتابع تقدم خارطة الطريق؟","fr":"Comment suivre l'avancement de la feuille de route ?","ru":"Как отслеживать прогресс дорожной карты?"},"a":{"en":"The roadmap section lists Phases A to D: EACO(BEP20), two-way liquidity, EACO custody & wrap, and multi-chain governance. Status marks on the page are authoritative; check the official site.","zh":"本站路线图栏目列出 A 至 D 四阶段：EACO(BEP20)、双向流动性轨道、EACO 托管包装、多链扩展与治理；各阶段状态以页面实时标注为准。","es":"La sección de hoja de ruta lista las fases A a D: EACO(BEP20), liquidez bidireccional, custodia y envoltura de EACO, y gobernanza multicadena. Las marcas de estado en la página son la referencia.","ar":"يعرض قسم خارطة الطريق المراحل من A إلى D: EACO(BEP20) وسيولة ثنائية الاتجاه وحراسة وتغليف EACO والتوسع متعدد السلاسل والحوكمة؛ وتعد إشارات الحالة في الصفحة هي المرجع.","fr":"La section feuille de route liste les phases A à D : EACO(BEP20), liquidité bidirectionnelle, garde et empaquetage d'EACO, et gouvernance multi-chaînes. Les marques d'état de la page font foi.","ru":"Раздел дорожной карты перечисляет этапы A–D: EACO(BEP20), двусторонняя ликвидность, хранение и обёртывание EACO, многоцепное расширение и управление. Статусы на странице являются ориентиром; актуальные изменения публикуются на официальном сайте."}},{"id":74,"cat":"howto","q":{"en":"How to track DOGE prices across chains?","zh":"如何跟踪 DOGE 多链价格？","es":"¿Cómo seguir los precios de DOGE entre cadenas?","ar":"كيف أتابع أسعار DOGE عبر السلاسل؟","fr":"Comment suivre les prix de DOGE entre chaînes ?","ru":"Как отслеживать цены DOGE на разных цепях?"},"a":{"en":"Query prices separately for native DOGE, doge-spl, and Binance-Peg DOGE through their respective market channels. This site provides no price data; please verify via third-party market sites.","zh":"请分别查询 DOGE 原生链、doge-spl、Binance-Peg DOGE 的行情；本站不提供价格数据，请通过第三方行情站点自行核实。","es":"Consulte los precios por separado de DOGE nativo, doge-spl y Binance-Peg DOGE en sus canales de mercado. Este sitio no ofrece datos de precios; verifique en sitios de terceros.","ar":"استعلم عن أسعار DOGE الأصلية وdoge-spl وBinance-Peg DOGE كلًا على حدة عبر قنوات السوق الخاصة بها؛ لا يوفر هذا الموقع بيانات الأسعار، لذا تحقق من مواقع السوق الخارجية بنفسك.","fr":"Consultez séparément les prix du DOGE natif, de doge-spl et de Binance-Peg DOGE via leurs canaux de marché respectifs. Ce site ne fournit pas de données de prix ; vérifiez sur des sites tiers.","ru":"Проверяйте цены нативного DOGE, doge-spl и Binance-Peg DOGE отдельно через их рыночные каналы. Сайт не предоставляет данных о ценах — проверяйте и сверяйте их самостоятельно на сторонних сайтах."}},{"id":75,"cat":"howto","q":{"en":"How to store private keys safely?","zh":"如何安全地存储私钥？","es":"¿Cómo guardar las claves privadas de forma segura?","ar":"كيف أخزن مفاتيحي الخاصة بأمان؟","fr":"Comment stocker ses clés privées en sécurité ?","ru":"Как безопасно хранить закрытые ключи?"},"a":{"en":"Keep private keys and seed phrases offline; never store them on connected devices, screenshots, or chats. Use fireproof and waterproof paper backups. Anyone asking for your keys is likely a scam.","zh":"私钥与助记词应离线保存，不要存入联网设备、截图或聊天记录；纸质备份需防火防潮；任何索要私钥的请求都可能是诈骗。","es":"Guarde claves y frases semilla fuera de línea; nunca en dispositivos conectados, capturas o chats. Use respaldos en papel a prueba de fuego y agua. Quien pida sus claves probablemente sea fraude.","ar":"احفظ مفاتيحك الخاصة وعبارة الاسترداد دون اتصال بالإنترنت؛ ولا تخزنها في أجهزة متصلة أو لقطات شاشة أو محادثات. استخدم نسخًا ورقية مقاومة للحريق والماء؛ وأي طلب للمفاتيح الخاصة قد يكون احتيالًا.","fr":"Conservez vos clés privées et phrases de récupération hors ligne ; jamais sur des appareils connectés, captures d'écran ou chats. Utilisez des sauvegardes papier ignifuges et étanches. Quiconque demande vos clés est probablement un fraudeur.","ru":"Храните закрытые ключи и сид-фразы офлайн; не сохраняйте их на подключённых устройствах, в скриншотах или чатах. Бумажные резервные копии защищайте от огня и влаги. Любая просьба передать ключи — вероятное мошенничество."}},{"id":76,"cat":"security","q":{"en":"What is the biggest risk in cross-chain?","zh":"跨链最大的风险是什么","es":"¿Cuál es el mayor riesgo al cruzar cadenas?","ar":"ما هو أكبر خطر في النقل بين السلاسل؟","fr":"Quel est le plus grand risque du pont inter-chaînes ?","ru":"Какой самый большой риск при кроссчейн-переводах?"},"a":{"en":"The biggest risks are smart-contract bugs and custodians misusing funds. Mitigate with professional audits, multisig and reserve proofs, and always test small amounts before larger transfers.","zh":"跨链最大的风险是智能合约漏洞与托管方挪用资金；应对需依靠专业审计、多签与储备证明，并先小额测试再放大金额。","es":"Los mayores riesgos son fallos de contratos inteligentes y mal uso de fondos por el custodio. Mitigue con auditorías, multisig y pruebas de reservas, y pruebe primero montos pequeños.","ar":"أكبر المخاطر هي ثغرات العقود الذكية وسوء استخدام الوصي للأموال؛ خفّفها عبر التدقيق المهني والتوقيع المتعدد وإثبات الاحتياطيات، واختبر بمبالغ صغيرة قبل التحويلات الكبيرة.","fr":"Les plus grands risques sont les failles des contrats intelligents et le détournement de fonds par le dépositaire. Atténuez-les par des audits, la multisig et des preuves de réserves, en testant d'abord de petits montants.","ru":"Самые большие риски — уязвимости смарт-контрактов и недобросовестный кастодиан. Снижайте их профессиональными аудитами, мультиподписью и доказательствами резервов, начиная с малых сумм."}},{"id":77,"cat":"security","q":{"en":"How to spot fake or same-name tokens?","zh":"如何识别假币或同名币","es":"¿Cómo detectar tokens falsos u homónimos?","ar":"كيف تكتشف الرموز المزيفة أو المتشابهة في الاسم؟","fr":"Comment repérer les jetons frauduleux ou homonymes ?","ru":"Как распознать поддельные или одноимённые токены?"},"a":{"en":"Verify the contract address and symbol character by character only via official channels; EACO's address is DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. For same-name coins like EAC, always rely on the address and label them clearly.","zh":"仅通过官方渠道核对符号与合约地址；EACO 地址为 DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH。同名币一律以地址为准并加注区分。","es":"Compruebe carácter a carácter la dirección y el símbolo solo en canales oficiales; la dirección de EACO es DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Para monedas homónimas como EAC, guíese por la dirección y etiquete con claridad.","ar":"تحقق من عنوان العقد ورمزه حرفاً بحرف عبر القنوات الرسمية فقط؛ عنوان EACO هو DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. وبالنسبة للعملات المتشابهة بالاسم مثل EAC، اعتمد على العنوان مع إضافة تمييز واضح.","fr":"Vérifiez caractère par caractère l'adresse et le symbole uniquement via les canaux officiels ; l'adresse d'EACO est DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Pour les homonymes comme EAC, fiez-vous à l'adresse et étiquetez clairement.","ru":"Сверяйте адрес контракта и символ посимвольно только через официальные каналы; адрес EACO — DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Для одноимённых монет (например, EAC) ориентируйтесь на адрес и явно помечайте их."}},{"id":78,"cat":"security","q":{"en":"Why does a contract audit matter?","zh":"合约审计为什么重要","es":"¿Por qué es importante la auditoría de contratos?","ar":"لماذا يعتبر تدقيق العقود مهماً؟","fr":"Pourquoi l'audit de contrat est-il important ?","ru":"Почему важен аудит контракта?"},"a":{"en":"Audits have independent experts review code logic and hidden flaws before deployment, reducing the risk of stolen or broken funds. For cross-chain designs holding custody or wrapped assets, audits and multisig are the baseline; be extra cautious without them.","zh":"审计由独立机构审查代码逻辑与潜在漏洞，能在部署前发现缺陷，降低资金被盗与失效的风险；对涉及托管与包装资产的跨链方案，审计与多签是基础安全防线，缺失时应高度谨慎。","es":"Las auditorías hacen que expertos independientes revisen la lógica y las fallas antes del despliegue, reduciendo el riesgo de pérdida de fondos. Para custodias y activos envueltos, auditoría y multisig son la base; extremo la prudencia si faltan.","ar":"يقوم التدقيق بمراجعة منطق الكود والثغرات بواسطة خبراء مستقلين قبل النشر، مما يقلل خطر فقدان الأموال؛ وبالنسبة لحلول الحراسة والأصول المغلفة عبر السلاسل، يعد التدقيق والتوقيع المتعدد خط الدفاع الأساسي، فكن حذراً للغاية عند غيابهما.","fr":"L'audit fait examiner la logique et les failles par des experts indépendants avant le déploiement, réduisant le risque de perte de fonds. Pour la garde et les actifs enveloppés, audit et multisig sont la base ; redoublez de prudence s'ils manquent.","ru":"Аудит — независимая проверка логики кода и скрытых дефектов до развёртывания, снижающая риск потери средств. Для решений с кастодиальным хранением и обёрнутыми активами аудит и мультиподпись — базовая защита; без них нужна особая осторожность."}},{"id":79,"cat":"security","q":{"en":"What if the custodian runs away?","zh":"托管方若跑路我该怎么办","es":"¿Y si el custodio desaparece?","ar":"ماذا أفعل إذا هرب الوصي؟","fr":"Que faire si le dépositaire disparaît ?","ru":"Что делать, если кастодиан исчез?"},"a":{"en":"Prevention works best: choose audited multisig custody and demand periodic reserve proofs. If anything looks wrong, stop immediately, keep transaction evidence, verify via official community channels, and never add more funds.","zh":"事前防范最有效：优先选择经审计、采用多签托管的方案，并要求定期储备证明；一旦发现异常，立即停止操作、保存交易证据并向官方社群求证，切勿继续追加资金。","es":"La prevención es clave: elija custodia auditada con multisig y exija pruebas periódicas de reservas. Ante cualquier anomalía, deténgase, conserve las pruebas, consulte los canales oficiales y no agregue más fondos.","ar":"الوقاية أفضل علاج: اختر حراسة مدققة بالتوقيع المتعدد واطلب إثباتات احتياطيات دورية؛ عند أي شذوذ، توقف فوراً واحتفظ بالأدلة وتأكد عبر القنوات الرسمية ولا تضيف مزيداً من الأموال.","fr":"La prévention est la clé : choisissez une garde audited avec multisig et exigez des preuves de réserves régulières. En cas d'anomalie, arrêtez-vous, conservez les preuves, vérifiez via les canaux officiels et n'ajoutez plus de fonds.","ru":"Лучшая защита — профилактика: выбирайте аудированное хранение с мультиподписью и требуйте регулярные доказательства резервов. При любой аномалии немедленно остановитесь, сохраните доказательства, проверьте через официальные каналы и не вносите больше средств."}},{"id":80,"cat":"security","q":{"en":"What is slippage and its impact?","zh":"什么是滑点，有何影响","es":"¿Qué es el deslizamiento y su impacto?","ar":"ما هو الانزلاق السعري وما تأثيره؟","fr":"Qu'est-ce que le slippage et son impact ?","ru":"Что такое проскальзывание и как оно влияет?"},"a":{"en":"Slippage is the gap between the price you confirm and the price you actually get. Shallow liquidity makes it worse, so check estimated slippage before swapping, and split orders or choose deeper pools when needed.","zh":"滑点是你确认价格与实际成交价格的差额；流动性深度不足时滑点会明显变大，兑换前应查看预估滑点，必要时拆分订单或选择流动性更深的池子。","es":"El deslizamiento es la diferencia entre el precio confirmado y el ejecutado. La liquidez escasa lo agrava; revise el deslizamiento estimado antes de intercambiar y divida órdenes o elija pools con mayor liquidez si hace falta.","ar":"الانزلاق السعري هو الفرق بين السعر الذي تؤكده والسعر الذي تنفَّذ به الصفقة؛ نقص السيولة يزيده بشكل ملحوظ، لذا افحص الانزلاق المتوقع قبل التحويل واقسّم الطلبات أو اختر مجمعات أعمق عند الحاجة.","fr":"Le slippage est l'écart entre le prix confirmé et le prix d'exécution. Une liquidité faible l'aggrave : vérifiez le slippage estimé avant l'échange, et fractionnez les ordres ou choisissez des pools plus profonds si nécessaire.","ru":"Проскальзывание — разница между ценой, которую вы подтвердили, и ценой исполнения. При неглубокой ликвидности оно растёт: проверяйте оценку проскальзывания перед обменом, делите ордера или выбирайте пулы с большей глубиной."}},{"id":81,"cat":"security","q":{"en":"How to avoid phishing websites?","zh":"如何防止钓鱼与仿冒网站","es":"¿Cómo evitar sitios de phishing?","ar":"كيف تتجنب مواقع التصيد الاحتيالي؟","fr":"Comment éviter les sites de phishing ?","ru":"Как избежать фишинговых сайтов?"},"a":{"en":"Enter only via official websites or docs, typing the domain yourself and double-checking it. Never click links from strangers or enter private keys and sign approvals on unofficial pages; report fakes immediately.","zh":"从官方网站或文档进入，亲自输入域名并仔细核对；不点击陌生人发来的链接，绝不在非官方页面输入私钥或签署授权，发现仿冒页面立即举报并提醒他人。","es":"Entre solo por sitios o documentos oficiales, escribiendo el dominio usted mismo y verificándolo. No haga clic en enlaces de desconocidos ni ingrese claves o firme aprobaciones en páginas no oficiales; denuncie los fraudes.","ar":"ادخل فقط عبر المواقع أو الوثائق الرسمية مع كتابة النطاق بنفسك والتحقق منه؛ لا تنقر روابط الغرباء ولا تدخل مفاتيحك الخاصة أو توقّع موافقات في صفحات غير رسمية، وأبلغ عن المواقع المزيفة فوراً.","fr":"N'entrez que via les sites et documents officiels, en tapant vous-même le domaine et en le vérifiant. Ne cliquez pas les liens de personnes inconnues et ne saisissez jamais vos clés ni ne signez d'approbations sur des pages non officielles ; signalez les fraudes.","ru":"Заходите только через официальные сайты или документацию, вводя домен вручную и проверяя его. Не переходите по чужим ссылкам, не вводите ключи и не подписывайте одобрения на неофициальных страницах; сообщайте о подделках."}},{"id":82,"cat":"security","q":{"en":"How to keep private keys and seed phrases safe?","zh":"私钥与助记词安全要点","es":"¿Cómo proteger la clave privada y la frase semilla?","ar":"ما هي نقاط أمان المفتاح الخاص وعبارة الاسترداد؟","fr":"Comment sécuriser clé privée et phrase de récupération ?","ru":"Как безопасно хранить закрытый ключ и сид-фразу?"},"a":{"en":"Private keys and seed phrases are the sole proof of ownership—leaking them means losing control. Never screenshot, photograph, cloud-store or tell anyone; prefer an offline hardware wallet with backups in a safe place.","zh":"私钥与助记词是资产的唯一凭证，泄露即等于失去控制权；切勿截图、拍照、存入云端或告诉任何人，建议使用离线硬件钱包单独保管并备份在安全位置。","es":"La clave privada y la frase semilla son la única prueba de propiedad; divulgarlas equivale a perder el control. No las capture, fotografíe, suba a la nube ni comparta; prefiera una cartera de hardware offline con copias seguras.","ar":"المفتاح الخاص وعبارة الاسترداد هما الدليل الوحيد على الملكية، وتسريبهما يعني فقدان السيطرة؛ لا تلتقط لهما صوراً ولا تحفظهما في السحابة ولا تخبر أحداً، واستخدم محفظة أجهزة غير متصلة بالإنترنت مع نسخة احتياطية في مكان آمن.","fr":"La clé privée et la phrase de récupération sont l'unique preuve de propriété ; les divulguer, c'est perdre le contrôle. Ne les photographiez jamais, ne les stockez pas en ligne et ne les partagez pas ; préférez un portefeuille matériel hors ligne avec sauvegarde sûre.","ru":"Закрытый ключ и сид-фраза — единственное доказательство владения; их утечка означает потерю контроля. Не фотографируйте, не храните в облаке и никому не сообщайте; используйте офлайн-аппаратный кошелёк с резервной копией в безопасном месте."}},{"id":83,"cat":"security","q":{"en":"What are approval (permission) risks?","zh":"授权风险是什么，如何防范","es":"¿Qué son los riesgos de las aprobaciones?","ar":"ما هو خطر الموافقات (الأذونات)؟","fr":"Quels sont les risques des approbations ?","ru":"В чём заключаются риски одобрений (permission)?"},"a":{"en":"Approvals let a contract move your tokens; a malicious or compromised contract can drain them. Approve only trusted contracts, revoke after use, and review your approval list regularly to minimise exposure.","zh":"授权会给予合约动用你代币的权限，恶意或失陷合约可借此转走资产；应只对可信合约授权、用后及时取消，并定期检查钱包授权清单，最小化暴露面。","es":"Las aprobaciones permiten a un contrato mover tus tokens; un contrato malicioso puede vaciarlos. Apruebe solo contratos confiables, revoque tras usarlos y revise periódicamente su lista de aprobaciones para minimizar la exposición.","ar":"الموافقات تمنح العقد صلاحية تحويل رموزك؛ ويمكن لعقد ضار أو مخترق استنزاف أصولك. وافق فقط على العقود الموثوقة وألغِ الموافقة بعد الاستخدام وراجع قائمة الموافقات بانتظام لتقليل التعرض للمخاطر.","fr":"Les approbations donnent à un contrat le pouvoir de déplacer vos jetons ; un contrat malveillant peut les vider. N'approuvez que des contrats dignes de confiance, révoquez après usage et vérifiez régulièrement votre liste d'approbations.","ru":"Одобрения дают контракту право перемещать ваши токены; вредоносный или взломанный контракт может их вывести. Одобряйте только доверенные контракты, отзывайте разрешения после использования и регулярно проверяйте их список."}},{"id":84,"cat":"security","q":{"en":"How to get help when a cross-chain transfer fails?","zh":"遇到跨链失败如何求助","es":"¿Cómo pedir ayuda si falla un puente?","ar":"كيف تطلب المساعدة عند فشل النقل بين السلاسل؟","fr":"Que faire si un transfert inter-chaînes échoue ?","ru":"Куда обратиться, если кроссчейн-перевод не прошёл?"},"a":{"en":"First check the transaction hash, on-chain status and destination address, keeping your records. Then ask in official community and support channels; beware of DMs posing as support or asking for 'fees'.","zh":"先核对交易哈希与链上状态，确认目标地址无误并保存好转账记录；再通过项目官方社群与支持渠道求助；警惕主动私聊冒充客服或索要“手续费”的账号。","es":"Revise primero el hash, el estado en cadena y la dirección de destino, conservando sus registros. Luego solicite ayuda en los canales oficiales; desconfíe de mensajes privados que se hagan pasar por soporte o pidan 'comisiones'.","ar":"تحقق أولاً من تجزئة المعاملة وحالتها على السلسلة وصحة العنوان الوجهة مع حفظ سجلات التحويل، ثم اطلب المساعدة من القنوات الرسمية؛ واحذر الرسائل الخاصة التي تدّعي أنها دعم أو تطلب «رسوماً».","fr":"Vérifiez d'abord le hash, l'état on-chain et l'adresse de destination, en gardant vos relevés. Demandez ensuite de l'aide dans les canaux officiels ; méfiez-vous des messages privés imitant le support ou réclamant des « frais ».","ru":"Сначала проверьте хэш транзакции, статус в сети и адрес получателя, сохранив записи перевода. Затем обратитесь за помощью в официальные сообщество и поддержку; остерегайтесь личных сообщений от «поддержки», требующих «комиссию»."}},{"id":85,"cat":"security","q":{"en":"Why is 'not investment advice' repeated so often?","zh":"为什么“不是投资建议”要反复强调","es":"¿Por qué se insiste en 'no es asesoría financiera'?","ar":"لماذا يتكرر «ليست نصيحة استثمارية» بشكل مستمر؟","fr":"Pourquoi répéter « pas un conseil en investissement » ?","ru":"Почему так часто повторяют «это не инвестиционная рекомендация»?"},"a":{"en":"Digital assets are volatile and risky, and rules differ by country; this content is research only, not investment advice. Repeating it reminds users to verify addresses and project status themselves and consult professionals when needed.","zh":"数字资产波动大、风险高，各国监管口径不一，本内容仅为研究探索而非投资建议；反复声明意在提醒用户自行核实合约地址与项目状态，必要时咨询专业人士。","es":"Los activos digitales son volátiles y riesgosos, y las reglas varían por país; este contenido es solo investigación, no asesoría. Repetirlo recuerda verificar direcciones y estado del proyecto, y consultar a profesionales si es necesario.","ar":"الأصول الرقمية شديدة التقلب وعالية المخاطر وتختلف قواعدها بين الدول؛ هذا المحتوى دراسة استكشافية وليس نصيحة استثمارية، والتكرار يذكّر المستخدم بالتحقق بنفسه من عناوين العقود وحالة المشروع واستشارة المختصين عند الحاجة.","fr":"Les actifs numériques sont volatils et risqués, et les règles varient selon les pays ; ce contenu est une recherche, pas un conseil en investissement. Le répéter rappelle de vérifier soi-même adresses et statut du projet, et de consulter des professionnels.","ru":"Цифровые активы волатильны и рискованны, правила различаются по странам; этот контент — лишь исследование, а не инвестиционная рекомендация. Повторение напоминает: проверяйте адреса и статус проекта самостоятельно и консультируйтесь со специалистами."}},{"id":86,"cat":"earthcoin","q":{"en":"What is Earthcoin (EAC)?","zh":"Earthcoin（EAC）是什么","es":"¿Qué es Earthcoin (EAC)?","ar":"ما هو إيرثكوين (EAC)؟","fr":"Qu'est-ce qu'Earthcoin (EAC) ?","ru":"Что такое Earthcoin (EAC)?"},"a":{"en":"Earthcoin (EAC) is a Scrypt PoW UTXO chain launched in 2013, with blocks around every 60 seconds and no smart contracts; its public source is GitHub Sandokaaan/Earthcoin v2.1.4.","zh":"Earthcoin（EAC，中文「地球币」）是 2013 年的 Scrypt PoW UTXO 链，60 秒出块且无智能合约；源码见 GitHub Sandokaaan/Earthcoin v2.1.4。","es":"Earthcoin (EAC) es una cadena UTXO de Scrypt PoW nacida en 2013, con bloques cada 60 segundos aproximadamente y sin contratos inteligentes; su código público está en GitHub Sandokaaan/Earthcoin v2.1.4.","ar":"إيرثكوين (EAC) سلسلة UTXO بتعدين Scrypt أُطلقت عام ٢٠١٣، بمتوسط كتلة كل ٦٠ ثانية وبدون عقود ذكية؛ المصدر العام على GitHub Sandokaaan/Earthcoin v٢٫١٫٤.","fr":"Earthcoin (EAC) est une chaîne UTXO en Scrypt PoW lancée en 2013, avec un bloc toutes les 60 secondes environ et sans smart contracts ; son code public figure sur GitHub Sandokaaan/Earthcoin v2.1.4.","ru":"Earthcoin (EAC) — цепочка UTXO на Scrypt PoW, запущенная в 2013 году, с блоком примерно каждые 60 секунд и без смарт-контрактов; исходный код: GitHub Sandokaaan/Earthcoin v2.1.4."}},{"id":87,"cat":"earthcoin","q":{"en":"What is the difference between EAC and EACO?","zh":"EAC 与 EACO 的区别","es":"¿Cuál es la diferencia entre EAC y EACO?","ar":"ما الفرق بين EAC وEACO؟","fr":"Quelle est la différence entre EAC et EACO ?","ru":"В чём разница между EAC и EACO?"},"a":{"en":"EAC (Earthcoin) is a Scrypt PoW chain from 2013; EACO is a Solana-native SPL token (address per official disclosures). They are distinct projects—always verify addresses and label them clearly.","zh":"EAC（地球币）是 2013 年 Scrypt PoW 链；EACO（地球）是 Solana 原生 SPL 代币，地址见官方披露。两者是不同项目，交互时务必核对地址并加注区分。","es":"EAC (Earthcoin) es una cadena Scrypt PoW de 2013; EACO es un token SPL nativo de Solana (dirección según divulgaciones oficiales). Son proyectos distintos: verifique siempre las direcciones y etiquete con claridad.","ar":"EAC (إيرثكوين) سلسلة Scrypt PoW من عام ٢٠١٣؛ بينما EACO رمز SPL أصلي على سولانا (العنوان وفق الإفصاحات الرسمية). المشروعان مختلفان؛ تحقق دائماً من العنوان وأضف تمييزاً واضحاً.","fr":"EAC (Earthcoin) est une chaîne Scrypt PoW de 2013 ; EACO est un jeton SPL natif de Solana (adresse selon les disclosures officiels). Ce sont des projets distincts : vérifiez toujours les adresses et étiquetez clairement.","ru":"EAC (Earthcoin) — цепочка Scrypt PoW 2013 года; EACO — нативный SPL-токен Solana (адрес — по официальным раскрытиям). Это разные проекты: всегда сверяйте адреса и явно их помечайте."}},{"id":88,"cat":"earthcoin","q":{"en":"What is EAC's consensus and block time?","zh":"EAC 的共识机制与出块","es":"¿Cuál es el consenso y tiempo de bloque de EAC?","ar":"ما آلية الإجماع وزمن توليد الكتلة لـ EAC؟","fr":"Consensus et temps de bloc d'EAC ?","ru":"Что такое консенсус EAC и время блока?"},"a":{"en":"EAC uses Scrypt proof-of-work, producing a block every 60 seconds on average; as a classic UTXO chain it has no smart contracts, so on-chain functions center on transfers.","zh":"EAC 采用 Scrypt 工作量证明（PoW）共识，平均 60 秒出一个块；作为传统 UTXO 链，它没有智能合约，链上功能以转账为主，设计相对简单。","es":"EAC usa prueba de trabajo Scrypt, con un bloque cada 60 segundos de media; como cadena UTXO clásica no tiene contratos inteligentes y su función principal son las transferencias.","ar":"تعتمد EAC على إثبات العمل Scrypt بمتوسط كتلة كل ٦٠ ثانية؛ وباعتبارها سلسلة UTXO تقليدية بلا عقود ذكية، تقتصر وظائفها الرئيسية على التحويلات.","fr":"EAC utilise la preuve de travail Scrypt, avec un bloc toutes les 60 secondes en moyenne ; chaîne UTXO classique sans smart contracts, elle sert essentiellement aux transferts.","ru":"EAC использует Scrypt proof-of-work, блок генерируется в среднем каждые 60 секунд; как классическая UTXO-цепь без смарт-контрактов её функции в основном сводятся к переводам."}},{"id":89,"cat":"earthcoin","q":{"en":"What is the EACO wrapped token?","zh":"什么是 EACO 包装代币","es":"¿Qué es el token envuelto EACO?","ar":"ما هو رمز التغليف EACO؟","fr":"Qu'est-ce que le jeton enveloppé EACO ?","ru":"Что такое обёрнутый токен EACO?"},"a":{"en":"EACO is a proposed wrapped token at a 1:1 or market-based rate representing EAC across chains; it is still in the research and planning stage, and issuance timing and rules depend on official announcements.","zh":"EACO 是拟按 1:1 或随市场变化比例发行的 EAC 包装代币，用于承载 EAC 在其他链上的跨链形态；目前仍处于研究规划阶段，发行时间与规则以官方公告为准。","es":"EACO es un token envuelto propuesto en proporción 1:1 o según el mercado para representar a EAC entre cadenas; aún está en fase de investigación y planificación, y fechas y reglas dependen de anuncios oficiales.","ar":"EACO رمز مغلف مُقترح بنسبة ١:١ أو حسب السوق لتمثيل EAC عبر السلاسل؛ لا يزال في مرحلة الدراسة والتخطيط، وموعد الإصدار وقواعده وفق الإعلانات الرسمية.","fr":"EACO est un jeton enveloppé proposé à un taux de 1:1 ou selon le marché pour représenter EAC d'une chaîne à l'autre ; encore à l'étude, son émission et ses règles dépendent des annonces officielles.","ru":"EACO — предлагаемый обёрнутый токен в соотношении 1:1 или по рыночному курсу, представляющий EAC на других цепочках; пока это стадия исследований и планирования, сроки и правила выпуска определит официальный анонс."}},{"id":90,"cat":"earthcoin","q":{"en":"How does EACO guarantee the 1:1 or market-based exchange rate?","zh":"EACO 如何保证 1:1 或随市场变化的兑换比例","es":"¿Cómo garantiza EACO la proporción 1:1 o según el mercado?","ar":"كيف تضمن EACO نسبة ١:١ أو حسب السوق؟","fr":"Comment EACO garantit-il un taux de 1:1 ou selon le marché ?","ru":"Как EACO обеспечивает курс 1:1 или рыночный курс?"},"a":{"en":"Through auditable custody and reserve proofs: a custodian holds the original EAC and publishes audits and reserve counts regularly, keeping circulating EACO backed at a 1:1 or market-based rate. Users should keep verifying the disclosures.","zh":"通过可审计托管与储备证明实现：由受托方保管原始 EAC，定期公布审计与储备数量，使流通中的 EACO 始终与储备保持 1:1 或随市场变化对应；用户应持续核验披露的真实性。","es":"Mediante custodia auditable y pruebas de reservas: un custodio guarda el EAC original y publica auditorías y saldos, manteniendo la reserva de EACO en proporción 1:1 o según el mercado. Los usuarios deben verificar las divulgaciones.","ar":"عبر حراسة قابلة للتدقيق وإثباتات احتياطي: يحتفظ الوصي بـ EAC الأصلية وينشر التدقيق وأعداد الاحتياطي دورياً، بحيث يبقى احتياطي EACO المتداول بنسبة ١:١ أو حسب السوق؛ ويجب على المستخدمين مواصلة التحقق من الإفصاحات.","fr":"Par une garde auditable et des preuves de réserves : un dépositaire détient l'EAC d'origine et publie audits et soldes, maintenant l'EACO en circulation adossé au taux de 1:1 ou selon le marché. Les utilisateurs doivent vérifier ces divulgations.","ru":"За счёт проверяемого хранения и доказательств резервов: кастодиан держит оригинальный EAC и регулярно публикует аудит и объём резерва, обеспечивая обеспеченность EACO в соотношении 1:1 или по рыночному курсу. Пользователям следует проверять раскрытия."}},{"id":91,"cat":"earthcoin","q":{"en":"What is EAC's status and code source?","zh":"EAC 的现状与代码来源","es":"¿Cuál es el estado y origen de EAC?","ar":"ما وضع EAC ومصدره؟","fr":"Statut et source d'EAC ?","ru":"Текущее состояние и происхождение EAC?"},"a":{"en":"EAC is an early 2013 coin with public source at GitHub Sandokaaan/Earthcoin v2.1.4; its current activity, hash rate and maintenance should be verified on-chain yourself—this content guarantees nothing.","zh":"EAC 是 2013 年早期币种，源码见 GitHub Sandokaaan/Earthcoin v2.1.4；当前活跃度与状态需自行链上核实，本内容不作保证。","es":"EAC es una moneda temprana de 2013 con código público en GitHub Sandokaaan/Earthcoin v2.1.4; su actividad, hashrate y mantenimiento actuales deben verificarse en cadena; nada garantizamos aquí.","ar":"EAC عملة مبكرة من عام ٢٠١٣، ومصدرها العام على GitHub Sandokaaan/Earthcoin v٢٫١٫٤؛ أما نشاطها الحالي ومعدل التعدين وحالة الصيانة فتأكد منها بنفسك عبر بيانات السلسلة، وهذا المحتوى لا يقدم ضمانات.","fr":"EAC est une monnaie ancienne de 2013, dont le code public est sur GitHub Sandokaaan/Earthcoin v2.1.4 ; son activité, son hashrate et sa maintenance actuels sont à vérifier sur la chaîne, sans aucune garantie ici.","ru":"EAC — ранняя монета 2013 года; открытый исходный код: GitHub Sandokaaan/Earthcoin v2.1.4. Текущую активность, хешрейт и сопровождение проверяйте по данным сети самостоятельно; этот контент ничего не гарантирует."}},{"id":92,"cat":"earthcoin","q":{"en":"What does a UTXO chain without smart contracts mean?","zh":"UTXO 链没有智能合约意味着什么","es":"¿Qué implica una cadena UTXO sin contratos inteligentes?","ar":"ماذا يعني أن سلسلة UTXO بلا عقود ذكية؟","fr":"Que signifie l'absence de smart contracts sur une chaîne UTXO ?","ru":"Что значит отсутствие смарт-контрактов на UTXO-цепи?"},"a":{"en":"It means no decentralized apps like swaps, lending or bridges can run natively on-chain; for EAC to go cross-chain, external solutions such as custody or the wrapped EACO token are required.","zh":"意味着链上无法原生运行兑换、借贷或跨链桥等去中心化应用；要让 EAC 实现跨链，只能借助托管方保管或发行包装代币 EACO 等外部方案来实现。","es":"Significa que no pueden ejecutarse aplicaciones descentralizadas nativas como intercambios, préstamos o puentes; para cruzar cadenas, EAC requiere soluciones externas como custodia o el token envuelto EACO.","ar":"يعني أن التطبيقات اللامركزية مثل التبادل والإقراض والجسور لا يمكن تنفيذها أصلاً على السلسلة؛ ولنقل EAC بين السلاسل، يلزم حلول خارجية كالحراسة أو رمز التغليف EACO.","fr":"Cela signifie qu'aucune application décentralisée native (échanges, prêts, ponts) ne peut fonctionner sur la chaîne ; pour traverser les chaînes, EAC exige des solutions externes comme la garde ou le jeton enveloppé EACO.","ru":"Это значит, что децентрализованные приложения (обмены, кредитование, мосты) не могут нативно работать на такой цепочке; для кроссчейна EAC нужны внешние решения — кастодиальное хранение или обёрнутый токен EACO."}},{"id":93,"cat":"earthcoin","q":{"en":"Why must EAC be wrapped before bridging?","zh":"为什么 EAC 跨链需要先包装","es":"¿Por qué EAC debe envolverse antes de cruzar cadenas?","ar":"لماذا يجب تغليف EAC قبل النقل بين السلاسل؟","fr":"Pourquoi EAC doit-il être enveloppé avant le pont ?","ru":"Почему EAC нужно оборачивать перед кроссчейном?"},"a":{"en":"EAC has no smart contracts, so target-chain protocols cannot recognise, lock or custody it directly; wrapping it into EACO at a 1:1 or market-based rate, with a custodian holding the original, enables safe cross-chain use.","zh":"EAC 没有智能合约，目标链的协议无法直接识别、锁定并托管它；需要先按 1:1 或随市场变化包装为 EACO，由托管方保管原始 EAC，才能在其他链上安全流通与兑换。","es":"EAC carece de contratos inteligentes, así que los protocolos destino no pueden reconocerlo, bloquearlo ni custodiarlo; envolverlo en EACO a razón 1:1 o según el mercado, con custodia del original, permite usarlo con seguridad entre cadenas.","ar":"لا تملك EAC عقوداً ذكية، لذا لا تستطيع بروتوكولات السلاسل الوجهة التعرف عليها أو قفلها أو حفظها مباشرة؛ لذا يلزم تغليفها إلى EACO بنسبة ١:١ أو حسب السوق مع احتفاظ الوصي بالأصل، ليصبح الاستخدام عبر السلاسل آمناً.","fr":"EAC n'ayant pas de smart contracts, les protocoles des chaînes cibles ne peuvent ni le reconnaître, ni le verrouiller, ni le garder ; l'envelopper en EACO au taux de 1:1 ou selon le marché, avec garde de l'original, permet une circulation sûre entre chaînes.","ru":"У EAC нет смарт-контрактов, поэтому протоколы целевых цепочек не могут напрямую распознавать, блокировать или хранить его; обёртывание в EACO в соотношении 1:1 или по рыночному курсу с кастодиальным хранением оригинала обеспечивает безопасное кроссчейн-использование."}},{"id":94,"cat":"compliance","q":{"en":"Do I need permission to use a cross-chain bridge?","zh":"使用跨链桥需要许可吗","es":"¿Se necesita permiso para usar un puente entre cadenas?","ar":"هل يحتاج استخدام الجسر بين السلاسل إلى ترخيص؟","fr":"Faut-il une autorisation pour utiliser un pont inter-chaînes ?","ru":"Нужно ли разрешение для использования кроссчейн-моста?"},"a":{"en":"Using a decentralized bridge as a user usually needs no permission; but operators providing custody or swapping services must follow local law, and whether licensing applies depends on the jurisdiction—consult a professional.","zh":"作为用户使用去中心化跨链协议通常无需许可；但提供托管、兑换等中介服务的运营方须遵守所在辖区法律，是否构成需持牌的金融业务依辖区而定，请咨询专业人士。","es":"Usar un puente descentralizado como usuario normalmente no requiere permiso; pero los operadores de servicios de custodia o intercambio deben cumplir la ley local, y si requieren licencia depende de la jurisdicción: consulte a un profesional.","ar":"استخدام بروتوكول جسر لامركزي كمستخدم لا يتطلب عادةً ترخيصاً؛ لكن مشغلي خدمات الحراسة والتبادل ملزمون بقوانين نطاق اختصاصهم، وما إذا كان الترخيص مطلوباً يختلف باختلاف المنطقة؛ استشر مختصاً.","fr":"En tant qu'utilisateur, passer par un pont décentralisé ne requiert généralement pas de permission ; en revanche, les opérateurs de garde ou d'échange doivent respecter le droit local, et l'exigence de licence dépend de la juridiction — consultez un professionnel.","ru":"Использование децентрализованного моста как пользователь обычно не требует разрешения; но операторы услуг хранения и обмена обязаны соблюдать местные законы, а необходимость лицензии зависит от юрисдикции — проконсультируйтесь со специалистом."}},{"id":95,"cat":"compliance","q":{"en":"Do I need to file taxes on cross-chain gains?","zh":"跨链获利需要纳税申报吗","es":"¿Debo declarar impuestos por ganancias en puentes?","ar":"هل يجب تقديم إقرار ضريبي عن أرباح النقل بين السلاسل؟","fr":"Dois-je déclarer les gains issus de ponts inter-chaînes ?","ru":"Нужно ли декларировать доход от кроссчейн-операций?"},"a":{"en":"Whether you owe taxes depends on your jurisdiction, residence status and transaction type, and rules vary greatly by country; consult a local tax professional—this content is not tax or legal advice.","zh":"是否产生纳税义务，取决于你的辖区、居民身份与交易性质，各国对数字资产的税务处理差异很大；请咨询当地税务专业人士，本内容不构成税务或法律建议。","es":"La obligación tributaria depende de su jurisdicción, residencia y tipo de operación, y las reglas varían mucho entre países; consulte a un profesional fiscal local; esto no es asesoría fiscal ni legal.","ar":"يعتمد وجوب تقديم الإقرار الضريبي على منطقتك ومركز إقامتك وطبيعة المعاملات، وتختلف القواعد كثيراً بين الدول؛ استشر مختصاً ضريبياً محلياً، وهذا المحتوى ليس نصيحة ضريبية أو قانونية.","fr":"L'obligation fiscale dépend de votre juridiction, de votre résidence et du type d'opération, et les règles varient fortement d'un pays à l'autre ; consultez un fiscaliste local — ceci n'est ni un conseil fiscal ni juridique.","ru":"Налоговая обязанность зависит от юрисдикции, статуса резидента и вида операций; правила сильно различаются по странам. Проконсультируйтесь с местным специалистом по налогам — это не налоговый или юридический совет."}},{"id":96,"cat":"compliance","q":{"en":"How do regulations differ across regions?","zh":"不同地区监管有何差异","es":"¿Cómo difieren las regulaciones según la región?","ar":"كيف تختلف اللوائح بين المناطق؟","fr":"Comment varient les réglementations selon les régions ?","ru":"Чем различается регулирование в разных регионах?"},"a":{"en":"Regulation of digital assets varies by jurisdiction, covering securities status, anti-money-laundering and consumer protection with very different approaches; before cross-border bridging, check each jurisdiction's law, disclose transparently and seek advice when needed.","zh":"数字资产监管因辖区而异，涉及证券定性、反洗钱、消费者保护等议题，口径差异明显；跨国跨链操作前应逐辖区核对法律并做透明披露，必要时寻求专业意见。","es":"La regulación de activos digitales varía según la jurisdicción, con enfoques distintos en valores, lavado de dinero y protección del consumidor; antes de operar entre países, revise cada ley, divulgue con transparencia y busque asesoría.","ar":"تختلف لوائح الأصول الرقمية باختلاف المنطقة، وتشمل تصنيف الأوراق المالية ومكافحة غسل الأموال وحماية المستهلك بمناهج متباينة؛ قبل العمليات العابرة للحدود، راجع قوانين كل منطقة وكشف بشفافية واستشر الخبراء عند الحاجة.","fr":"La régulation des actifs numériques varie selon la juridiction (statut de valeur mobilière, lutte anti-blanchiment, protection des consommateurs) ; avant toute opération transfrontalière, vérifiez chaque droit, divulguez en toute transparence et sollicitez un avis professionnel.","ru":"Регулирование цифровых активов различается по юрисдикциям: статус ценных бумаг, борьба с отмыванием денег, защита прав потребителей. Перед трансграничными операциями проверяйте законодательство каждого региона, раскрывайте информацию прозрачно и при необходимости обращайтесь к специалистам."}},{"id":97,"cat":"compliance","q":{"en":"Will the platform require KYC?","zh":"平台会强制做 KYC 吗","es":"¿La plataforma exigirá KYC?","ar":"هل ستفرض المنصة التحقق من الهوية KYC؟","fr":"La plateforme imposera-t-elle un KYC ?","ru":"Будет ли платформа требовать KYC?"},"a":{"en":"Whether KYC applies depends on the platform and local compliance requirements; decentralized parts are usually usable directly, while custody and fiat on/off-ramps often require identity verification. Always check the platform's latest announcements.","zh":"是否执行 KYC 由平台设计与辖区合规要求共同决定；去中心化部分通常可直接使用，而托管、法币出入金等环节往往需要身份核验，请以各平台最新公告为准。","es":"Si se exige KYC depende de la plataforma y de los requisitos locales; las partes descentralizadas suelen usarse directamente, pero custodia y rampas fiat a menudo requieren verificación de identidad. Consulte los últimos anuncios.","ar":"يعتمد تطبيق KYC على تصميم المنصة ومتطلبات الامتثال المحلية؛ وعادة ما تُستخدم الأجزاء اللامركزية مباشرة، بينما تتطلب الحراسة وقنوات العملات الورقية غالباً التحقق من الهوية؛ راجع أحدث إعلانات المنصة.","fr":"L'obligation de KYC dépend de la plateforme et des exigences locales ; les parties décentralisées sont généralement utilisables directement, tandis que garde et rampes fiat exigent souvent une vérification d'identité. Consultez les annonces les plus récentes.","ru":"Необходимость KYC зависит от платформы и местных требований; децентрализованные части обычно доступны напрямую, а кастодиальное хранение и фиатные шлюзы часто требуют верификации личности. Сверяйтесь с последними объявлениями платформы."}},{"id":98,"cat":"roadmap","q":{"en":"What is the four-phase roadmap for EAC?","zh":"EAC 跨链的四阶段路线图是什么","es":"¿En qué consiste la hoja de ruta de cuatro fases de EAC?","ar":"ما هي خارطة الطريق رباعية المراحل لنقل EAC؟","fr":"En quoi consiste la feuille de route en quatre phases d'EAC ?","ru":"Что такое четырёхэтапная дорожная карта кроссчейна EAC?"},"a":{"en":"The roadmap unfolds in four phases: feasibility assessment (concluded moderately feasible, requiring high security standards), design and security engineering, wrapping and bridge implementation, then ecosystem rollout; details follow official announcements.","zh":"路线图分四阶段推进：从可行性论证（结论为中等可行、需高标准安全）开始，经方案与安全设计、包装与桥接实施，直至生态落地；具体节点与范围以官方发布为准。","es":"La hoja de ruta tiene cuatro fases: evaluación de viabilidad (conclusión: media, con altos estándares de seguridad), diseño y seguridad, implementación del envoltorio y el puente, y despliegue del ecosistema; los detalles siguen anuncios oficiales.","ar":"تمتد خارطة الطريق لأربع مراحل: دراسة الجدوى (النتيجة: مجدية بدرجة متوسطة وتتطلب أماناً عالياً)، ثم التصميم والهندسة الأمنية، ثم تنفيذ التغليف والجسر، وأخيراً إطلاق النظام البيئي؛ التفاصيل وفق الإعلانات الرسمية.","fr":"La feuille de route avance en quatre phases : étude de faisabilité (conclue moyennement faisable, exigeant des normes de sécurité élevées), conception et ingénierie de sécurité, mise en œuvre de l'enveloppe et du pont, puis déploiement de l'écosystème ; le détail suit les annonces officielles.","ru":"Дорожная карта состоит из четырёх этапов: оценка осуществимости (вывод — среднеосуществимо, нужны высокие стандарты безопасности), проектирование и безопасность, внедрение обёртки и моста, затем запуск экосистемы; детали — в официальных анонсах."}},{"id":99,"cat":"roadmap","q":{"en":"How can the community help drive implementation?","zh":"社区如何参与并推动落地","es":"¿Cómo impulsa la comunidad la implementación?","ar":"كيف يساهم المجتمع في دفع التنفيذ؟","fr":"Comment la communauté fait-elle avancer le projet ?","ru":"Как сообщество может продвинуть реализацию?"},"a":{"en":"The community can drive implementation by joining risk testing and security education, overseeing audits and reserve disclosures, and sharing real usage feedback; the project also runs a charity channel (https://ucoingroup.github.io/eacoweb3-2026/eaco-charity2025.html) open to co-builders.","zh":"社区可通过参与风险测试与安全教育、监督审计与储备披露、反馈真实体验推动落地；项目设有慈善栏目（https://ucoingroup.github.io/eacoweb3-2026/eaco-charity2025.html），欢迎共建生态。","es":"La comunidad impulsa el proyecto participando en pruebas de riesgo y educación en seguridad, supervisando auditorías y reservas, y dando retroalimentación real; además tiene un canal benéfico (https://ucoingroup.github.io/eacoweb3-2026/eaco-charity2025.html) abierto a quienes quieran co-construir.","ar":"يدفع المجتمع التنفيذ عبر المشاركة في اختبارات المخاطر والتثقيف الأمني، والإشراف على التدقيق والإفصاح عن الاحتياطيات، ومشاركة تجارب الاستخدام الفعلية؛ وللمشروع أيضاً قناة خيرية (https://ucoingroup.github.io/eacoweb3-2026/eaco-charity2025.html) مفتوحة للبناء المشترك.","fr":"La communauté fait avancer le projet en participant aux tests de risque et à la sensibilisation à la sécurité, en surveillant audits et réserves, et en partageant ses retours ; le projet possède aussi un canal caritatif (https://ucoingroup.github.io/eacoweb3-2026/eaco-charity2025.html) ouvert à la co-construction.","ru":"Сообщество двигает реализацию через участие в тестировании рисков и обучении безопасности, контроль аудита и раскрытия резервов, обмен реальным опытом; у проекта также есть благотворительный канал (https://ucoingroup.github.io/eacoweb3-2026/eaco-charity2025.html), открытый для совместного развития."}},{"id":100,"cat":"roadmap","q":{"en":"Where to follow the project's latest progress?","zh":"从哪里跟进项目最新进展","es":"¿Dónde seguir los últimos avances del proyecto?","ar":"من أين تتابع أحدث مستجدات المشروع؟","fr":"Où suivre les dernières avancées du projet ?","ru":"Где следить за последними новостями проекта?"},"a":{"en":"Treat official announcements and documentation as the only authoritative source; be cautious of rumors and unknown links. For roadmap, contract addresses and launch plans, always rely on and double-check the latest official disclosures.","zh":"请以项目官方公告与文档为唯一权威来源，谨慎对待社群传闻与陌生链接；涉及路线图、合约地址与上线安排等信息，一律以官方最新披露为准，并自行复核。","es":"Tome los anuncios y documentos oficiales como única fuente autorizada; desconfíe de rumores y enlaces desconocidos. Para hoja de ruta, direcciones y lanzamientos, confíe siempre en la información oficial más reciente y verifíquela.","ar":"اعتمد الإعلانات والوثائق الرسمية كمصدر وحيد موثوق، وكن حذراً من الشائعات والروابط المجهولة؛ وفيما يخص خارطة الطريق وعناوين العقود ومواعيد الإطلاق، التزم بأحدث الإفصاحات الرسمية مع التحقق بنفسك.","fr":"Considérez les annonces et la documentation officielles comme la seule source fiable ; méfiez-vous des rumeurs et des liens inconnus. Pour la feuille de route, les adresses et les lancements, fiez-vous toujours aux disclosures officiels les plus récents et vérifiez-les.","ru":"Принимайте официальные анонсы и документацию как единственный авторитетный источник; осторожно относитесь к слухам и неизвестным ссылкам. Дорожную карту, адреса контрактов и планы запуска сверяйте с последними официальными раскрытиями и проверяйте самостоятельно."}}]
};
var chainPanels={
"sol":{dot:"dot-s",key:"chainSol"},
"bsc":{dot:"dot-b",key:"chainBsc"},
"doge":{dot:"dot-d",key:"chainDoge"},
"eac":{dot:"dot-e",key:"chainEarth"}
};
function applyTranslations(){
  document.documentElement.lang=cur;
  document.documentElement.dir=RTL_LANGS[cur]?"rtl":"ltr";
  document.title=UI.brand[cur]+" · "+UI.brandSub[cur];
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k=el.getAttribute("data-i18n");
    if(UI[k])el.innerHTML=UI[k][cur];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
    var k=el.getAttribute("data-i18n-ph");
    if(UI[k])el.setAttribute("placeholder",UI[k][cur]);
  });
  document.querySelectorAll("#langBox button").forEach(function(b){
    b.classList.toggle("on",b.getAttribute("data-lang")===cur);
  });
  renderStats();renderChain();renderCarrier();renderRoutes();
renderVerdicts();renderPrecedents();renderRoad();renderRisk();renderDoge();renderCrowd();
  renderFaqCats();renderFaq();
}
function renderStats(){
  var b=document.getElementById("statsBox"),h="";
  DATA.stats.forEach(function(s){
    h+='<div class="stat"><b>'+esc(s.v)+'</b><span>'+esc(t(s.l))+((s.u&&t(s.u))?" "+esc(t(s.u)):"")+'</span></div>';
  });
  b.innerHTML=h;
}
var curChain="all",curQ="";
function renderChain(){
  var grid=document.getElementById("chainGrid"),h="";
  ["sol","bsc","doge","eac"].forEach(function(c){
    if(curChain!=="all"&&curChain!==c)return;
    var head=chainPanels[c];
    var rows=DATA.tokens.filter(function(x){return x.chain===c});
    if(curQ)rows=rows.filter(function(x){return x.name.en.toLowerCase().indexOf(curQ)>-1||x.sym.toLowerCase().indexOf(curQ)>-1||x.addr.toLowerCase().indexOf(curQ)>-1});
    h+='<div class="chain-panel"><div class="chain-head"><span class="dot '+head.dot+'"></span><div><h3>'+esc(t(UI[head.key]))+'</h3><small>'+esc(t(UI.chainSub))+'</small></div></div><div class="tlist">';
    rows.forEach(function(x){h+=tokenRow(x)});
    if(!rows.length)h+='<div class="trow"><div class="tmain" style="color:var(--faint);font-size:.85rem">'+esc(t(UI.noMatch))+'</div></div>';
    h+='</div></div>';
  });
  grid.innerHTML=h;
}
function tokenRow(x){
  var type={native:"tknNative",wrap:"tknWrapped",peg:"tknPegged",plan:"tknPlan",cust:"tknCust",chain:"tknChain"}[x.type];
  var tcls={native:"b-native",wrap:"b-wrap",peg:"b-peg",plan:"b-plan",cust:"b-cust",chain:"b-cust"}[x.type];
  var st=x.status==="ok"?('<span class="s-ok">✓ '+esc(t(UI.verOk))+'</span>'):(x.status==="warn"?('<span class="s-warn">⚠ '+esc(t(UI.verWarn))+'</span>'):('<span class="s-plan">◆ '+esc(t(UI.verPlan))+'</span>'));
  var links="";
  (x.links||[]).forEach(function(l){links+='<a href="'+l.url+'" target="_blank" rel="noopener">'+esc(t(l.label))+'</a>'});
  return '<div class="trow"><div class="tmain">'+
    '<div class="tname"><span class="mono" style="font-weight:700">'+esc(x.sym)+'</span><span class="badge '+tcls+'">'+esc(t(UI[type]))+'</span>'+st+'</div>'+
    '<div class="tdesc">'+esc(t(x.name))+(x.note?' · '+esc(t(x.note)):'')+'</div>'+
    '<div class="addr"><span class="mono">'+esc(x.addr)+'</span><button class="copy" data-ca="'+esc(x.addr)+'">'+esc(t(UI.copyB))+'</button></div>'+
    (links?'<div class="tlinks">'+links+'</div>':'')+
    '</div></div>';
}

  DATA.carriers.forEach(function(c){
    h+='<tr><td><b>'+esc(c.sym)+'</b><br><span style="font-size:.72rem;color:var(--faint)">'+esc(t(c.name))+'</span></td>'+
    '<td>'+esc(t(c.sol))+'</td><td>'+esc(t(c.bsc))+'</td><td>'+esc(t(c.role))+'</td></tr>';
  });

}
function renderRoutes(){
  var sel=document.getElementById("routeSel");
  sel.innerHTML=DATA.routes.map(function(r,i){return '<option value="'+i+'">'+esc(t(r.label))+'</option>'}).join("");

}
function showRoute(){
  var i=+document.getElementById("routeSel").value||0;
  var r=DATA.routes[i];
  document.getElementById("routeOut").innerHTML='<b>'+esc(t(r.label))+'</b><br>'+esc(t(r.text))+(r.ref?'<br><span style="color:var(--faint);font-size:.78rem">'+esc(t(r.ref))+'</span>':'');
}
function renderVerdicts(){
  var b=document.getElementById("verdictBox"),h="";

    h+='<div class="card verdict '+(v.w?"w":"")+'"><h3><span class="ico" style="background:rgba(46,230,168,.1)">'+(v.w?"⚠":"✓")+'</span>'+esc(t(v.title))+'</h3><p>'+esc(t(v.text))+'</p></div>';

function renderPrecedents(){

}
function renderRoad(){
  var b=document.getElementById("roadBox"),h="";
  DATA.roadmap.forEach(function(r){
    h+='<div class="tl-item"><h4><span class="ph">'+esc(t(r.ph))+': '+esc(t(r.span))+'</span>'+esc(t(r.title))+'</h4><p>'+esc(t(r.desc))+'</p></div>';
  });

}
function renderRisk(){
  var b=document.getElementById("riskBox"),h="";
  DATA.risks.forEach(function(r){
    h+='<div class="risk-card"><span class="lvl lvl-'+r.lvl+'">'+esc(t(UI.riskLvl))+' '+("★").repeat(Math.min(3,Math.max(1,r.lvl)))+'</span><h4>'+esc(t(r.title))+'</h4><p>'+esc(t(r.desc))+'</p><div class="mit">'+esc(t(UI.riskMit))+': '+esc(t(r.mit))+'</div></div>';
  });

}
function renderDoge(){
  var f=document.getElementById("dogeFlow"),h='<div class="df-inner">';
  DATA.dogeFlow.forEach(function(n,i){
    h+='<span class="df-node">'+esc(t(n.t))+'</span>';
    if(i<DATA.dogeFlow.length-1)h+='<span class="df-arrow">→</span>';
  });
  f.innerHTML=h+'</div>';
  var b=document.getElementById("dogeBox"),g="";
  DATA.dogeSteps.forEach(function(r){
    g+='<div class="card"><h3><span class="ico" style="width:auto;padding:3px 10px;font-size:.72rem">'+esc(t(r.ph))+'</span>'+esc(t(r.title))+'</h3><p>'+esc(t(r.desc))+'</p></div>';
  });

  var a=document.getElementById("dogeAddr"),c="";
  DATA.dogeAddrs.forEach(function(r){
    c+='<div class="card" style="margin:10px 0;padding:12px 16px"><div style="font-weight:600;margin-bottom:6px">'+esc(t(r.lab))+'</div><div class="addr"><span class="mono">'+esc(r.addr)+'</span><button class="copy" data-ca="'+esc(r.addr)+'">'+esc(t(UI.copyB))+'</button></div><a href="'+esc(r.url)+'" target="_blank" rel="noopener" style="font-size:.78rem">'+esc(t(UI.chainSub))+' →</a></div>';

}
function renderCrowd(){
  var b=document.getElementById("crowdBox"),h="";
  DATA.crowd.forEach(function(r){
    h+='<div class="card"><h3><span class="ico" style="width:auto;padding:3px 10px;font-size:.72rem">'+esc(t(r.ph))+'</span>'+esc(t(r.title))+'</h3><p>'+esc(t(r.desc))+'</p></div>';
  });
  b.innerHTML=h;
}
var FAQ_ORDER=["basic","relation","address","carrier","mechanism","howto","security","earthcoin","compliance","roadmap"];
var FAQ_UIKEY={basic:"faqCatBasic",relation:"faqCatRelation",address:"faqCatAddress",carrier:"faqCatCarrier",mechanism:"faqCatMechanism",howto:"faqCatHowto",security:"faqCatSecurity",earthcoin:"faqCatEarthcoin",compliance:"faqCatCompliance",roadmap:"faqCatRoadmap"};
var curFaqCat="all",curFaqQ="";
function renderFaqCats(){
  var box=document.getElementById("faqCats"),h='<button class="'+(curFaqCat==="all"?"on":"")+'" data-fc="all">'+esc(t(UI.faqAll))+'</button>';
  FAQ_ORDER.forEach(function(c){
    var n=DATA.faqs.filter(function(x){return x.cat===c}).length;
    h+='<button class="'+(curFaqCat===c?"on":"")+'" data-fc="'+c+'">'+esc(t(UI[FAQ_UIKEY[c]]))+' ('+n+')</button>';
  });
  box.innerHTML=h;
  box.querySelectorAll("button").forEach(function(b){
    b.onclick=function(){curFaqCat=b.getAttribute("data-fc");curFaqQ="";document.getElementById("faqSearch").value="";renderFaqCats();renderFaq()};
  });
}
function faqMatch(x){
  if(curFaqCat!=="all"&&x.cat!==curFaqCat)return false;
  if(curFaqQ){
    var hit=false;
    LANGS.forEach(function(l){
      if((x.q[l]&&x.q[l].toLowerCase().indexOf(curFaqQ)>-1)||(x.a[l]&&x.a[l].toLowerCase().indexOf(curFaqQ)>-1))hit=true;
    });
    return hit;
  }
  return true;
}
function renderFaq(){
  var box=document.getElementById("faqBox"),h="";
  var items=DATA.faqs.filter(faqMatch);
  var cnt=document.getElementById("faqCount");
  cnt.innerHTML=UI.faqCount[cur].replace("%n%",items.length);
  if(!items.length){
    box.innerHTML='<div class="faq-empty">'+esc(t(UI.faqEmpty))+'</div>';
    return;
  }
  items.forEach(function(x){
    h+='<div class="faq-item"><button class="faq-q" type="button"><span class="fn">'+String(x.id).padStart(3,"0")+'</span><span>'+esc(t(x.q))+'</span><span class="pm">+</span></button><div class="faq-a">'+esc(t(x.a))+'</div></div>';
  });
  box.innerHTML=h;
  box.querySelectorAll(".faq-q").forEach(function(q){
    q.onclick=function(){q.parentElement.classList.toggle("open")};
  });
}
function buildLang(){
  var box=document.getElementById("langBox");
  box.innerHTML='<span style="color:var(--faint);font-size:.75rem">'+esc(t(UI.langLabel))+'</span>';
  LANGS.forEach(function(l){
    var b=document.createElement("button");
    b.setAttribute("data-lang",l);
    b.textContent=LANG_NAMES[l];
    b.onclick=function(){cur=l;try{localStorage.setItem("eacoswap_lang",l)}catch(e){}applyTranslations()};
    box.appendChild(b);
  });
}
function init(){
  buildLang();applyTranslations();
  document.querySelectorAll(".filters button").forEach(function(b){
    b.onclick=function(){document.querySelectorAll(".filters button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");curChain=b.getAttribute("data-f");renderChain()};
  });
var sb=document.getElementById("searchBox");
  sb.oninput=function(){curQ=sb.value.trim().toLowerCase();renderChain()};
  document.getElementById("clearSearch").onclick=function(){sb.value="";curQ="";curChain="all";document.querySelectorAll(".filters button").forEach(function(x){x.classList.remove("on")});document.querySelector('.filters button[data-f="all"]').classList.add("on");renderChain()};
  var fs=document.getElementById("faqSearch");
  fs.oninput=function(){curFaqQ=fs.value.trim().toLowerCase();renderFaq()};
  document.getElementById("faqClear").onclick=function(){fs.value="";curFaqQ="";curFaqCat="all";renderFaqCats();renderFaq()};
  document.getElementById("routeSel").onchange=showRoute;
  document.getElementById("menuBtn").onclick=function(){document.getElementById("nav").classList.toggle("open")};
  document.addEventListener("click",function(e){var c=e.target.closest(".copy");if(c){copyAddr(c.getAttribute("data-ca"),c)}});
}
document.addEventListener("DOMContentLoaded",init);
</script>
