  desc:{en:"(Explore) Funds are released in tranches — audit, development, liquidity cold-start — each tranche gated by a community vote and independent attestation; surplus and undistributed pledges follow a pre-agreed refund or burn path.",zh:"（探讨）资金按批次释放——审计、开发、流动性冷启动——每批都以社区投票与独立核验为门槛；结余与未分配承诺按事先约定退回或销毁。",es:"(Explorar) Fondos liberados por tramos — auditoría, desarrollo, arranque de liquidez — cada tramo sujeto a voto comunitario y atestación independiente; el excedente sigue una ruta pactada de reembolso o quema.",ar:"(استكشاف) إطلاق الأموال على دفعات — تدقيق وتطوير وإقلاع سيولة — وكل دفعة بموجب تصويت مجتمعي وإثبات مستقل؛ يعاد الفائض أو يُحرق وفق مسار متفق عليه.",fr:"(Explorer) Fonds libérés par tranches — audit, développement, amorçage de liquidité — chacune soumise à un vote communautaire et une attestation indépendante ; le surplus suit une voie convenue de remboursement ou de brûlage.",ru:"(Исследование) Средства выделяются траншами — аудит, разработка, холодный старт ликвидности — каждый транш по решению сообщества и независимой аттестации; излишки возвращаются или сжигаются по согласованному пути."}},
 {ph:{en:"Discuss 1",zh:"探讨一",es:"Debate 1",ar:"نقاش ١",fr:"Discussion 1",ru:"Обсуждение 1"},
  title:{en:"Custody model: guardian federation vs smart contract",zh:"托管模型：守护者联邦 vs 智能合约",es:"Modelo de custodia: federación de guardianes vs contrato inteligente",ar:"نموذج الحفظ: اتحاد الأوصياء مقابل العقد الذكي",fr:"Modèle de garde : fédération de gardiens vs contrat intelligent",ru:"Модель хранения: федерация хранителей против смарт-контракта"},
  desc:{en:"(Discuss) Compare a multi-sig guardian federation on wallet v2.1.4 with on-chain escrow contracts; weigh slashing, time locks, jurisdictional resilience and auditability.",zh:"（讨论）比较 v2.1.4 钱包多签守护者联邦与链上托管合约两种模式；权衡罚没机制、时间锁、辖区韧性与可审计性。",es:"(Debate) Comparar la federación multisig en wallets v2.1.4 con contratos de custodia en cadena; ponderar slashing, time locks, resiliencia jurisdiccional y auditabilidad.",ar:"(نقاش) مقارنة اتحاد التوقيع المتعدد على محافظ v2.1.4 مع عقود الضمان على السلسلة؛ موازنة العقوبات والأقفال الزمنية والمرونة القضائية وقابلية التدقيق.",fr:"(Discussion) Comparer la fédération multisig sur wallets v2.1.4 et les contrats de dépôt on-chain ; peser slashing, time locks, résilience juridictionnelle et auditabilité.",ru:"(Обсуждение) Сравнение мультисиг-федерации на кошельках v2.1.4 и ончейн-эскроу-контрактов; взвешивание штрафов, тайм-локов, юрисдикционной устойчивости и аудируемости."}},
 {ph:{en:"Discuss 2",zh:"探讨二",es:"Debate 2",ar:"نقاش ٢",fr:"Discussion 2",ru:"Обсуждение 2"},
  title:{en:"Governance & compliance guardrails",zh:"治理与合规护栏",es:"Gobernanza y salvaguardas de cumplimiento",ar:"الحوكمة وقواعد الامتثال",fr:"Gouvernance et garde-fous de conformité",ru:"Управление и комплаенс-ограничения"},
  desc:{en:"(Discuss) Community votes set the fundraising cap, milestones and use of funds; hard constraints: not a security, no promise of returns, geo-restrictions, open audit trail and an anti-money-laundering posture.",zh:"（讨论）社区投票决定募资上限、里程碑与资金用途；硬性约束：非证券、不承诺收益、辖区限制、公开审计溯源与反洗钱立场。",es:"(Debate) El voto comunitario fija tope, hitos y uso de fondos; límites: no es un valor, sin promesa de rentabilidad, restricciones geográficas, trazabilidad y postura AML.",ar:"(نقاش) يصوّت المجتمع على سقف التمويل والمعالم واستخدام الأموال؛ قيود صارمة: ليست ورقة مالية، لا وعد بعوائد، قيود جغرافية، مسار تدقيق مفتوح وموقف لمكافحة غسل الأموال.",fr:"(Discussion) Le vote communautaire fixe le plafond, les jalons et l'usage des fonds ; contraintes : pas une valeur mobilière, aucune promesse de rendement, restrictions géographiques, piste d'audit ouverte et posture AML.",ru:"(Обсуждение) Решение сообщества по лимиту сбора, этапам и использованию средств; жёсткие ограничения: не ценная бумага, никаких обещаний доходности, гео-ограничения, открытая аудит-трасса и позиция ПОД/ФТ."}},
 {ph:{en:"Discuss 3",zh:"探讨三",es:"Debate 3",ar:"نقاش ٣",fr:"Discussion 3",ru:"Обсуждение 3"},
  title:{en:"Transparency & public attestations",zh:"透明度与公开储量证明",es:"Transparencia y atestaciones públicas",ar:"الشفافية والإثباتات العلنية",fr:"Transparence et attestations publiques",ru:"Прозрачность и публичные аттестации"},
  desc:{en:"(Discuss) Monthly reserve attestations, a public redemption oracle, an on-chain treasury dashboard, and a whitelist-based explorer airdrop (concept only) for verified contributors.",zh:"（讨论）月度储量证明、公开赎回预言机、链上金库看板，以及面向核验贡献者的白名单探索空投（仅为构想）。",es:"(Debate) Atestaciones mensuales, oráculo público de canje, dashboard de tesorería en cadena y un airdrop de explorador por lista blanca (solo concepto) para contribuyentes verificados.",ar:"(نقاش) إثباتات احتياطي شهرية وأوراكل استرداد علني ولوحة خزينة على السلسلة وإسقاط فارسي بقائمة بيضاء (مفهوم فقط) للمساهمين الموثقين.",fr:"(Discussion) Attestations mensuelles de réserve, oracle public de rachat, tableau de bord de trésorerie on-chain, et un airdrop explorateur sur liste blanche (concept uniquement) pour les contributeurs vérifiés.",ru:"(Обсуждение) Ежемесячные аттестации резервов, публичный оракул выкупа, ончейн-дашборд казны и вайтлист-айрдроп исследователям (только концепция) для проверенных участников."}}
],
faqs:[{"id":1,"cat":"basic","q":{"en":"What is EACO?","zh":"EACO 是什么代币？","es":"¿Qué es EACO?","ar":"ما هو EACO؟","fr":"Qu'est-ce qu'EACO ?","ru":"Что такое EACO?"},"a":{"en":"EACO, meaning \"Earth\" in Chinese, is a native SPL token on Solana, CA DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. The project is exploring bridging it to the BNB Chain, Dogecoin, and the Earthcoin ecosystem.","zh":"EACO 中文名「地球」，是 Solana 原生的 SPL 代币，合约地址 DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH。项目正在探索将其跨链至 BNB Chain 与 Dogecoin 以及 Earthcoin 生态。","es":"EACO, «Tierra» en chino, es un token SPL nativo de Solana, CA DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. El proyecto explora su puente hacia BNB Chain, Dogecoin y el ecosistema Earthcoin.","ar":"EACO، وتعني «الأرض» بالصينية، هو رمز SPL أصلي على سولانا، بمعرّف العقد DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. يستكشف المشروع نقله إلى سلسلة BNB ودوجكوين ونظام إيرثكوين البيئي.","fr":"EACO, « Terre » en chinois, est un jeton SPL natif de Solana, CA DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Le projet explore son pont vers BNB Chain, Dogecoin et l'écosystème Earthcoin.","ru":"EACO («Земля» по-китайски) — нативный SPL-токен в сети Solana, CA DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Проект изучает мост в BNB Chain, Dogecoin и экосистему Earthcoin."}},{"id":2,"cat":"basic","q":{"en":"What is Dogecoin (DOGE)?","zh":"什么是狗狗币（DOGE）？","es":"¿Qué es Dogecoin (DOGE)?","ar":"ما هو دوجكوين (DOGE)؟","fr":"Qu'est-ce que Dogecoin (DOGE) ?","ru":"Что такое Dogecoin (DOGE)?"},"a":{"en":"Created in 2013, DOGE is a Scrypt PoW UTXO chain without smart contracts and with block time around 1 minute. Official site: https://dogecoin.com.","zh":"DOGE 诞生于 2013 年，是 Scrypt PoW 的 UTXO 链，无智能合约，约 1 分钟出块，官网 https://dogecoin.com，中文俗称「狗狗币」。","es":"Creado en 2013, DOGE es una cadena UTXO PoW Scrypt sin contratos inteligentes, con bloques de unos 1 minuto. Sitio oficial: https://dogecoin.com.","ar":"أُنشئ DOGE عام ٢٠١٣، وهو سلسلة UTXO بإثبات العمل Scrypt دون عقود ذكية، وتُصدِر الكتلة نحو دقيقة واحدة. الموقع الرسمي: https://dogecoin.com.","fr":"Créé en 2013, DOGE est une chaîne UTXO PoW Scrypt sans contrats intelligents, avec un bloc toutes les ~1 minute. Site officiel : https://dogecoin.com.","ru":"Созданный в 2013 году DOGE — это UTXO-цепь на Scrypt PoW без смарт-контрактов, блок генерируется примерно за 1 минуту. Официальный сайт: https://dogecoin.com."}},{"id":3,"cat":"basic","q":{"en":"What is a cross-chain bridge?","zh":"什么是跨链？有什么作用？","es":"¿Qué es un puente entre cadenas?","ar":"ما هو نقل الأصول بين السلاسل؟","fr":"Qu'est-ce qu'un pont inter-chaînes ?","ru":"Что такое кроссчейн-мост?"},"a":{"en":"Cross-chain bridging moves assets or data between two or more blockchains via native bridges or wrapped tokens, connecting liquidity across different chains.","zh":"跨链指让资产或数据在两条及以上区块链之间转移的技术，常见方式有原生桥、托管包装（如锚定代币）等，用于打通不同链的流动性。","es":"Un puente transfiere activos o datos entre dos o más cadenas mediante puentes nativos o tokens envueltos, conectando la liquidez entre cadenas.","ar":"نقل الأصول بين السلاسل تقنية تتيح تحويل الأصول أو البيانات بين سلسلتين أو أكثر، عبر جسور أصلية أو رموز مغلّفة، لربط السيولة بين السلاسل.","fr":"Un pont transfère des actifs ou données entre deux ou plusieurs blockchains via des ponts natifs ou jetons enveloppés, reliant la liquidité entre chaînes.","ru":"Кроссчейн-мост перемещает активы или данные между двумя и более блокчейнами через нативные мосты или обёрнутые токены, соединяя ликвидность цепей."}},{"id":4,"cat":"basic","q":{"en":"Why does EACO bridge DOGE?","zh":"为什么 EACO 要跨链 DOGE？","es":"¿Por qué EACO puentea con DOGE?","ar":"لماذا يربط EACO DOGE عبر الجسور؟","fr":"Pourquoi EACO relie DOGE par pont ?","ru":"Зачем EACO связывает DOGE мостом?"},"a":{"en":"EACO explores routes bringing DOGE into BNB Chain and the Earthcoin ecosystem, connecting the most famous meme asset with broader liquidity and real use cases.","zh":"EACO 探索把 DOGE 引入 BNB Chain 与 Earthcoin 生态的可行路径，让最知名的 Meme 资产连通更大流动性与实际应用场景，提升生态价值。","es":"EACO explora cómo llevar DOGE a BNB Chain y al ecosistema Earthcoin, conectando el meme más famoso con mayor liquidez y casos de uso reales.","ar":"يستكشف EACO مسارات لجلب DOGE إلى سلسلة BNB ونظام إيرثكوين، لربط أشهر أصول الميم بسيولة أوسع وحالات استخدام حقيقية.","fr":"EACO explore comment amener DOGE vers BNB Chain et l'écosystème Earthcoin, reliant l'actif meme le plus connu à plus de liquidité et d'usages réels.","ru":"EACO изучает пути приведения DOGE в BNB Chain и экосистему Earthcoin, соединяя самый известный мем-актив с более широкой ликвидностью и реальным применением."}},{"id":5,"cat":"basic","q":{"en":"How are EACO and DOGE related?","zh":"EACO 与 DOGE 有什么关系？","es":"¿Cómo se relacionan EACO y DOGE?","ar":"ما العلاقة بين EACO وDOGE؟","fr":"Quel rapport entre EACO et DOGE ?","ru":"Как связаны EACO и DOGE?"},"a":{"en":"They are separate tokens: EACO is a native Solana SPL token, while DOGE is native Dogecoin. This research project only explores possible cross-chain links between them.","zh":"两者是独立代币：EACO 是 Solana 原生 SPL 代币，DOGE 是原生狗狗币。本探索项目研究二者跨链连通的可能性，并非同一项目。","es":"Son tokens independientes: EACO es un token SPL nativo de Solana y DOGE es Dogecoin nativo. Este proyecto solo investiga posibles conexiones entre cadenas.","ar":"هما رمزان مستقلان: EACO رمز SPL أصلي على سولانا، وDOGE هو دوجكوين الأصلي. يستكشف هذا المشروع إمكانية الربط بينهما عبر السلاسل.","fr":"Ce sont des jetons distincts : EACO est un jeton SPL natif de Solana, DOGE est le Dogecoin natif. Ce projet explore d'éventuels ponts entre eux.","ru":"Это независимые токены: EACO — нативный SPL-токен Solana, DOGE — нативный Dogecoin. Проект изучает возможные кроссчейн-связи между ними."}},{"id":6,"cat":"basic","q":{"en":"What is an SPL token?","zh":"什么是 SPL 格式代币？","es":"¿Qué es un token SPL?","ar":"ما هو رمز SPL؟","fr":"Qu'est-ce qu'un jeton SPL ?","ru":"Что такое SPL-токен?"},"a":{"en":"SPL is Solana's token standard, similar to ERC-20 on Ethereum. EACO is a native Solana SPL token, directly supported by wallets and DEXs.","zh":"SPL 是 Solana 的代币标准，类似以太坊的 ERC-20。EACO 就是 Solana 原生的 SPL 代币，可被钱包、DEX 等生态直接支持。","es":"SPL es el estándar de tokens de Solana, similar al ERC-20 de Ethereum. EACO es un token SPL nativo compatible con wallets y DEX.","ar":"SPL هو معيار الرموز في سولانا، شبيه بـ ERC-20 في إيثيريوم. EACO رمز SPL أصلي مدعوم من المحافظ ومنصات التداول اللامركزية.","fr":"SPL est le standard de jetons de Solana, comparable à ERC-20 sur Ethereum. EACO est un jeton SPL natif supporté par les wallets et DEX.","ru":"SPL — стандарт токенов Solana, аналог ERC-20 в Ethereum. EACO — нативный SPL-токен, поддерживаемый кошельками и DEX."}},{"id":7,"cat":"basic","q":{"en":"What is a UTXO chain?","zh":"什么是 UTXO 模型链？","es":"¿Qué es una cadena UTXO?","ar":"ما هي سلسلة UTXO؟","fr":"Qu'est-ce qu'une chaîne UTXO ?","ru":"Что такое UTXO-цепь?"},"a":{"en":"In the UTXO (Unspent Transaction Output) model, transactions spend and create outputs; Bitcoin and Dogecoin use it. DOGE is a UTXO chain suited to simple transfers.","zh":"UTXO（未花费交易输出）模型下，每笔交易由锁定与解锁的输出组成，比特币、狗狗币均采用此模型。DOGE 即 UTXO 链，适合简单转账。","es":"En el modelo UTXO (salidas no gastadas), las transacciones gastan y crean salidas; Bitcoin y Dogecoin lo usan. DOGE es una cadena UTXO apta para transferencias simples.","ar":"في نموذج UTXO (مخرجات المعاملات غير المنفقة)، تنفق المعاملات وتُنشئ مخرجات، وتستخدمه بيتكوين ودوجكوين. DOGE سلسلة UTXO مناسبة للتحويلات البسيطة.","fr":"Dans le modèle UTXO (sorties non dépensées), les transactions dépensent et créent des sorties ; Bitcoin et Dogecoin l'utilisent. DOGE est une chaîne UTXO adaptée aux transferts simples.","ru":"В модели UTXO (неизрасходованные выходы транзакций) транзакции тратят и создают выходы; её используют Bitcoin и Dogecoin. DOGE — UTXO-цепь для простых переводов."}},{"id":8,"cat":"basic","q":{"en":"What is a BEP20 token?","zh":"什么是 BEP20 代币？","es":"¿Qué es un token BEP20?","ar":"ما هو معيار BEP20؟","fr":"Qu'est-ce qu'un jeton BEP20 ?","ru":"Что такое BEP20-токен?"},"a":{"en":"BEP20 is BNB Chain's token standard. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) is the wrapped DOGE version issued on BNB Chain under this standard.","zh":"BEP20 是 BNB Chain 的代币标准。Binance-Peg DOGE（0xbA2aE424D960c26247Dd6c32edC70B295c744C43）就是该链上的币安锚定 DOGE 版本，属于包装资产。","es":"BEP20 es el estándar de tokens de BNB Chain. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) es la versión envuelta de DOGE emitida en esa cadena.","ar":"BEP20 هو معيار الرموز في سلسلة BNB. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) هو نسخة DOGE المغلّفة المُصدرة على هذه السلسلة.","fr":"BEP20 est le standard de jetons de BNB Chain. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) est la version enveloppée de DOGE émise sur cette chaîne.","ru":"BEP20 — стандарт токенов сети BNB Chain. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) — обёрнутая версия DOGE, выпущенная в этой сети."}},{"id":9,"cat":"basic","q":{"en":"What is a contract address (CA)?","zh":"什么是 CA 合约地址？","es":"¿Qué es una dirección de contrato (CA)?","ar":"ما هو معرّف العقد (CA)؟","fr":"Qu'est-ce qu'une adresse de contrat (CA) ?","ru":"Что такое адрес контракта (CA)?"},"a":{"en":"A contract address (CA) uniquely identifies a token contract, e.g. EACO's DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Always verify it on https://oklink.com, OrbMarkets or CoinGecko before transferring or adding tokens.","zh":"CA（合约地址）是代币合约的唯一标识，如 EACO 的 DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH。转账或添加代币前，务必在 https://oklink.com、OrbMarkets、CoinGecko 等来源核对。","es":"La CA identifica de forma única un contrato de token, p. ej. la de EACO: DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Verifícala en https://oklink.com, OrbMarkets o CoinGecko antes de transferir o añadir tokens.","ar":"معرّف العقد (CA) هو عنوان فريد لعقد الرمز، مثل DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH لرمز EACO. تحقق منه عبر https://oklink.com وOrbMarkets وCoinGecko قبل التحويل أو الإضافة.","fr":"La CA identifie de façon unique un contrat de jeton, ex. celle d'EACO : DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Vérifiez-la sur https://oklink.com, OrbMarkets ou CoinGecko avant transfert ou ajout.","ru":"Адрес контракта (CA) уникально идентифицирует контракт токена, например DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH для EACO. Проверяйте его на https://oklink.com, OrbMarkets или CoinGecko перед переводом или добавлением."}},{"id":10,"cat":"basic","q":{"en":"How do EACO and Earthcoin differ?","zh":"EACO 与 Earthcoin 有什么区别？","es":"¿Cómo se diferencian EACO y Earthcoin?","ar":"ما الفرق بين EACO وإيرثكوين؟","fr":"Quelle différence entre EACO et Earthcoin ?","ru":"Чем различаются EACO и Earthcoin?"},"a":{"en":"EACO means \"Earth\" in Chinese and is a Solana SPL token; Earthcoin (EAC), \"Earth Coin\", is a different token from a different project. Never confuse them.","zh":"EACO 中文名「地球」，是 Solana 的 SPL 代币；Earthcoin（EAC）中文名「地球币」，属于不同项目的不同代币，两者勿混淆。","es":"EACO, «Tierra» en chino, es un token SPL de Solana; Earthcoin (EAC) es un token distinto de otro proyecto. Nunca deben confundirse.","ar":"EACO يعني «الأرض» بالصينية وهو رمز SPL على سولانا؛ إيرثكوين (EAC) «عملة الأرض» رمز مختلف من مشروع مختلف. لا تخلط بينهما أبدًا.","fr":"EACO, « Terre » en chinois, est un jeton SPL de Solana ; Earthcoin (EAC) est un jeton différent d'un autre projet. Ne les confondez jamais.","ru":"EACO («Земля» по-китайски) — SPL-токен Solana; Earthcoin (EAC) — другой токен другого проекта. Не путайте их."}},{"id":11,"cat":"relation","q":{"en":"How does doge-spl relate to native DOGE?","zh":"doge-spl 与原生 DOGE 什么关系？","es":"¿Cómo se relaciona doge-spl con el DOGE nativo?","ar":"ما علاقة doge-spl بـDOGE الأصلي؟","fr":"Quel lien entre doge-spl et le DOGE natif ?","ru":"Как doge-spl соотносится с нативным DOGE?"},"a":{"en":"doge-spl (CA DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) is the SPL version of DOGE on Solana — a wrapped asset, not the DOGE circulating on Dogecoin's native chain.","zh":"doge-spl（CA DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R）是 DOGE 在 Solana 上的 SPL 版本，属于包装资产，并非狗狗币原生链上流通的 DOGE 本体。","es":"doge-spl (CA DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) es la versión SPL de DOGE en Solana: un activo envuelto, no el DOGE de la cadena nativa de Dogecoin.","ar":"doge-spl (CA DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) نسخة SPL من DOGE على سولانا، وهي أصل مغلّف وليست DOGE المتداول على السلسلة الأصلية لدوجكوين.","fr":"doge-spl (CA DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) est la version SPL de DOGE sur Solana : un actif enveloppé, pas le DOGE de la chaîne native de Dogecoin.","ru":"doge-spl (CA DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) — версия DOGE в стандарте SPL в Solana: обёрнутый актив, а не DOGE в нативной сети Dogecoin."}},{"id":12,"cat":"relation","q":{"en":"Why can DOGE circulate on three chains?","zh":"DOGE 为何能在三条链流通？","es":"¿Por qué DOGE circula en tres cadenas?","ar":"لماذا يتداول DOGE على ثلاث سلاسل؟","fr":"Pourquoi DOGE circule-t-il sur trois chaînes ?","ru":"Почему DOGE обращается на трёх сетях?"},"a":{"en":"Besides the native chain, doge-spl is the SPL version on Solana and Binance-Peg DOGE the anchored version on BNB Chain; wrapping lets the asset circulate per-chain standards.","zh":"除原生链外，doge-spl 是 Solana 上的 SPL 版本，Binance-Peg DOGE 是 BNB Chain 上的锚定版本；包装机制让同一资产按各链标准流通。","es":"Además de la cadena nativa, doge-spl es la versión SPL en Solana y Binance-Peg DOGE la anclada en BNB Chain; el wrapping permite circular según cada estándar.","ar":"إلى جانب السلسلة الأصلية، doge-spl نسخة SPL على سولانا، وBinance-Peg DOGE نسخة مربوطة على سلسلة BNB؛ التغليف يتيح تداول الأصل وفق معايير كل سلسلة.","fr":"Outre la chaîne native, doge-spl est la version SPL sur Solana et Binance-Peg DOGE la version ancrée sur BNB Chain ; l'enveloppement permet de circuler selon chaque standard.","ru":"Помимо нативной сети, doge-spl — версия SPL в Solana, а Binance-Peg DOGE — привязанная версия в BNB Chain; обёртывание позволяет активу обращаться по стандартам каждой сети."}},{"id":13,"cat":"relation","q":{"en":"What is EACO's goal in bridging DOGE?","zh":"EACO 跨链 DOGE 的目标是什么？","es":"¿Cuál es el objetivo de EACO al puentear DOGE?","ar":"ما هدف EACO من ربط DOGE؟","fr":"Quel est l'objectif d'EACO en reliant DOGE ?","ru":"Какова цель EACO в мосте DOGE?"},"a":{"en":"To explore feasible routes bringing DOGE into BNB Chain and the Earthcoin ecosystem — giving DOGE new use cases and attracting classic meme liquidity to EACO's ecosystem.","zh":"探索把 DOGE 引入 BNB Chain 与 Earthcoin 生态的可行路径，让 DOGE 触达新应用场景，也为 EACO 生态引入经典 Meme 资产的流动性。","es":"Explorar rutas viables para llevar DOGE a BNB Chain y al ecosistema Earthcoin: darle nuevos usos y atraer liquidez meme clásica al ecosistema EACO.","ar":"استكشاف مسارات مجدية لجلب DOGE إلى سلسلة BNB ونظام إيرثكوين، لمنح DOGE استخدامات جديدة ولجلب سيولة الميم الكلاسيكية لنظام EACO.","fr":"Explorer des routes viables pour amener DOGE vers BNB Chain et l'écosystème Earthcoin : donner à DOGE de nouveaux usages et attirer la liquidité meme vers EACO.","ru":"Изучить реальные пути приведения DOGE в BNB Chain и экосистему Earthcoin — дать DOGE новые применения и привлечь классическую мем-ликвидность в экосистему EACO."}},{"id":14,"cat":"relation","q":{"en":"How will EACO and DOGE be used together?","zh":"跨链后 EACO 与 DOGE 如何互相使用？","es":"¿Cómo se usarán juntos EACO y DOGE?","ar":"كيف يُستخدم EACO وDOGE معًا بعد الربط؟","fr":"Comment EACO et DOGE s'utiliseront-ils ensemble ?","ru":"Как EACO и DOGE будут использоваться вместе?"},"a":{"en":"In this exploration, users could hold, trade and combine both assets in one ecosystem — DOGE for ecosystem apps and EACO as a token medium. Exact forms are still under research.","zh":"探索设想中，用户可在同一生态内持有、交易和组合使用两种资产，如用 DOGE 参与生态应用、以 EACO 作通证媒介；具体形态仍在研究中。","es":"En la exploración, los usuarios podrían mantener, intercambiar y combinar ambos activos en un ecosistema: DOGE para apps y EACO como medio. Las formas exactas aún se estudian.","ar":"في الاستكشاف، يمكن للمستخدمين الاحتفاظ بالأصلين وتداولهما واستخدامهما معًا في نظام واحد، مثل DOGE لتطبيقات النظام وEACO كوسيلة رمزية. الصيغ الدقيقة قيد البحث.","fr":"Dans l'exploration, les utilisateurs pourraient conserver, échanger et combiner les deux actifs dans un écosystème — DOGE pour les apps et EACO comme jeton. Formes exactes à l'étude.","ru":"В рамках исследования пользователи смогут держать, торговать и сочетать оба актива в одной экосистеме — DOGE для приложений, EACO как токен-медиум. Точные формы ещё изучаются."}},{"id":15,"cat":"relation","q":{"en":"Why choose DOGE as the bridge target?","zh":"为什么选择 DOGE 作为跨链对象？","es":"¿Por qué elegir DOGE como objetivo de puente?","ar":"لماذا اختيار DOGE كهدف للربط؟","fr":"Pourquoi choisir DOGE comme cible de pont ?","ru":"Почему DOGE выбран целью моста?"},"a":{"en":"DOGE is one of the most famous meme coins, with a huge community and strong brand recognition. Bridging it can boost appeal, liquidity and buzz — a natural first step.","zh":"DOGE 是最知名的 Meme 币之一，拥有广泛社区与强品牌认知。探索将其桥接，可提升新生态的吸引力、流动性与话题性，是自然的第一步。","es":"DOGE es una de las meme coins más famosas, con gran comunidad y fuerte reconocimiento. Puentearla impulsa atractivo, liquidez y atención del ecosistema: un primer paso natural.","ar":"DOGE من أشهر عملات الميم، بجمهور واسع وعلامة معروفة بقوة. ربطه يعزز جاذبية النظام الجديد وسيولته وحضوره، وهو خطوة أولى طبيعية.","fr":"DOGE est l'une des meme coins les plus connues, avec une large communauté et une forte notoriété. La relier booste l'attrait, la liquidité et l'écho : une première étape naturelle.","ru":"DOGE — одна из самых известных мем-монет с широким сообществом и сильной узнаваемостью. Мост усилит привлекательность, ликвидность и внимание к экосистеме — естественный первый шаг."}},{"id":16,"cat":"relation","q":{"en":"Can the DOGE community and EACO ecosystem interact?","zh":"DOGE 社区与 EACO 生态能互通吗？","es":"¿Pueden interactuar la comunidad DOGE y el ecosistema EACO?","ar":"هل يمكن تفاعل مجتمع DOGE مع نظام EACO؟","fr":"La communauté DOGE et l'écosystème EACO peuvent-ils interagir ?","ru":"Могут ли сообщество DOGE и экосистема EACO взаимодействовать?"},"a":{"en":"If bridging lands, DOGE holders could use EACO ecosystem apps with wrapped DOGE. Communities may cross over, but the depth depends on each community's willingness.","zh":"若跨链顺利落地，DOGE 社区用户可通过持有包装 DOGE 使用 EACO 生态应用；品牌与社区存在交叉可能，但合作程度取决于双方意愿。","es":"Si el puente se concreta, los holders de DOGE podrían usar apps de EACO con DOGE envuelto. Puede haber cruce de comunidades, según la voluntad de cada una.","ar":"إذا نجح الربط، يمكن لحاملي DOGE استخدام تطبيقات نظام EACO عبر DOGE المغلّف. قد تتداخل المجتمعات، لكن العمق يعتمد على رغبة كل مجتمع.","fr":"Si le pont aboutit, les détenteurs de DOGE pourront utiliser les apps EACO avec du DOGE enveloppé. Les communautés peuvent se croiser, selon leur volonté respective.","ru":"При успешном мосте держатели DOGE смогут пользоваться приложениями экосистемы EACO с обёрнутым DOGE. Сообщества могут пересекаться — глубина зависит от их готовности."}},{"id":17,"cat":"relation","q":{"en":"What does bridging mean for DOGE holders?","zh":"跨链对 DOGE 持有者有什么意义？","es":"¿Qué significa el puente para los holders de DOGE?","ar":"ما أهمية الربط لحاملي DOGE؟","fr":"Que signifie le pont pour les détenteurs de DOGE ?","ru":"Что мост значит для держателей DOGE?"},"a":{"en":"Holders could access DeFi, DEX and other scenarios on Solana and BNB Chain without leaving the DOGE brand, unlocking use cases the native UTXO chain cannot directly offer.","zh":"持有者可在不离开 DOGE 品牌的前提下，接触 Solana 与 BNB Chain 上的 DeFi、DEX 等场景，解锁 UTXO 原链难以直接提供的新玩法。","es":"Podrían acceder a DeFi, DEX y otros escenarios en Solana y BNB Chain sin dejar la marca DOGE, desbloqueando usos que la cadena UTXO nativa no ofrece directamente.","ar":"يمكن لحاملي DOGE الوصول إلى التمويل اللامركزي والتبادلات اللامركزية وسيناريوهات أخرى على سولانا وسلسلة BNB دون مغادرة علامة DOGE، ما يفتح استخدامات لا توفرها السلسلة الأصلية مباشرة.","fr":"Ils pourraient accéder à DeFi, DEX et d'autres usages sur Solana et BNB Chain sans quitter la marque DOGE, débloquant des cas non offerts directement par la chaîne UTXO native.","ru":"Держатели получат доступ к DeFi, DEX и другим сценариям в Solana и BNB Chain, не покидая бренд DOGE, открывая варианты, которые нативная UTXO-цепь напрямую не даёт."}},{"id":18,"cat":"relation","q":{"en":"How does EACO times DOGE merge meme culture and utility?","zh":"EACO×DOGE 如何结合 Meme 文化？","es":"¿Cómo combinan EACO×DOGE cultura meme y utilidad?","ar":"كيف يجمع EACO×DOGE بين ثقافة الميم والقيمة العملية؟","fr":"Comment EACO×DOGE allient culture meme et utilité ?","ru":"Как EACO×DOGE сочетают мем-культуру и полезность?"},"a":{"en":"DOGE carries meme culture and attention; EACO explores infrastructure and use cases. Bridging aims to make a meme asset not just fun, but usable in DeFi, payments and more.","zh":"DOGE 承载 Meme 文化与流量，EACO 探索基础设施与场景落地。跨链希望让 Meme 资产不仅有趣，也能在 DeFi、支付等实际场景中被使用。","es":"DOGE aporta cultura meme y atención; EACO explora infraestructura y usos. El puente busca que el meme no solo sea divertido, sino útil en DeFi, pagos y más.","ar":"DOGE يحمل ثقافة الميم والاهتمام، وEACO يستكشف البنية التحتية وحالات الاستخدام. يهدف الربط إلى جعل أصل الميم مفيدًا في التمويل اللامركزي والمدفوعات وغيرها.","fr":"DOGE porte la culture meme et l'attention ; EACO explore infrastructure et usages. Le pont vise à rendre un actif meme utile en DeFi, paiements, etc., pas seulement amusant.","ru":"DOGE несёт мем-культуру и внимание; EACO исследует инфраструктуру и применение. Мост призван сделать мем-актив не только забавным, но и полезным в DeFi, платежах и другом."}},{"id":19,"cat":"relation","q":{"en":"Are there precedents for bridging DOGE?","zh":"跨链 DOGE 是否有先例？","es":"¿Hay precedentes de puentear DOGE?","ar":"هل هناك سوابق لربط DOGE؟","fr":"Y a-t-il des précédents de pont pour DOGE ?","ru":"Есть ли прецеденты моста для DOGE?"},"a":{"en":"Yes. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) is the pegged precedent on BNB Chain, while doge-spl (DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) is the SPL version on Solana — both are wrapped forms.","zh":"有。Binance-Peg DOGE（0xbA2aE424D960c26247Dd6c32edC70B295c744C43）即 DOGE 在 BNB Chain 上的锚定先例，doge-spl（DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R）则是 Solana 上的 SPL 版本，皆为包装形态。","es":"Sí. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) es el precedente anclado en BNB Chain, y doge-spl (DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) la versión SPL en Solana; ambos son formas envueltas.","ar":"نعم. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) سابقة مربوطة على سلسلة BNB، وdoge-spl (DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) نسخة SPL على سولانا؛ كلاهما شكل مغلّف.","fr":"Oui. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) est le précédent ancré sur BNB Chain, doge-spl (DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) la version SPL sur Solana ; deux formes enveloppées.","ru":"Да. Binance-Peg DOGE (0xbA2aE424D960c26247Dd6c32edC70B295c744C43) — привязанный прецедент в BNB Chain, а doge-spl (DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R) — версия SPL в Solana; обе — обёрнутые формы."}},{"id":20,"cat":"relation","q":{"en":"What forms might EACO-DOGE collaboration take?","zh":"未来 EACO 与 DOGE 有哪些合作形态？","es":"¿Qué formas podría tomar la colaboración EACO-DOGE?","ar":"ما أشكال التعاون المحتملة بين EACO وDOGE؟","fr":"Quelles formes la collaboration EACO-DOGE pourrait-elle prendre ?","ru":"Какие формы сотрудничества EACO и DOGE возможны?"},"a":{"en":"Possibilities include wrapped DOGE circulating in the ecosystem, DOGE as a payment method for apps, joint events and community campaigns — all research concepts pending community consensus.","zh":"可能包括包装 DOGE 在生态内流通、DOGE 作为生态应用支付手段、联合活动与社区联动等，均为研究设想，最终形态取决于社区共识与实施。","es":"Posibilidades: DOGE envuelto circulando en el ecosistema, DOGE como pago en aplicaciones, eventos conjuntos y campañas comunitarias — conceptos de estudio según consenso.","ar":"تشمل الاحتمالات تداول DOGE المغلّف داخل النظام، واستخدامه وسيلة دفع في التطبيقات، وفعاليات مشتركة وحملات مجتمعية — أفكار بحثية تعتمد على توافق المجتمع.","fr":"Possibilités : DOGE enveloppé circulant dans l'écosystème, DOGE comme moyen de paiement dans les apps, événements conjoints et campagnes communautaires — concepts d'étude selon consensus.","ru":"Возможны оборот обёрнутого DOGE в экосистеме, DOGE как средство оплаты в приложениях, совместные события и кампании сообществ — исследовательские концепции, зависящие от консенсуса."}},{"id":21,"cat":"relation","q":{"en":"Does bridging DOGE need smart contracts?","zh":"跨链 DOGE 需要智能合约吗？","es":"¿Puenterar DOGE requiere contratos inteligentes?","ar":"هل يحتاج ربط DOGE إلى عقود ذكية؟","fr":"Relier DOGE nécessite-t-il des contrats intelligents ?","ru":"Нужны ли смарт-контракты для моста DOGE?"},"a":{"en":"The native DOGE chain has no smart contracts, so wrapping requires custodial issuance on the target chain — pegged or SPL versions backed by custody and minting mechanisms.","zh":"原生 DOGE 链无智能合约，无法原生发行包装资产，因此需在目标链通过托管包装（如锚定或 SPL 版本）实现，由托管与铸造机制保障。","es":"La cadena nativa de DOGE no tiene contratos inteligentes, por lo que el wrapping exige emisión custodial en la cadena destino — versiones ancladas o SPL respaldadas por custodia y acuñación.","ar":"سلسلة DOGE الأصلية بلا عقود ذكية، لذا يتطلب التغليف إصدارًا بحفظ أمين على السلسلة المستهدفة، مثل النسخ المربوطة أو نسخ SPL المدعومة بآليات الحفظ والسك.","fr":"La chaîne native de DOGE n'a pas de contrats intelligents ; l'enveloppement exige donc une émission dépositaire sur la chaîne cible — versions ancrées ou SPL via custodie et mint.","ru":"Нативная сеть DOGE не имеет смарт-контрактов, поэтому обёртывание требует кастодиальной эмиссии в целевой сети — привязанных или SPL-версий с механизмами хранения и выпуска."}},{"id":22,"cat":"relation","q":{"en":"How deep is doge-spl's trading liquidity?","zh":"doge-spl 的交易深度如何？","es":"¿Qué profundidad tiene la liquidez de doge-spl?","ar":"ما عمق تداول doge-spl؟","fr":"Quelle est la profondeur du trading de doge-spl ?","ru":"Какова глубина торговли doge-spl?"},"a":{"en":"Liquidity can be checked on data platforms such as OrbMarkets (https://orbmarkets.io). Depth changes with market making and participation — always verify current liquidity before trading.","zh":"流动性可经 OrbMarkets 等数据平台查看（https://orbmarkets.io）；交易深度随做市与参与情况变化，交易前请自行核实当前流动性状态。","es":"La liquidez puede consultarse en plataformas como OrbMarkets (https://orbmarkets.io). La profundidad varía con el market making; verifícala antes de operar.","ar":"يمكن الاطلاع على السيولة عبر OrbMarkets (https://orbmarkets.io)، ويتغير العمق مع صناعة السوق والمشاركة؛ تحقق من السيولة الحالية قبل التداول.","fr":"La liquidité est consultable sur OrbMarkets (https://orbmarkets.io). La profondeur varie selon le market making et la participation ; vérifiez-la avant de trader.","ru":"Ликвидность можно проверить на OrbMarkets (https://orbmarkets.io). Глубина меняется вместе с маркет-мейкингом и участием — проверяйте её перед торговлей."}},{"id":23,"cat":"relation","q":{"en":"How do EACO holders benefit from the DOGE bridge?","zh":"EACO 持有者如何从 DOGE 跨链受益？","es":"¿Cómo se benefician los holders de EACO del puente DOGE?","ar":"كيف يستفيد حاملو EACO من ربط DOGE؟","fr":"Comment les détenteurs d'EACO profitent-ils du pont DOGE ?","ru":"Как держатели EACO выигрывают от моста DOGE?"},"a":{"en":"If realized, the EACO ecosystem could gain DOGE's brand attention and a wider user base, potentially boosting use cases and liquidity — but outcomes depend on implementation.","zh":"若落地，EACO 生态将获得 DOGE 的品牌流量与更广用户基础，应用场景与流动性或随之增加；但收益取决于实施效果，请理性看待。","es":"De concretarse, el ecosistema EACO ganaría atención de marca DOGE y más usuarios, potenciando casos de uso y liquidez — según la implementación.","ar":"إذا تحقّق، قد يكتسب نظام EACO اهتمام علامة DOGE وقاعدة مستخدمين أوسع، ما يعزز حالات الاستخدام والسيولة، لكن النتائج تعتمد على التنفيذ.","fr":"S'il aboutit, l'écosystème EACO gagnerait la notoriété DOGE et plus d'utilisateurs, boostant usages et liquidité — selon la mise en œuvre.","ru":"При реализации экосистема EACO получит внимание бренда DOGE и более широкую базу пользователей, что может усилить применение и ликвидность — результат зависит от исполнения."}},{"id":24,"cat":"relation","q":{"en":"Is this exploration an official project?","zh":"这个探索项目是官方项目吗？","es":"¿Este proyecto de exploración es oficial?","ar":"هل هذا المشروع رسمي؟","fr":"Ce projet d'exploration est-il officiel ?","ru":"Официальный ли это исследовательский проект?"},"a":{"en":"No. This content is community research exploration, not investment advice; the plans do not represent DOGE's official team or exchanges. Digital assets are risky; verify all addresses and status yourself.","zh":"不是。本内容为社区研究探索，非投资建议，不代表 DOGE 官方或交易所立场；数字资产有风险，请自行核实合约地址与项目状态。","es":"No. Este contenido es investigación comunitaria, no asesoramiento financiero; los planes no representan al equipo oficial de DOGE ni a exchanges. Verifica direcciones y estado del proyecto.","ar":"لا. هذا المحتوى بحث مجتمعي وليس نصيحة استثمارية؛ لا تمثل الخطط فريق DOGE الرسمي أو منصات التداول. الأصول الرقمية محفوفة بالمخاطر؛ تحقق من العناوين والحالة بنفسك.","fr":"Non. Ce contenu est une recherche communautaire, pas un conseil en investissement ; les plans ne représentent ni l'équipe officielle de DOGE ni les exchanges. Vérifiez vous-même adresses et statut.","ru":"Нет. Этот контент — исследование сообщества, а не инвестиционный совет; планы не отражают позицию официальной команды DOGE или бирж. Проверяйте адреса и статус проекта самостоятельно."}},{"id":25,"cat":"relation","q":{"en":"Where should newcomers start with this project?","zh":"初看该项目应从哪里入手？","es":"¿Por dónde empezar a conocer este proyecto?","ar":"من أين يبدأ المبتدئ بالتعرف على هذا المشروع؟","fr":"Par où commencer pour comprendre ce projet ?","ru":"С чего начать знакомство с проектом?"},"a":{"en":"Start by verifying contract addresses and learning the three chains (Solana, BNB Chain, DOGE). Then check data on OrbMarkets, https://oklink.com or CoinGecko, and assess rationally per the disclaimer.","zh":"建议先核对合约地址、理解三条链（Solana、BNB Chain、DOGE）的概念，再看 https://oklink.com、OrbMarkets 等数据，最后回到免责口径理性评估。","es":"Primero verifica direcciones de contrato y aprende las tres cadenas (Solana, BNB Chain, DOGE); luego consulta datos en OrbMarkets, https://oklink.com o CoinGecko y evalúa racionalmente según el aviso legal.","ar":"ابدأ بالتحقق من معرّفات العقود وفهم السلاسل الثلاث (سولانا وسلسلة BNB وDOGE)، ثم راجع البيانات على OrbMarkets وhttps://oklink.com وCoinGecko، وأخيرًا قيّم بعقلانية وفق إخلاء المسؤولية.","fr":"Vérifiez d'abord les adresses de contrats et apprenez les trois chaînes (Solana, BNB Chain, DOGE) ; consultez OrbMarkets, https://oklink.com ou CoinGecko, puis évaluez selon la clause de non-responsabilité.","ru":"Начните со сверки адресов контрактов и изучения трёх сетей (Solana, BNB Chain, DOGE), затем посмотрите данные на OrbMarkets, https://oklink.com или CoinGecko и трезво оцените с учётом дисклеймера."}},{"id":26,"cat":"address","q":{"en":"How do I verify EACO's contract address?","zh":"如何验证 EACO 的合约地址？","es":"¿Cómo verifico la dirección del contrato de EACO?","ar":"كيف أتحقق من عنوان عقد EACO؟","fr":"Comment vérifier l'adresse du contrat d'EACO ?","ru":"Как проверить адрес контракта EACO?"},"a":{"en":"EACO's contract address is DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Verify it on orbmarkets.io or a Solana explorer; rely on official sources.","zh":"EACO 合约地址：DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH，可在 orbmarkets.io 或 Solana 浏览器核对，以官方公布为准。","es":"La dirección del contrato (CA) de EACO es DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Puede verificarla en orbmarkets.io o en un explorador de Solana y confiar en fuentes oficiales.","ar":"عنوان عقد EACO هو DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. يمكن التحقق منه عبر orbmarkets.io أو مستكشف سولانا، مع الاعتماد على المعلومات المنشورة عبر القنوات الرسمية.","fr":"L'adresse du contrat (CA) d'EACO est DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Vérifiez-la sur orbmarkets.io ou un explorateur Solana et fiez-vous aux sources officielles.","ru":"Адрес контракта EACO — DqfoyZH96RnvZusSp3Cdncjpyp3C74ZmJzGhjmHnDHRH. Проверьте его на orbmarkets.io или в обозревателе Solana и опирайтесь на официальные источники."}},{"id":27,"cat":"address","q":{"en":"How do I verify the doge-spl contract address?","zh":"如何验证 doge-spl 的合约地址？","es":"¿Cómo verifico la dirección del contrato de doge-spl?","ar":"كيف أتحقق من عنوان عقد doge-spl؟","fr":"Comment vérifier l'adresse du contrat de doge-spl ?","ru":"Как проверить адрес контракта doge-spl?"},"a":{"en":"doge-spl is the SPL version of DOGE on Solana, not the native Dogecoin chain. CA: DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R; verify on orbmarkets.io.","zh":"doge-spl 是 DOGE 在 Solana 的 SPL 版（非狗狗币原生链），CA：DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R，可在 orbmarkets.io 核实。","es":"doge-spl es la versión SPL de DOGE en Solana, no la cadena nativa de Dogecoin. Su CA es DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R; verifíquelo en orbmarkets.io.","ar":"doge-spl هو إصدار SPL من DOGE على سولانا وليس شبكة الدوجكوين الأصلية. عنوانه DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R ويمكن التحقق منه عبر orbmarkets.io.","fr":"doge-spl est la version SPL de DOGE sur Solana, et non la chaîne native de Dogecoin. Son CA est DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R ; vérifiez-le sur orbmarkets.io.","ru":"doge-spl — это SPL-версия DOGE на Solana, а не нативная сеть Dogecoin. Его адрес — DoGEV7LASBkQbibMc5k5vKnTZoMg423GpJ5QtJEGfm7R; проверьте его на orbmarkets.io."}},{"id":28,"cat":"address","q":{"en":"How do I verify the Binance-Peg DOGE address?","zh":"如何验证 Binance-Peg DOGE 的地址？","es":"¿Cómo verifico la dirección de Binance-Peg DOGE?","ar":"كيف أتحقق من عنوان Binance-Peg DOGE؟","fr":"Comment vérifier l'adresse de Binance-Peg DOGE ?","ru":"Как проверить адрес Binance-Peg DOGE?"},"a":{"en":"Binance-Peg DOGE is Binance's pegged version of DOGE on BNB Chain. Address: 0xbA2aE424D960c26247Dd6c32edC70B295c744C43; verify on oklink.com.","zh":"Binance-Peg DOGE 是 DOGE 在 BNB Chain 的币安锚定版，地址：0xbA2aE424D960c26247Dd6c32edC70B295c744C43，可在 oklink.com 核实。","es":"Binance-Peg DOGE es la versión anclada de DOGE en BNB Chain. Su dirección es 0xbA2aE424D960c26247Dd6c32edC70B295c744C43; verifíquela en el explorador BSC de oklink.com.","ar":"Binance-Peg DOGE هو الإصدار الموثق من DOGE على شبكة BNB. عنوانه 0xbA2aE424D960c26247Dd6c32edC70B295c744C43 ويمكن التحقق منه عبر مستكشف BSC في oklink.com.","fr":"Binance-Peg DOGE est la version adossée de DOGE émise par Binance sur BNB Chain. Son adresse est 0xbA2aE424D960c26247Dd6c32edC70B295c744C43 ; vérifiez-la sur l'explorateur BSC d'oklink.com.","ru":"Binance-Peg DOGE — это привязанная версия DOGE от Binance в BNB Chain. Его адрес — 0xbA2aE424D960c26247Dd6c32edC70B295c744C43; проверьте его в обозревателе BSC на oklink.com."}},{"id":29,"cat":"address","q":{"en":"What is a mint address?","zh":"什么是铸币地址（mint address）？","es":"¿Qué es una dirección de mint (moneda)?","ar":"ما هو عنوان الصك (mint address)؟","fr":"Qu'est-ce qu'une adresse de mint ?","ru":"Что такое адрес эмиссии (mint address)?"},"a":{"en":"A mint address identifies a token: on Solana, every SPL token has a unique mint used to define and mint the token. EACO's mint is its CA.","zh":"铸币地址（mint address）是代币的标识地址，在 Solana 上每个 SPL 代币都有唯一的 mint，用于定义与铸造该代币，如 EACO 的 mint 即其 CA。","es":"La dirección mint identifica un token: en Solana, cada token SPL tiene un mint único que lo define y acuña. El mint de EACO es su CA.","ar":"عنوان الصك يحدد هوية العملة؛ في سولانا لكل عملة SPL عنوان صك فريد لتعريفها وسكّها. عنوان صك EACO هو CA الخاص به.","fr":"Une adresse de mint identifie un token : sur Solana, chaque token SPL possède un mint unique qui le définit et le frappe. Le mint d'EACO est son CA.","ru":"Адрес эмиссии (mint) идентифицирует токен: в Solana у каждого SPL-токена есть уникальный mint, определяющий и выпускающий его. Mint EACO — это его CA."}},{"id":30,"cat":"address","q":{"en":"What can I look up on OrbMarkets?","zh":"在 OrbMarkets 上可以查到什么？","es":"¿Qué puedo consultar en OrbMarkets?","ar":"ماذا يمكنني الاطلاع عليه في OrbMarkets؟","fr":"Que peut-on consulter sur OrbMarkets ?","ru":"Что можно узнать на OrbMarkets?"},"a":{"en":"OrbMarkets helps verify Solana token liquidity, addresses and related data. You can check the CA and on-chain information of assets such as EACO and doge-spl; it is one of our main tools.","zh":"OrbMarkets 用于核实 Solana 代币的流动性、地址与相关信息，可查验 EACO、doge-spl 等资产的 CA 与链上数据，是本研究的主要核实工具之一。","es":"OrbMarkets permite verificar liquidez, direcciones e información de tokens de Solana. Puede revisar el CA y los datos on-chain de activos como EACO y doge-spl; es una de nuestras herramientas principales.","ar":"يتيح OrbMarkets التحقق من سيولة عناوين ومعلومات عملات سولانا، وفحص CA والبيانات على السلسلة لأصول مثل EACO وdoge-spl؛ وهو أحد أدواتنا الرئيسية.","fr":"OrbMarkets permet de vérifier la liquidité, les adresses et les données des tokens Solana. Vous pouvez y contrôler le CA et les données on-chain d'EACO et de doge-spl ; c'est l'un de nos outils principaux.","ru":"OrbMarkets позволяет проверять ликвидность, адреса и данные токенов Solana. Там можно сверить CA и ончейн-данные активов вроде EACO и doge-spl; это один из наших основных инструментов."}},{"id":31,"cat":"address","q":{"en":"What can OKLink do?","zh":"OKLink 可以做什么？","es":"¿Qué puede hacer OKLink?","ar":"ماذا يمكن أن يفعل OKLink؟","fr":"Que peut faire OKLink ?","ru":"Что умеет OKLink?"},"a":{"en":"OKLink is a multi-chain explorer covering BSC, Solana and more. You can look up addresses, transactions and token data, such as verifying Binance-Peg DOGE and its pegging details on its BSC explorer.","zh":"OKLink 是多链浏览器，可查 BSC、Solana 等多条链的地址、交易与代币信息，例如用其 BSC 浏览器核实 Binance-Peg DOGE 的地址与锚定信息。","es":"OKLink es un explorador multicadena que cubre BSC, Solana y más. Permite consultar direcciones, transacciones y datos de tokens, como verificar Binance-Peg DOGE y su anclaje en su explorador BSC.","ar":"OKLink مستكشف متعدد السلاسل يشمل BSC وسولانا وغيرهما، لعرض العناوين والمعاملات والبيانات، مثل التحقق من Binance-Peg DOGE ومعلومات الربط في مستكشف BSC.","fr":"OKLink est un explorateur multi-chaînes couvrant BSC, Solana et plus. On y consulte adresses, transactions et données de tokens, par exemple vérifier Binance-Peg DOGE et son ancrage via son explorateur BSC.","ru":"OKLink — мультичейн-обозреватель, охватывающий BSC, Solana и другие сети. Там можно проверять адреса, транзакции и данные токенов, например сверять Binance-Peg DOGE и данные его привязки в обозревателе BSC."}},{"id":32,"cat":"address","q":{"en":"What is the difference between Solana base58 and Ethereum 0x addresses?","zh":"Solana base58 与以太坊 0x 地址有何区别？","es":"¿Cuál es la diferencia entre direcciones base58 de Solana y direcciones 0x de Ethereum?","ar":"ما الفرق بين عناوين سولانا base58 وعناوين إيثريوم 0x؟","fr":"Quelle est la différence entre les adresses base58 de Solana et les adresses 0x d'Ethereum ?","ru":"В чём разница между base58-адресами Solana и 0x-адресами Ethereum?"},"a":{"en":"Solana addresses use base58 alphanumeric characters without a 0x prefix (like EACO's CA), while Ethereum-style addresses are hexadecimal and start with 0x. The two formats differ and are not interchangeable.","zh":"Solana 地址由 base58 字母数字组成、无 0x 前缀（如 EACO 的 CA）；以太坊系地址为 0x 开头的十六进制。两者格式不同，不能互换使用。","es":"Las direcciones de Solana usan caracteres base58 sin prefijo 0x (como el CA de EACO), mientras que las de estilo Ethereum son hexadecimales y empiezan con 0x. Son formatos distintos y no intercambiables.","ar":"عناوين سولانا تتكون من رموز base58 دون بادئة 0x (مثل عنوان EACO)، بينما عناوين نمط إيثريوم سداسية عشرية تبدأ بـ0x. الصيغتان مختلفتان ولا تُستخدمان بالتبادل.","fr":"Les adresses Solana utilisent des caractères base58 sans préfixe 0x (comme le CA d'EACO), tandis que les adresses de type Ethereum sont hexadécimales et commencent par 0x. Les formats diffèrent et ne sont pas interchangeables.","ru":"Адреса Solana состоят из буквенно-цифровых символов base58 без префикса 0x (как CA у EACO), а адреса в стиле Ethereum — шестнадцатеричные и начинаются с 0x. Форматы разные и не взаимозаменяемы."}},{"id":33,"cat":"address","q":{"en":"How do I avoid copy-paste address errors?","zh":"如何防止复制粘贴地址出错？","es":"¿Cómo evito errores al copiar y pegar direcciones?","ar":"كيف أتجنب أخطاء نسخ ولصق العناوين؟","fr":"Comment éviter les erreurs de copier-coller d'adresses ?","ru":"Как избежать ошибок при копировании адресов?"},"a":{"en":"Always copy the full address instead of typing it manually. Check the first and last characters, double-check with orbmarkets.io, oklink.com or official channels, and confirm once before sending.","zh":"始终整体复制地址而非手输；核对开头与结尾若干字符，并用 orbmarkets.io、oklink.com 或官方渠道二次校验，转账前再确认一次。","es":"Copie siempre la dirección completa en lugar de escribirla. Revise los primeros y últimos caracteres, compruébela con orbmarkets.io, oklink.com o canales oficiales, y confirme antes de enviar.","ar":"انسخ العنوان كاملاً بدلاً من كتابته يدوياً، وتأكد من الأحرف الأولى والأخيرة، وتحقق عبر orbmarkets.io أو oklink.com أو القنوات الرسمية، ثم أكّد قبل الإرسال.","fr":"Copiez toujours l'adresse entière plutôt que de la saisir. Vérifiez les premiers et derniers caractères, croisez avec orbmarkets.io, oklink.com ou des canaux officiels, et confirmez avant l'envoi.","ru":"Всегда копируйте адрес целиком, а не вводите вручную. Сверяйте первые и последние символы, проверяйте через orbmarkets.io, oklink.com или официальные каналы и подтверждайте перед отправкой."}},{"id":34,"cat":"address","q":{"en":"What if I receive a fake DOGE?","zh":"收到「假 DOGE」怎么办？","es":"¿Qué hago si recibo un DOGE falso?","ar":"ماذا أفعل إذا استلمت DOGE مزيّفاً؟","fr":"Que faire si je reçois un faux DOGE ?","ru":"Что делать, если я получил поддельный DOGE?"},"a":{"en":"If you receive an unknown token, first check whether its CA matches the officially published one (see the entries for doge-spl and Binance-Peg DOGE). If unsure, do not transfer or approve, and rely on official announcements.","zh":"收到来历不明的代币时，先核对其 CA 是否为官方公布地址（doge-spl、Binance-Peg DOGE 的 CA 见对应条目）；不确定时不转出、不授权，并以官方公告为准。","es":"Si recibe un token desconocido, verifique que su CA coincida con el oficial (vea las entradas de doge-spl y Binance-Peg DOGE). Si duda, no transfiera ni apruebe nada y atenga a los anuncios oficiales.","ar":"عند استلام عملة مجهولة المصدر، تحقق أولاً من أن CA الخاص بها يطابق العنوان الرسمي (انظر إدخالات doge-spl وBinance-Peg DOGE). في حال الشك لا تحوّل ولا تمنح أذونات، واعتمد على الإعلانات الرسمية.","fr":"En recevant un token inconnu, vérifiez que son CA correspond bien à l'adresse officielle (voir les entrées doge-spl et Binance-Peg DOGE). En cas de doute, ne transférez ni n'approuvez rien et fiez-vous aux annonces officielles.","ru":"Получив неизвестный токен, сначала сверьте его CA с официальным адресом (см. записи про doge-spl и Binance-Peg DOGE). При сомнениях не переводите и не одобряйте ничего, ориентируйтесь на официальные объявления."}},{"id":35,"cat":"address","q":{"en":"Why does DOGE on Solana have an alphanumeric address?","zh":"为什么 Solana 上 DOGE 的地址是字母数字串？","es":"¿Por qué la dirección de DOGE en Solana es alfanumérica?","ar":"لماذا يكون عنوان DOGE على سولانا أرقاماً وحروفاً؟","fr":"Pourquoi l'adresse du DOGE sur Solana est-elle alphanumérique ?","ru":"Почему адрес DOGE в Solana состоит из букв и цифр?"},"a":{"en":"Solana generates addresses using base58 encoding, so they consist of upper/lowercase letters and digits without a 0x prefix. doge-spl is such an SPL version on Solana.","zh":"因为 Solana 使用 base58 编码生成地址，由大小写字母与数字组成、无 0x 前缀。doge-spl 就是在 Solana 上的此类 SPL 版本。","es":"Solana genera direcciones con codificación base58, formadas por letras mayúsculas/minúsculas y dígitos, sin prefijo 0x. doge-spl es esa versión SPL en Solana.","ar":"لأن سولانا تولّد العناوين بترميز base58، فتُكوَّن من حروف كبيرة وصغيرة وأرقام دون بادئة 0x. وdoge-spl هو هذا الإصدار SPL على سولانا.","fr":"Solana génère ses adresses avec l'encodage base58 : des lettres majuscules/minuscules et des chiffres, sans préfixe 0x. doge-spl est cette version SPL sur Solana.","ru":"Потому что Solana генерирует адреса кодировкой base58: из заглавных и строчных букв и цифр, без префикса 0x. doge-spl — это такая SPL-версия в Solana."}},{"id":36,"cat":"address","q":{"en":"Why do BSC addresses start with 0x?","zh":"为什么 BSC 上地址以 0x 开头？","es":"¿Por qué las direcciones de BSC empiezan con 0x?","ar":"لماذا تبدأ عناوين BSC بـ0x؟","fr":"Pourquoi les adresses BSC commencent-elles par 0x ?","ru":"Почему адреса BSC начинаются с 0x?"},"a":{"en":"BSC is compatible with the Ethereum Virtual Machine (EVM), so addresses are hexadecimal and start with 0x, like Binance-Peg DOGE: 0xbA2aE424D960c26247Dd6c32edC70B295c744C43.","zh":"BSC 兼容以太坊虚拟机（EVM），地址为十六进制并以 0x 开头，如 Binance-Peg DOGE：0xbA2aE424D960c26247Dd6c32edC70B295c744C43。","es":"BSC es compatible con la máquina virtual de Ethereum (EVM); las direcciones son hexadecimales y empiezan con 0x, como Binance-Peg DOGE: 0xbA2aE424D960c26247Dd6c32edC70B295c744C43.","ar":"لأن BSC متوافقة مع آلة إيثريوم الافتراضية (EVM)، فالعناوين سداسية عشرية تبدأ بـ0x، مثل عنوان Binance-Peg DOGE: 0xbA2aE424D960c26247Dd6c32edC70B295c744C43.","fr":"BSC est compatible avec la machine virtuelle Ethereum (EVM) : les adresses sont hexadécimales et commencent par 0x, comme Binance-Peg DOGE : 0xbA2aE424D960c26247Dd6c32edC70B295c744C43.","ru":"BSC совместима с виртуальной машиной Ethereum (EVM), поэтому адреса шестнадцатеричные и начинаются с 0x, как у Binance-Peg DOGE: 0xbA2aE424D960c26247Dd6c32edC70B295c744C43."}},{"id":37,"cat":"address","q":{"en":"What is an SPL mint?","zh":"什么是 SPL mint？","es":"¿Qué es un mint SPL?","ar":"ما هو عنوان صك SPL؟","fr":"Qu'est-ce qu'un mint SPL ?","ru":"Что такое SPL mint?"},"a":{"en":"An SPL mint is the address that defines a token under the SPL Token standard on Solana; each token maps to one mint. Both EACO and doge-spl are SPL mints on Solana.","zh":"SPL mint 是 Solana 上按 SPL Token 标准定义代币的铸币地址，一个代币对应一个 mint。EACO 与 doge-spl 均为 Solana 上的 SPL mint。","es":"Un mint SPL es la dirección que define un token según el estándar SPL de Solana; cada token tiene un mint. EACO y doge-spl son mints SPL en Solana.","ar":"عنوان صك SPL هو العنوان الذي يحدد العملة وفق معيار SPL على سولانا، وتقابل كل عملة صك واحد. EACO وdoge-spl كلاهما صكوك SPL على سولانا.","fr":"Un mint SPL est l'adresse qui définit un token selon le standard SPL de Solana ; chaque token correspond à un mint. EACO et doge-spl sont des mints SPL sur Solana.","ru":"SPL mint — это адрес, определяющий токен по стандарту SPL в Solana; каждому токену соответствует один mint. EACO и doge-spl — это SPL-токены с mint в Solana."}},{"id":38,"cat":"address","q":{"en":"Is CA the same as an account address?","zh":"CA 不等于账户地址？","es":"¿El CA es igual a la dirección de cuenta?","ar":"هل CA هو نفسه عنوان الحساب؟","fr":"Le CA est-il identique à une adresse de compte ?","ru":"Совпадает ли CA с адресом аккаунта?"},"a":{"en":"No. CA (contract/mint address) identifies the token itself; an account address holds tokens. Use the account address to receive transfers, and check the CA against the official one to verify an asset.","zh":"CA（合约/mint 地址）标识代币本身，账户地址是持有代币的地址。转账需填账户地址，核实资产真假则要看 CA 是否与官方一致。","es":"No. El CA identifica el token en sí; la dirección de cuenta mantiene los tokens. Use la de cuenta para recibir transferencias y compare el CA con el oficial para verificar un activo.","ar":"لا. عنوان العقار (CA) يحدد العملة نفسها، بينما عنوان الحساب هو ما يحتفظ بالعملات. استخدم عنوان الحساب لاستلام التحويلات، وقارن CA بالعنوان الرسمي للتحقق من الأصل.","fr":"Non. Le CA (adresse de contrat/mint) identifie le token lui-même ; un compte détient les tokens. Utilisez l'adresse de compte pour recevoir des transferts et vérifiez le CA par rapport à l'officiel.","ru":"Нет. CA (адрес контракта/mint) идентифицирует сам токен, а адрес аккаунта — это кошелёк, где токены хранятся. Для получения переводов используйте адрес аккаунта, а для проверки актива сверяйте CA с официальным."}},{"id":39,"cat":"address","q":{"en":"Who controls the addresses of wrapped cross-chain tokens?","zh":"跨链包装代币的地址由谁控制？","es":"¿Quién controla las direcciones de los tokens envueltos entre cadenas?","ar":"من يتحكم في عناوين العملات المعبأة عبر السلاسل؟","fr":"Qui contrôle les adresses des tokens enveloppés inter-chaînes ?","ru":"Кто контролирует адреса обёрнутых кроссчейн-токенов?"},"a":{"en":"The mint/contract addresses of wrapped cross-chain tokens (like doge-spl and Binance-Peg DOGE) are deployed and controlled by their issuers and custodians. Always verify addresses against official sources.","zh":"跨链包装代币（如 doge-spl、Binance-Peg DOGE）的 mint/合约地址由相应发行与托管方部署控制，用户应按官方公布的地址信息核实，避免误用。","es":"Las direcciones de mint/contrato de los tokens envueltos (como doge-spl y Binance-Peg DOGE) las despliegan y controlan sus emisores y custodios. Verifique siempre con fuentes oficiales.","ar":"عناوين الصك/العقد للعملات المعبأة (مثل doge-spl وBinance-Peg DOGE) تُنشر وتُدار من قِبل جهات الإصدار والحفظ. تحقق دائماً من العناوين عبر المصادر الرسمية.","fr":"Les adresses de mint/contrat des tokens enveloppés (comme doge-spl et Binance-Peg DOGE) sont déployées et contrôlées par leurs émetteurs et dépositaires. Vérifiez toujours les adresses via des sources officielles.","ru":"Адреса mint/контрактов обёрнутых токенов (например, doge-spl и Binance-Peg DOGE) разворачивают и контролируют их эмитенты и кастодианы. Всегда сверяйте адреса с официальными источниками."}},{"id":40,"cat":"address","q":{"en":"How do I confirm a cross-chain token is pegged 1:1?","zh":"如何确认跨链代币是 1:1 锚定？","es":"¿Cómo confirmo que un token entre cadenas está anclado 1:1?","ar":"كيف أتأكد من ربط العملة عبر السلاسل بنسبة ١:١؟","fr":"Comment confirmer qu'un token inter-chaînes est adossé à 1:1 ?","ru":"Как убедиться, что кроссчейн-токен привязан 1:1?"},"a":{"en":"Check the issuer's published pegging mechanism and reserve information, and use tools like OKLink and OrbMarkets to verify addresses and supply data. This is research; rely on official statements for pegging details.","zh":"通过发行方公布的锚定机制与储备信息核验，并使用 OKLink、OrbMarkets 等工具核对地址与流通数据。研究探索性质，具体锚定以官方说明为准。","es":"Revise el mecanismo de anclaje y las reservas publicadas por el emisor, y use herramientas como OKLink y OrbMarkets para verificar direcciones y suministro. Es un estudio exploratorio; atenga a la información oficial.","ar":"تحقق من آلية الربط واحتياطيات الإصدار المنشورة، واستخدم أدوات مثل OKLink وOrbMarkets للتحقق من العناوين والبيانات. هذا استكشاف بحثي؛ تفاصيل الربط وفق الإعلانات الرسمية.","fr":"Vérifiez le mécanisme d'ancrage et les réserves publiés par l'émetteur, et utilisez des outils comme OKLink et OrbMarkets pour contrôler adresses et données. Recherche exploratoire ; référez-vous aux annonces officielles.","ru":"Проверьте опубликованный эмитентом механизм привязки и резервы, а также сверьте адреса и данные через OKLink и OrbMarkets. Это исследование; детали привязки — по официальным заявлениям."}},{"id":41,"cat":"carrier","q":{"en":"What is a carrier asset and what does it do?","zh":"什么是载体资产，它有什么作用？","es":"¿Qué es un activo portador y qué hace?","ar":"ما هو الأصل الحامل للقيمة وما دوره؟","fr":"Qu'est-ce qu'un actif porteur et quel est son rôle ?","ru":"Что такое актив-носитель и какова его роль?"},"a":{"en":"A carrier asset is an intermediate asset that carries and transfers value across chains, such as SOL or wBNB, representing the corresponding asset's value on the destination chain.","zh":"载体资产是跨链转移中用来承载和传递价值的中间资产，例如 SOL、wBNB 等，在目标链上代表并对应相应资产的价值。","es":"Un activo portador es un activo intermedio que transporta valor entre cadenas, como SOL o wBNB, representando el valor del activo correspondiente en la cadena de destino.","ar":"الأصل الحامل هو أصل وسيط ينقل القيمة بين السلاسل، مثل SOL أو wBNB، ويمثل قيمة الأصل المقابل على السلسلة الوجهة.","fr":"Un actif porteur est un actif intermédiaire qui transporte de la valeur entre chaînes, comme SOL ou wBNB, représentant la valeur de l'actif correspondant sur la chaîne de destination.","ru":"Актив-носитель — это промежуточный актив, переносящий ценность между сетями, например SOL или wBNB; в целевой сети он представляет ценность соответствующего актива."}},{"id":42,"cat":"carrier","q":{"en":"Why use SOL as a carrier?","zh":"为什么用 SOL 作载体？","es":"¿Por qué usar SOL como portador?","ar":"لماذا يُستخدم SOL كأصل حامل؟","fr":"Pourquoi utiliser SOL comme actif porteur ?","ru":"Почему SOL используется как носитель?"},"a":{"en":"SOL is Solana's native asset with high liquidity and ecosystem support. As a carrier in and out of Solana, it is more direct and reduces bridging complexity.","zh":"SOL 是 Solana 的原生资产，流动性和生态支持高；在出入 Solana 的跨链路径中，以 SOL 作载体更直接，可降低桥接复杂度。","es":"SOL es el activo nativo de Solana con alta liquidez y soporte del ecosistema. Como portador hacia y desde Solana es más directo y reduce la complejidad de puentes.","ar":"لأن SOL هو الأصل الأصلي لسولانا وبسيولة ودعم بيئي عاليين؛ فاستخدامه كأصل حامل للدخول والخروج من سولانا أكثر مباشرة ويقلل تعقيد الجسور.","fr":"SOL est l'actif natif de Solana, avec une forte liquidité et un écosystème solide. Comme porteur pour entrer et sortir de Solana, c'est plus direct et cela réduit la complexité des ponts.","ru":"SOL — нативный актив Solana с высокой ликвидностью и поддержкой экосистемы. Как носитель для входов и выходов из Solana он более прямолинеен и снижает сложность мостов."}},{"id":43,"cat":"carrier","q":{"en":"Why use wBNB as a carrier?","zh":"为什么要用 wBNB 作载体？","es":"¿Por qué usar wBNB como portador?","ar":"لماذا يُستخدم wBNB كأصل حامل؟","fr":"Pourquoi utiliser wBNB comme actif porteur ?","ru":"Зачем использовать wBNB как носитель?"},"a":{"en":"wBNB is the standard wrapped asset representing BNB on BNB Chain. It provides BNB's native wrapped form for the BSC ecosystem and suits BSC-side cross-chain paths as a carrier.","zh":"wBNB 是 BNB Chain 上代表 BNB 的标准封装资产，为 BSC 生态提供 BNB 的原生封装形式，适合作为 BSC 侧出入跨链路径的载体资产。","es":"wBNB es el activo envuelto estándar que representa a BNB en BNB Chain. Ofrece la forma envuelta nativa de BNB para el ecosistema BSC y sirve como portador en rutas BSC.","ar":"wBNB هو الأصل المعبأ القياسي الذي يمثل BNB على شبكة BNB، ويقدم الشكل المعبأ الأصلي لـBNB ضمن نظام BSC، ويناسب كأصل حامل للمسارات عبر BSC.","fr":"wBNB est l'actif enveloppé standard représentant BNB sur BNB Chain. Il offre la forme enveloppée native de BNB pour l'écosystème BSC et convient comme porteur sur les routes côté BSC.","ru":"wBNB — стандартный обёрнутый актив, представляющий BNB в BNB Chain. Он даёт нативную обёрнутую форму BNB для экосистемы BSC и подходит как носитель на маршрутах со стороны BSC."}},{"id":44,"cat":"carrier","q":{"en":"What role does wETH play in cross-chain transfers?","zh":"wETH 在跨链中扮演什么角色？","es":"¿Qué papel juega wETH en los cruces entre cadenas?","ar":"ما دور wETH في العمليات عبر السلاسل؟","fr":"Quel rôle joue wETH dans les transferts inter-chaînes ?","ru":"Какую роль играет wETH в кроссчейне?"},"a":{"en":"wETH is the standard wrapped asset representing ETH on Ethereum. It can serve as a carrier in Ethereum-ecosystem cross-chain paths, helping transfer ETH value between chains.","zh":"wETH 是以太坊上代表 ETH 的标准封装资产，可作为以太坊生态跨链路径中的载体资产，帮助在各链之间传递 ETH 的价值。","es":"wETH es el activo envuelto estándar que representa a ETH en Ethereum. Puede actuar como portador en rutas del ecosistema Ethereum y transferir el valor de ETH entre cadenas.","ar":"wETH هو الأصل المعبأ القياسي الذي يمثل ETH على إيثريوم، ويمكن استخدامه كأصل حامل في مسارات نظام إيثريوم للمساعدة في نقل قيمة ETH بين السلاسل.","fr":"wETH est l'actif enveloppé standard représentant ETH sur Ethereum. Il peut servir de porteur sur les routes de l'écosystème Ethereum et transférer la valeur d'ETH entre chaînes.","ru":"wETH — стандартный обёрнутый актив, представляющий ETH в Ethereum. Он может служить носителем на маршрутах экосистемы Ethereum, помогая переносить ценность ETH между сетями."}},{"id":45,"cat":"carrier","q":{"en":"Why is wBTC important in cross-chain?","zh":"为什么 wBTC 在跨链中很重要？","es":"¿Por qué es importante wBTC en los cruces entre cadenas?","ar":"لماذا يهم wBTC في العمليات عبر السلاسل؟","fr":"Pourquoi wBTC est-il important dans les transferts inter-chaînes ?","ru":"Почему wBTC важен в кроссчейне?"},"a":{"en":"wBTC is a wrapped form of Bitcoin on-chain. In this research, Wrapped BTC (Wormhole) on Solana has mint 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh, letting BTC's value participate in cross-chain operations on other chains.","zh":"wBTC 是比特币的链上包装形式；本研究中的 Wrapped BTC (Wormhole)（mint 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh）位于 Solana，便于 BTC 价值参与跨链操作。","es":"wBTC es la forma envuelta de Bitcoin en cadena. En este estudio, Wrapped BTC (Wormhole) en Solana tiene mint 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh, permitiendo que el valor de BTC participe en operaciones entre cadenas.","ar":"wBTC هو الشكل المعبأ لبيتكوين على السلسلة. في هذا البحث، Wrapped BTC (Wormhole) على سولانا له mint هو 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh، ما يسمح لقيمة BTC بالمشاركة عبر السلاسل الأخرى.","fr":"wBTC est une forme enveloppée de Bitcoin en chaîne. Dans cette recherche, Wrapped BTC (Wormhole) sur Solana a un mint : 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh, permettant à la valeur du BTC de participer aux opérations inter-chaînes.","ru":"wBTC — обёрнутая форма биткоина в сети. В этом исследовании Wrapped BTC (Wormhole) в Solana имеет mint 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh, что позволяет ценности BTC участвовать в кроссчейн-операциях."}},{"id":46,"cat":"carrier","q":{"en":"What is the role of USDT in cross-chain?","zh":"USDT 在跨链中有什么作用？","es":"¿Qué papel juega USDT en los cruces entre cadenas?","ar":"ما دور USDT في العمليات عبر السلاسل؟","fr":"Quel est le rôle de l'USDT dans les transferts inter-chaînes ?","ru":"Какова роль USDT в кроссчейне?"},"a":{"en":"USDT is a widely used stablecoin. In this research it serves as a pricing and settlement carrier in cross-chain paths, helping keep value relatively stable across chains. Not investment advice.","zh":"USDT 是常见稳定币，在本研究中作为跨链结算与中转路径的计价载体，帮助在链间转移时保持价值相对稳定；本内容非投资建议。","es":"USDT es una stablecoin muy usada. En este estudio sirve como portador de valoración y liquidación en rutas entre cadenas, ayudando a mantener el valor estable. No es consejo de inversión.","ar":"USDT عملة مستقرة شائعة؛ في هذا البحث تُستخدم كأصل وسيط للتسعير والتسوية في مسارات العبور بين السلاسل، مما يساعد على استقرار القيمة نسبياً. هذا المحتوى ليس نصيحة استثمارية.","fr":"L'USDT est un stablecoin largement utilisé. Dans cette recherche, il sert de porteur de valorisation et de règlement sur les routes inter-chaînes, contribuant à stabiliser la valeur. Ceci n'est pas un conseil en investissement.","ru":"USDT — широко используемый стейблкоин. В этом исследовании он служит носителем для ценообразования и расчётов на кроссчейн-маршрутах, помогая сохранять относительную стабильность ценности. Это не инвестиционная рекомендация."}},{"id":47,"cat":"carrier","q":{"en":"What is the role of USDC in cross-chain?","zh":"USDC 在跨链中有什么作用？","es":"¿Qué papel juega USDC en los cruces entre cadenas?","ar":"ما دور USDC في العمليات عبر السلاسل؟","fr":"Quel est le rôle de l'USDC dans les transferts inter-chaînes ?","ru":"Какова роль USDC в кроссчейне?"},"a":{"en":"USDC is also a stablecoin. Similar to USDT, it can serve as a pricing and settlement carrier in cross-chain paths, combined with other carriers to support transfers.","zh":"USDC 也是稳定币，与 USDT 类似，可作为跨链路径中计价与结算的载体资产，与其他载体组合使用以支持跨链转移。","es":"USDC también es una stablecoin. Al igual que USDT, puede servir como portador de valoración y liquidación en rutas entre cadenas, combinándose con otros portadores.","ar":"USDC عملة مستقرة أيضاً، مثل USDT يمكن استخدامها كأصل حامل للتسعير والتسوية في مسارات العبور، مع أصول حاملة أخرى لدعم التحويلات.","fr":"L'USDC est aussi un stablecoin. Comme l'USDT, il peut servir de porteur de valorisation et de règlement sur les routes inter-chaînes, en combinaison avec d'autres porteurs.","ru":"USDC — тоже стейблкоин. Как и USDT, его можно использовать как носитель для ценообразования и расчётов на кроссчейн-маршрутах в сочетании с другими носителями."}},{"id":48,"cat":"carrier","q":{"en":"How do carrier assets reduce cross-chain costs?","zh":"载体资产如何降低跨链成本？","es":"¿Cómo reducen costes los activos portadores?","ar":"كيف يخفض الأصل الحامل تكاليف العبور؟","fr":"Comment les actifs porteurs réduisent-ils les coûts inter-chaînes ?","ru":"Как носители снижают стоимость кроссчейна?"},"a":{"en":"By concentrating value in highly liquid assets as a unified hub, they aggregate exchange demand across chains and reduce the overhead of deploying bridge liquidity per token, lowering overall costs.","zh":"通过把价值集中到流动性高的资产作为统一中转子，聚合多条链之间的兑换需求，减少逐币种铺设桥接流动性的开销，从而降低整体跨链成本。","es":"Al concentrar valor en activos muy líquidos como eje unificado, agregan la demanda de intercambio entre cadenas y reducen el gasto de liquidez por token, bajando el coste total.","ar":"بتركيز القيمة في أصول عالية السيولة كمحور موحد، تُجمَّع طلبات التبادل بين السلاسل، ويقل إنفاق توفير السيولة لكل عملة على حدة، مما يخفض التكلفة الإجمالية.","fr":"En concentrant la valeur sur des actifs très liquides comme hub unifié, ils regroupent la demande d'échange entre chaînes et réduisent la liquidité à déployer par token, abaissant le coût global.","ru":"Концентрируя ценность в высоколиквидных активах как едином хабе, они агрегируют спрос на обмен между сетями и сокращают издержки на ликвидность по каждому токену, снижая общую стоимость."}},{"id":49,"cat":"carrier","q":{"en":"What determines the safety of carrier assets?","zh":"载体资产的安全性由什么决定？","es":"¿De qué depende la seguridad de los activos portadores?","ar":"ما الذي يحدد أمان الأصل الحامل؟","fr":"Qu'est-ce qui détermine la sécurité des actifs porteurs ?","ru":"От чего зависит безопасность активов-носителей?"},"a":{"en":"Safety depends on the issuer's contract security, audits and reserve management, plus the security of the underlying blockchain. Verify contract addresses and project status before use.","zh":"由发行与托管方的合约安全、审计与储备管理，以及所在区块链本身的安全水平共同决定；使用前应核实合约地址与项目状态。","es":"Depende de la seguridad del contrato del emisor, auditorías y gestión de reservas, además de la seguridad de la cadena subyacente. Verifique direcciones y estado del proyecto antes de usar.","ar":"يحدده أمان العقد وجهة الإصدار والتدقيقات وإدارة الاحتياطيات، إضافة إلى أمان سلسلة الكتل نفسها. تحقق من عناوين العقود وحالة المشروع قبل الاستخدام.","fr":"Elle dépend de la sécurité des contrats de l'émetteur, des audits, de la gestion des réserves et de la sécurité de la blockchain sous-jacente. Vérifiez adresses et état du projet avant usage.","ru":"От безопасности контрактов эмитента, аудитов, управления резервами, а также от безопасности самой блокчейн-сети. Перед использованием сверяйте адреса и статус проекта."}},{"id":50,"cat":"carrier","q":{"en":"What is the difference between SOLANA (SOL) BEP20 and native SOL?","zh":"SOLANA (SOL) BEP20 与原生 SOL 差异？","es":"¿Cuál es la diferencia entre SOLANA (SOL) BEP20 y el SOL nativo?","ar":"ما الفرق بين SOLANA (SOL) BEP20 وSOL الأصلي؟","fr":"Quelle est la différence entre SOLANA (SOL) BEP20 et le SOL natif ?","ru":"В чём разница между SOLANA (SOL) BEP20 и нативным SOL?"},"a":{"en":"Native SOL is Solana's mainnet asset. SOLANA (SOL) BEP20 is a wrapped version on BSC at 0x570a5d26f7765ecb712c0924e4de545b89fd43df, representing corresponding value but living on a different chain.","zh":"原生 SOL 是 Solana 主网资产；SOLANA (SOL) BEP20 是其 BSC 上的封装版（0x570a5d26f7765ecb712c0924e4de545b89fd43df），价值对应但链不同。","es":"El SOL nativo es el activo de la red principal de Solana. SOLANA (SOL) BEP20 es la versión envuelta en BSC, dirección 0x570a5d26f7765ecb712c0924e4de545b89fd43df, con valor correspondiente en otra cadena.","ar":"SOL الأصلي هو أصل شبكة سولانا الرئيسية، بينما SOLANA (SOL) BEP20 هو إصدار معبأ على BSC بعنوان 0x570a5d26f7765ecb712c0924e4de545b89fd43df، بقيمة مقابلة لكنه يعمل على سلسلة مختلفة.","fr":"Le SOL natif est l'actif du mainnet de Solana. SOLANA (SOL) BEP20 est une version enveloppée sur BSC, adresse 0x570a5d26f7765ecb712c0924e4de545b89fd43df, de valeur correspondante sur une autre chaîne.","ru":"Нативный SOL — нативный актив сети Solana. SOLANA (SOL) BEP20 — обёрнутая версия в BSC по адресу 0x570a5d26f7765ecb712c0924e4de545b89fd43df, с соответствующей ценностью, но на другой сети."}},{"id":51,"cat":"mechanism","q":{"en":"How does lock & mint work?","zh":"锁定-铸造机制是如何工作的？","es":"¿Cómo funciona el bloqueo y acuñación?","ar":"كيف تعمل آلية القفل والسك؟","fr":"Comment fonctionne le verrouillage et la frappe ?","ru":"Как работает механизм блокировки и чеканки?"},"a":{"en":"Assets on the source chain are locked in a smart contract, and the target chain mints equivalent tokens at a 1:1 ratio. Redeeming burns the wrapped token and unlocks the original asset. It suits chains with smart contracts, as planned for EACO(BEP20).","zh":"源链资产锁入智能合约，目标链按 1:1 铸造对应代币；赎回时销毁包装代币并解锁源链资产。此方案适合有智能合约的链，是 EACO(BEP20) 路线采用的方案。","es":"Los activos de la cadena de origen se bloquean en un contrato inteligente y la cadena de destino acuña tokens equivalentes en proporción 1:1. Al canjear se queman y se desbloquean los originales. Es apto para cadenas con contratos inteligentes, como el plan de EACO(BEP20).","ar":"تُقفل أصول السلسلة المصدر في عقد ذكي، وتُسكّ السلسلة الهدف رموزًا مكافئة بنسبة ١:١؛ عند الاسترداد تُحرق الرموز ويُفك قفل الأصول الأصلية. يناسب هذا السلاسل ذات العقود الذكية، كما هو مخطط لرموز EACO(BEP20).","fr":"Les actifs de la chaîne source sont verrouillés dans un contrat intelligent, et la chaîne cible frappe des jetons équivalents à 1:1. Le rachat les brûle et déverrouille les actifs d'origine. Convient aux chaînes dotées de contrats intelligents, comme prévu pour EACO(BEP20).","ru":"Активы исходной цепи блокируются в смарт-контракте, а целевая цепь чеканит эквивалентные токены в соотношении 1:1. При погашении токены сжигаются, а исходные активы разблокируются. Подходит для цепей со смарт-контрактами, как в плане EACO(BEP20)."}},{"id":52,"cat":"mechanism","q":{"en":"How does custody & wrap work?","zh":"托管-包装机制是如何工作的？","es":"¿Cómo funciona la custodia y envoltura?","ar":"كيف تعمل آلية الحراسة والتغليف؟","fr":"Comment fonctionne la garde et l'empaquetage ?","ru":"Как работает механизм кастодиального хранения и обёртывания?"},"a":{"en":"When the native chain has no smart contracts, a federation of custodians holds the native coins and issues 1:1 wrapped tokens on the target chain. Redeeming burns the wrapped tokens and returns the native coins, as in the WBTC or Zeus zBTC models.","zh":"原生链无智能合约时，由联邦托管方保存原生币，并在目标链发行 1:1 包装币；赎回时销毁包装币并由托管方返还原生币，如 WBTC、Zeus zBTC 模式。","es":"Cuando la cadena nativa carece de contratos inteligentes, un conjunto de custodios guarda las monedas nativas y emite tokens envueltos 1:1 en la cadena de destino. Al canjear se queman y los custodios devuelven las monedas, como en los modelos WBTC o Zeus zBTC.","ar":"عندما تفتقر السلسلة الأصلية إلى عقود ذكية، يحتفظ اتحاد من الأمناء بالعملات الأصلية ويصدر رموزًا مغلَّفة بنسبة ١:١ على السلسلة الهدف؛ وعند الاسترداد تُحرق الرموز ويعيد الأمناء العملات الأصلية، كما في نموذجي WBTC وZeus zBTC.","fr":"Lorsque la chaîne native n'a pas de contrats intelligents, un groupe de dépositaires conserve les pièces natives et émet des jetons enveloppés à 1:1 sur la chaîne cible. Le rachat les brûle et les dépositaires restituent les pièces, comme dans les modèles WBTC ou Zeus zBTC.","ru":"Когда исходная цепь не имеет смарт-контрактов, федерация хранителей держит нативные монеты и выпускает обёрнутые токены 1:1 на целевой цепи. При погашении токены сжигаются, а хранители возвращают нативные монеты, как в моделях WBTC или Zeus zBTC."}},{"id":53,"cat":"mechanism","q":{"en":"How does liquidity routing work?","zh":"流动性路由机制是如何工作的？","es":"¿Cómo funciona el enrutamiento de liquidez?","ar":"كيف يعمل توجيه السيولة؟","fr":"Comment fonctionne le routage de liquidité ?","ru":"Как работает маршрутизация ликвидности?"},"a":{"en":"Liquidity routing moves value across chains through stablecoin pools like USDT and USDC: users deposit on the source chain and withdraw on the target chain, with liquidity providers settling the value. It suits transfers without issuing wrapped tokens.","zh":"通过 USDT、USDC 等稳定币流通池在链间转移价值：用户在源链存入、在目标链取出，价值由流动性提供者撮合完成，适合无需发行包装代币的链间转账。","es":"El enrutamiento de liquidez transfiere valor entre cadenas mediante pools de stablecoins como USDT y USDC: el usuario deposita en la cadena de origen y retira en la de destino, con proveedores de liquidez liquidando el valor. Es apto sin emitir tokens envueltos.","ar":"ينقل توجيه السيولة القيمة بين السلاسل عبر مجمعات العملات المستقرة مثل USDT وUSDC: يُودِع المستخدم في السلسلة المصدر ويسحب من السلسلة الهدف، ويتولى مزودو السيولة التسوية. مناسب للتحويلات دون إصدار رموز مغلَّفة.","fr":"Le routage de liquidité transfère de la valeur entre chaînes via des pools de stablecoins comme USDT et USDC : l'utilisateur dépose sur la chaîne source et retire sur la chaîne cible, les fournisseurs de liquidité réglant la valeur. Adapté sans émettre de jetons enveloppés.","ru":"Маршрутизация ликвидности переносит ценность между цепями через пулы стейблкоинов USDT и USDC: пользователь вносит средства на исходной цепи и выводит на целевой, а поставщики ликвидности проводят расчёт. Подходит для переводов без выпуска обёрнутых токенов."}},{"id":54,"cat":"mechanism","q":{"en":"How to choose among the three models?","zh":"三种跨链范式应该如何选择？","es":"¿Cómo elegir entre los tres modelos?","ar":"كيف نختار بين النماذج الثلاثة؟","fr":"Comment choisir entre les trois modèles ?","ru":"Как выбрать из трёх моделей?"},"a":{"en":"Prefer lock & mint for chains with smart contracts; use custody & wrap when the native chain lacks them; choose liquidity routing for convenience and stability. EACO's roadmap combines the three models in stages; the final choice follows the roadmap.","zh":"有智能合约的链优先锁定-铸造；原生链无智能合约则用托管-包装；追求便捷与稳定时选流动性路由。EACO 路线按阶段组合三种范式，具体取舍以路线图为准。","es":"Inclínese por el bloqueo y acuñación en cadenas con contratos inteligentes; use custodia y envoltura si la cadena nativa no los tiene; elija enrutamiento de liquidez por conveniencia y estabilidad. La hoja de ruta de EACO combina los tres modelos por etapas.","ar":"اختر نموذج القفل والسك للسلاسل ذات العقود الذكية؛ واستخدم الحراسة والتغليف عندما تفتقر السلسلة الأصلية إليها؛ واختر توجيه السيولة للراحة والاستقرار. تجمع خارطة طريق EACO بين النماذج الثلاثة على مراحل، والاختيار النهائي وفقًا للخارطة.","fr":"Privilégiez le verrouillage et la frappe sur les chaînes à contrats intelligents ; utilisez la garde et l'empaquetage quand la chaîne native n'en a pas ; choisissez le routage de liquidité pour la commodité et la stabilité. La feuille de route d'EACO combine ces trois modèles par étapes.","ru":"Для цепей со смарт-контрактами выбирайте блокировку и чеканку; при их отсутствии — кастодиальное хранение и обёртывание; для удобства и стабильности — маршрутизацию ликвидности. Дорожная карта EACO сочетает три модели поэтапно."}},{"id":55,"cat":"mechanism","q":{"en":"Why do UTXO chains rely on custody & wrap?","zh":"为什么 UTXO 链只能用托管-包装？","es":"¿Por qué las cadenas UTXO solo usan custodia y envoltura?","ar":"لماذا تعتمد سلاسل UTXO على الحراسة والتغليف فقط؟","fr":"Pourquoi les chaînes UTXO n'utilisent-elles que la garde et l'empaquetage ?","ru":"Почему UTXO-цепи используют только кастодиальное хранение и обёртывание?"},"a":{"en":"UTXO chains like DOGE and EAC lack smart contracts, so no locking contract can run. Custodians must hold the native coins and issue wrapped tokens on the target chain, making custody & wrap the only viable model.","zh":"DOGE、EAC 等 UTXO 链没有智能合约，无法运行锁定合约，只能由托管方持有原生币并在目标链发行包装币，因此托管-包装是唯一可行范式。","es":"Las cadenas UTXO como DOGE y EAC carecen de contratos inteligentes, así que no pueden ejecutar contratos de bloqueo. Los custodios deben guardar las monedas y emitir tokens envueltos en la cadena de destino; la custodia y envoltura es el único modelo viable.","ar":"تفتقر سلاسل UTXO مثل DOGE وEAC إلى العقود الذكية، فلا يمكن تشغيل عقود القفل؛ يجب أن يحتفظ الأمناء بالعملات الأصلية ويصدرون رموزًا مغلَّفة على السلسلة الهدف، لذا تعد الحراسة والتغليف النموذج الوحيد الممكن.","fr":"Les chaînes UTXO comme DOGE et EAC n'ont pas de contrats intelligents, donc aucun contrat de verrouillage ne peut fonctionner. Les dépositaires doivent conserver les pièces natives et émettre des jetons enveloppés ; la garde et l'empaquetage est le seul modèle viable.","ru":"UTXO-цепи, такие как DOGE и EAC, не имеют смарт-контрактов, поэтому контракт блокировки невозможен. Хранители должны держать нативные монеты и выпускать обёрнутые токены на целевой цепи — кастодиальное хранение и обёртывание остаётся единственной моделью."}},{"id":56,"cat":"mechanism","q":{"en":"Which model does EACO use for BSC?","zh":"EACO 跨链到 BSC 应采用哪种方案？","es":"¿Qué modelo usa EACO hacia BSC?","ar":"ما النموذج الذي تستخدمه EACO نحو BSC؟","fr":"Quel modèle EACO utilise-t-il pour BSC ?","ru":"Какую модель использует EACO для BSC?"},"a":{"en":"Phase A of the roadmap plans EACO(BEP20) on BNB Chain via lock & mint: EACO is locked on Solana and minted 1:1 on BSC. This remains in the research and exploration stage and is not yet live.","zh":"路线图 A 阶段计划在 BNB Chain 发行 EACO(BEP20)：Solana 端锁定，BSC 端 1:1 铸造，采用锁定-铸造。现处研究探索阶段，尚未落地。","es":"La fase A de la hoja de ruta planea EACO(BEP20) en BNB Chain mediante bloqueo y acuñación: EACO se bloquea en Solana y se acuña 1:1 en BSC. Sigue en fase de investigación y exploración, aún no está activo.","ar":"تخطط المرحلة A من خارطة الطريق لإصدار EACO(BEP20) على سلسلة BNB عبر نموذج القفل والسك: يُقفل EACO في Solana ويُسكّ بنسبة ١:١ في BSC. ما يزال المشروع في مرحلة البحث والاستكشاف ولم يُطلق بعد.","fr":"La phase A de la feuille de route prévoit EACO(BEP20) sur BNB Chain via le verrouillage et la frappe : EACO est verrouillé sur Solana et frappé à 1:1 sur BSC. Le projet reste en phase de recherche et d'exploration, pas
